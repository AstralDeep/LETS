[project]
name = "lets-demo"
version = "0.1.0"
description = "Dashboard that drives a LETS warden through a fleet of agents. Never published."
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
dependencies = [
  "lets-agent[server]",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
]

[tool.uv]
package = false

[tool.uv.sources]
lets-agent = { path = "..", editable = true }

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
