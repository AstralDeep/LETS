name: lets-acceptance

x-warden: &warden
  build:
    context: .
    dockerfile: Dockerfile
  image: lets-runtime:acceptance
  restart: unless-stopped
  networks: [lets-cluster]
  depends_on:
    bootstrap:
      condition: service_completed_successfully
  healthcheck:
    test:
      [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2).read()",
      ]
    interval: 2s
    timeout: 3s
    retries: 30
    start_period: 3s
  stop_grace_period: 10s

services:
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    image: lets-runtime:acceptance
    user: "0:0"
    command: ["python", "/app/deploy/bootstrap_cluster.py"]
    environment:
      LETS_BOOTSTRAP_TOKEN: ${LETS_BOOTSTRAP_TOKEN:-lets-acceptance-token-change-me-2026}
    volumes:
      - cluster-config:/cluster
      - operator-data:/operator
      - warden-a-data:/nodes/warden-a
      - warden-b-data:/nodes/warden-b
      - warden-c-data:/nodes/warden-c
    networks: [lets-cluster]
    restart: "no"

  warden-a:
    <<: *warden
    command:
      [
        "python",
        "/app/deploy/start_warden.py",
        "--config",
        "/var/lib/lets/config.json",
      ]
    environment:
      LETS_MANIFEST: /cluster/manifest.json
      LETS_OPERATOR_TRUST: /cluster/operator.json
    volumes:
      - cluster-config:/cluster:ro
      - warden-a-data:/var/lib/lets
    ports: ["127.0.0.1:18741:8080"]

  warden-b:
    <<: *warden
    command:
      [
        "python",
        "/app/deploy/start_warden.py",
        "--config",
        "/var/lib/lets/config.json",
      ]
    environment:
      LETS_MANIFEST: /cluster/manifest.json
      LETS_OPERATOR_TRUST: /cluster/operator.json
    volumes:
      - cluster-config:/cluster:ro
      - warden-b-data:/var/lib/lets
    ports: ["127.0.0.1:18742:8080"]

  warden-c:
    <<: *warden
    command:
      [
        "python",
        "/app/deploy/start_warden.py",
        "--config",
        "/var/lib/lets/config.json",
      ]
    environment:
      LETS_MANIFEST: /cluster/manifest.json
      LETS_OPERATOR_TRUST: /cluster/operator.json
    volumes:
      - cluster-config:/cluster:ro
      - warden-c-data:/var/lib/lets
    ports: ["127.0.0.1:18743:8080"]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    command: ["-host=0.0.0.0"]
    networks: [lets-cluster]
    ports:
      - "127.0.0.1:18474:8474"
      - "127.0.0.1:18666:8666"
      - "127.0.0.1:18667:8667"
    restart: unless-stopped

  proxy-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: lets-runtime:acceptance
    command:
      [
        "python",
        "/app/deploy/configure_toxiproxy.py",
        "--api",
        "http://toxiproxy:8474",
      ]
    depends_on:
      toxiproxy:
        condition: service_started
      warden-a:
        condition: service_healthy
      warden-b:
        condition: service_healthy
    networks: [lets-cluster]
    restart: "no"

networks:
  lets-cluster:
    driver: bridge

volumes:
  cluster-config:
  operator-data:
  warden-a-data:
  warden-b-data:
  warden-c-data:
