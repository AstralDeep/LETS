name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Verify the immutable signed comparison anchor
        run: uv run --no-project python -m benchmarks.astraldeep.check_version_disposition verify-anchor --repository .
      - run: uv lock --check
      - run: uv sync --all-extras --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src
      - name: Run tests and produce complete changed-code coverage input
        run: uv run --frozen pytest -m "not e2e" --cov=lets --cov=benchmarks.astraldeep --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: Create isolated changed-coverage tooling environment
        run: uv venv --python 3.14 .ci-tools
      - name: Install changed-coverage tooling from the immutable lock
        run: uv pip install --python .ci-tools --require-hashes -r tooling/python-ci/requirements.lock.txt
      - name: Enforce and record changed executable-line coverage against the pull-request or pushed base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || "$BASE_SHA" =~ ^0{40}$ ]]; then
            echo "::error::changed coverage requires a 40-hex non-zero base SHA, not '$BASE_SHA'"
            exit 1
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          rm -f changed-coverage-report.json changed-coverage-decision.json
          diff_cover_status=0
          .ci-tools/bin/diff-cover coverage.xml --compare-branch "$BASE_SHA" --diff-range-notation '..' --fail-under=90 --format json:changed-coverage-report.json || diff_cover_status=$?
          .ci-tools/bin/python scripts/check_changed_coverage.py --report changed-coverage-report.json --base-sha "$BASE_SHA" --fail-under 90 --output changed-coverage-decision.json
          exit "$diff_cover_status"
      - run: uv build

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Verify the immutable signed comparison anchor
        run: uv run --no-project python -m benchmarks.astraldeep.check_version_disposition verify-anchor --repository .
      - run: uv sync --all-extras --frozen
      - run: uv run --frozen pytest -m "not e2e"

  distributed-acceptance:
    name: distributed Docker acceptance
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Synchronize the repository-local environment
        run: uv sync --all-extras --frozen
      - name: Run the real three-node fault-injected acceptance
        run: uv run --frozen python deploy/run_acceptance.py
      - name: Archive distributed acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributed-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/generated/
          if-no-files-found: warn
          retention-days: 14

  required:
    name: LETS owner CI aggregate
    if: ${{ always() }}
    needs:
      - quality
      - test
      - distributed-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce every owner gate
        shell: bash
        run: |
          [[ '${{ needs.quality.result }}' == 'success' ]]
          [[ '${{ needs.test.result }}' == 'success' ]]
          [[ '${{ needs.distributed-acceptance.result }}' == 'success' ]]
