name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit for changed-line coverage on a manual run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Verify the immutable signed comparison anchor
        run: uv run --no-project python -m benchmarks.astraldeep.check_version_disposition verify-anchor --repository .
      - run: uv lock --check
      - run: uv sync --all-extras --frozen
      - name: Record immutable test and qualification-policy review diagnostics
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: uv run --frozen python scripts/ci_review_diagnostics.py --base "$BASE_SHA" --head "$HEAD_SHA" --output results/generated/ci/review-diagnostics.json
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src
      - name: Run tests and produce complete changed-code coverage input
        run: uv run --frozen pytest -m "not e2e" --cov=lets --cov=benchmarks.astraldeep --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: Prove public authority regressions detect removed guards
        run: uv run --frozen python scripts/check_public_contract_mutations.py --output results/generated/ci/public-contract-mutations.json
      - name: Qualify CI tooling with independent coverage
        env:
          COVERAGE_FILE: .coverage.ci-tooling
        run: uv run --frozen pytest tests/unit/test_ci_review_diagnostics.py tests/unit/test_public_contract_mutations.py --cov=scripts.ci_review_diagnostics --cov=scripts.check_public_contract_mutations --cov-report=xml:results/generated/ci/ci-tooling-coverage.xml --cov-report=term-missing --cov-fail-under=90
      - name: Archive public contract regression evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-contract-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/generated/ci/
          if-no-files-found: warn
          retention-days: 14
      - name: Create isolated changed-coverage tooling environment
        run: uv venv --python 3.14 .ci-tools
      - name: Install changed-coverage tooling from the immutable lock
        run: uv pip install --python .ci-tools --require-hashes -r tooling/python-ci/requirements.lock.txt
      - name: Enforce and record changed executable-line coverage against the pull-request or pushed base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || "$BASE_SHA" =~ ^0{40}$ ]]; then
            echo "::error::changed coverage requires a 40-hex non-zero base SHA, not '$BASE_SHA'"
            exit 1
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          rm -f changed-coverage-report.json changed-coverage-decision.json
          diff_cover_status=0
          .ci-tools/bin/diff-cover coverage.xml --compare-branch "$BASE_SHA" --diff-range-notation '..' --fail-under=90 --format json:changed-coverage-report.json || diff_cover_status=$?
          .ci-tools/bin/python scripts/check_changed_coverage.py --report changed-coverage-report.json --base-sha "$BASE_SHA" --fail-under 90 --output changed-coverage-decision.json
          exit "$diff_cover_status"
      - run: uv build

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify the immutable signed comparison anchor
        run: uv run --no-project python -m benchmarks.astraldeep.check_version_disposition verify-anchor --repository .
      - run: uv sync --all-extras --frozen
      - run: uv run --frozen pytest -m "not e2e" --durations=25

  distributed-acceptance:
    name: distributed Docker acceptance
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Synchronize the repository-local environment
        run: uv sync --all-extras --frozen
      - name: Run the real three-node fault-injected acceptance
        run: uv run --frozen python deploy/run_acceptance.py
      - name: Archive distributed acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributed-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/generated/
          if-no-files-found: warn
          retention-days: 14

  required:
    name: LETS owner CI aggregate
    if: ${{ always() }}
    needs:
      - quality
      - test
      - distributed-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce every owner gate
        shell: bash
        run: |
          [[ '${{ needs.quality.result }}' == 'success' ]]
          [[ '${{ needs.test.result }}' == 'success' ]]
          [[ '${{ needs.distributed-acceptance.result }}' == 'success' ]]
