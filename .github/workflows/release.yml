name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/astraldeep/lets

jobs:
  verify:
    name: Verify signed version tag
    if: github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
      - name: Match tag, package version, changelog, and main
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python - "$version" "$GITHUB_REF_NAME" <<'PY'
          import re
          import sys
          import ast
          from pathlib import Path

          version, tag = sys.argv[1:]
          if re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:[-+][0-9A-Za-z.-]+)?", version) is None:
              raise SystemExit(f"package version is not semantic: {version}")
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match package version {version!r}")
          module = ast.parse(Path("src/lets/__init__.py").read_text(encoding="utf-8"))
          exported = [
              node.value.value
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
              and isinstance(node.value, ast.Constant)
              and isinstance(node.value.value, str)
          ]
          if exported != [version]:
              raise SystemExit(f"lets.__version__ does not match package version: {exported!r}")
          PY
          grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)" || {
            echo "release tag must resolve to the current main commit" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require a GitHub-verified annotated tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}"
          object_type="$(gh api "$ref" --jq '.object.type')"
          object_sha="$(gh api "$ref" --jq '.object.sha')"
          test "$object_type" = "tag" || { echo "release tag must be annotated" >&2; exit 1; }
          tag="repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}"
          test "$(gh api "$tag" --jq '.verification.verified')" = "true" || {
            gh api "$tag" --jq '.verification.reason' >&2
            echo "GitHub did not verify the annotated tag signature" >&2
            exit 1
          }
          test "$(gh api "$tag" --jq '.object.type')" = "commit"
          test "$(gh api "$tag" --jq '.object.sha')" = "$GITHUB_SHA"
      - name: Require a verified commit and successful push gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
            --jq '.commit.verification.verified')" = "true" || {
            echo "release commit is not GitHub-verified" >&2
            exit 1
          }
          runs="$(mktemp)"
          trap 'rm -f "$runs"' EXIT
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=100" \
            > "$runs"
          RUNS="$runs" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["RUNS"]).read_text(encoding="utf-8"))
          runs = payload.get("workflow_runs")
          if not isinstance(runs, list):
              raise SystemExit("GitHub returned no workflow-run collection")
          required_workflows = {
              "ci": ".github/workflows/ci.yml",
              "security": ".github/workflows/security.yml",
          }
          for required, expected_path in required_workflows.items():
              candidates = [
                  run
                  for run in runs
                  if run.get("name") == required
                  and run.get("path") == expected_path
                  and run.get("head_sha") == os.environ["GITHUB_SHA"]
                  and run.get("event") == "push"
                  and run.get("status") == "completed"
              ]
              if not candidates:
                  raise SystemExit(
                      f"release commit has no completed {required!r} push workflow"
                  )
              latest = max(
                  candidates,
                  key=lambda run: (run.get("id", 0), run.get("run_attempt", 0)),
              )
              if latest.get("conclusion") != "success":
                  raise SystemExit(
                      f"latest {required!r} push workflow did not succeed: "
                      f"{latest.get('html_url')!r}"
                  )
          PY

  package:
    name: Rebuild, smoke, hash, and archive Python artifacts
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Re-run frozen quality and unit gates
        run: |
          uv lock --check
          uv sync --all-extras --frozen
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy src
          uv run --frozen pytest -m "not e2e"
          python deploy/production/check_build_context.py
      - name: Perform two clean reproducible builds
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          uv build --out-dir dist-first
          uv build --out-dir dist
          uvx --from twine==7.0.0 twine check dist/lets_agent-*
          version="${{ needs.verify.outputs.version }}"
          for directory in dist-first dist; do
            git archive --format=tar --prefix="lets-deployment-$version/" HEAD -- \
              CHANGELOG.md LICENSE NOTICE \
              deploy/production/.env.example \
              deploy/production/README.md \
              deploy/production/compose.yaml \
              deploy/production/healthcheck.py \
              deploy/production/maintenance-compose.yaml \
              deploy/production/provision-compose.yaml \
              deploy/production/stage_config.py \
              deploy/production/validate.py \
              docs/operations.md \
              docs/release.md \
              docs/runtime-providers.md \
              docs/upgrade-recovery.md \
              examples/runtime_provider.py \
              | gzip -n > "$directory/lets-deployment-$version.tar.gz"
          done
          python - <<'PY'
          import hashlib
          from pathlib import Path

          def hashes(directory: str) -> dict[str, str]:
              return {
                  path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in Path(directory).iterdir()
                  if path.is_file() and path.name.endswith((".whl", ".tar.gz"))
              }

          first = hashes("dist-first")
          second = hashes("dist")
          if first != second:
              raise SystemExit(f"release build is not reproducible: {first!r} != {second!r}")
          PY
      - name: Smoke-test the release wheel in isolation
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          test -f "dist/lets-deployment-${{ needs.verify.outputs.version }}.tar.gz"
          archive_contents="$(mktemp)"
          tar -tzf "dist/lets-deployment-${{ needs.verify.outputs.version }}.tar.gz" \
            > "$archive_contents"
          grep -q '/deploy/production/compose.yaml$' "$archive_contents"
          grep -q '/examples/runtime_provider.py$' "$archive_contents"
          rm -f "$archive_contents"
          uv export --frozen --no-dev --extra server --extra client \
            --no-emit-project --output-file requirements-release.txt
          uv venv --python 3.14 .release-smoke
          uv pip sync --python .release-smoke/bin/python requirements-release.txt
          uv pip install --python .release-smoke/bin/python --no-deps "$wheel"
          uv pip check --python .release-smoke/bin/python
          test "$(.release-smoke/bin/python -c 'import lets; print(lets.__version__)')" = \
            "${{ needs.verify.outputs.version }}"
          .release-smoke/bin/lets --help
          .release-smoke/bin/python -c "import fastapi, httpx, lets, uvicorn"
      - name: Generate the release SBOM and hashes
        shell: bash
        run: |
          set -euo pipefail
          uvx --from pip-audit==2.10.1 pip-audit --strict \
            --requirement requirements-release.txt
          uvx --from cyclonedx-bom==7.3.1 cyclonedx-py environment \
            .release-smoke/bin/python --pyproject pyproject.toml \
            --mc-type application --output-reproducible --output-format JSON \
            --output-file dist/lets-python.cdx.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          directory = Path("dist")
          sbom = json.loads((directory / "lets-python.cdx.json").read_text(encoding="utf-8"))
          assert sbom.get("bomFormat") == "CycloneDX" and sbom.get("components")
          assert (sbom.get("metadata") or {}).get("component", {}).get("name") == "lets-agent"
          artifacts = sorted(
              path
              for path in directory.iterdir()
              if path.is_file()
              and path.name.endswith((".whl", ".tar.gz", ".json"))
          )
          lines = [f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}" for path in artifacts]
          (directory / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Archive release package assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package-${{ needs.verify.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  image-candidate:
    name: Build and publish the uniquely addressed OCI candidate
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Record deterministic image metadata
        id: build-metadata
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          created="$(date --utc --date="@$epoch" +%Y-%m-%dT%H:%M:%SZ)"
          printf 'epoch=%s\ncreated=%s\n' "$epoch" "$created" >> "$GITHUB_OUTPUT"
      - name: Compute immutable OCI labels and tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.created=${{ steps.build-metadata.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
      - name: Resume an already promoted candidate without rebuilding
        id: resume
        env:
          EXPECTED_CREATED: ${{ steps.build-metadata.outputs.created }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_TAGS: ${{ steps.metadata.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          inspect_error="$(mktemp)"
          trap 'rm -f "$inspect_error"' EXIT
          existing_digests=()
          release_tags=()
          while IFS= read -r tag; do
            test -n "$tag" || continue
            release_tags+=("$tag")
            if digest="$(
              docker buildx imagetools inspect "$tag" \
                --format '{{.Manifest.Digest}}' 2>"$inspect_error"
            )"; then
              existing_digests+=("$digest")
              continue
            fi
            if ! grep -Eiq 'manifest unknown|not found|404' "$inspect_error"; then
              cat "$inspect_error" >&2
              echo "could not prove that release image tag is absent: $tag" >&2
              exit 1
            fi
          done <<< "$RELEASE_TAGS"
          if [ "${#release_tags[@]}" -ne 2 ]; then
            echo "release metadata did not produce exactly two immutable tags" >&2
            exit 1
          fi
          if [ "${#existing_digests[@]}" -eq 0 ]; then
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          digest="${existing_digests[0]}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "existing release tag has an invalid digest: $digest" >&2
            exit 1
          fi
          for existing in "${existing_digests[@]}"; do
            if [ "$existing" != "$digest" ]; then
              echo "existing immutable release tags resolve to different digests" >&2
              exit 1
            fi
          done

          docker buildx imagetools inspect "$IMAGE_NAME@$digest" \
            --format '{{json .}}' > resumed-image.json
          EXPECTED_DIGEST="$digest" python - <<'PY'
          import json
          import os
          from pathlib import Path

          document = json.loads(Path("resumed-image.json").read_text(encoding="utf-8"))
          expected_digest = os.environ["EXPECTED_DIGEST"]
          manifest = document.get("manifest") or {}
          if manifest.get("digest") != expected_digest:
              raise SystemExit("resumed image inspection returned the wrong index digest")

          images = document.get("image") or {}
          expected_labels = {
              "org.opencontainers.image.created": os.environ["EXPECTED_CREATED"],
              "org.opencontainers.image.revision": os.environ["GITHUB_SHA"],
              "org.opencontainers.image.version": os.environ["EXPECTED_VERSION"],
          }
          for platform, architecture in (
              ("linux/amd64", "amd64"),
              ("linux/arm64", "arm64"),
          ):
              image = images.get(platform) or {}
              if image.get("os") != "linux" or image.get("architecture") != architecture:
                  raise SystemExit(f"resumed image is missing exact {platform} configuration")
              labels = (image.get("config") or {}).get("Labels") or {}
              for name, expected in expected_labels.items():
                  if labels.get(name) != expected:
                      raise SystemExit(
                          f"resumed {platform} image label {name!r} is "
                          f"{labels.get(name)!r}, expected {expected!r}"
                      )
          PY
          workflow_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign verify-attestation \
            --type slsaprovenance1 \
            --certificate-identity "$workflow_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref "$GITHUB_REF" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            --certificate-github-workflow-trigger push \
            --output json \
            "$IMAGE_NAME@$digest" > resumed-candidate-provenance.json
          EXPECTED_DIGEST="$digest" python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          def json_documents(raw: str) -> list[object]:
              decoder = json.JSONDecoder()
              documents: list[object] = []
              offset = 0
              while offset < len(raw):
                  while offset < len(raw) and raw[offset].isspace():
                      offset += 1
                  if offset == len(raw):
                      break
                  document, offset = decoder.raw_decode(raw, offset)
                  documents.extend(document if isinstance(document, list) else [document])
              return documents

          repository_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
          expected_predicate = {
              "buildDefinition": {
                  "buildType": "https://slsa-framework.github.io/github-actions-buildtypes/workflow/v1",
                  "externalParameters": {
                      "candidate": f"{os.environ['IMAGE_NAME']}@{os.environ['EXPECTED_DIGEST']}",
                      "created": os.environ["EXPECTED_CREATED"],
                      "version": os.environ["EXPECTED_VERSION"],
                      "workflow": {
                          "path": ".github/workflows/release.yml",
                          "ref": os.environ["GITHUB_REF"],
                          "repository": repository_url,
                      },
                  },
                  "resolvedDependencies": [
                      {
                          "digest": {"gitCommit": os.environ["GITHUB_SHA"]},
                          "uri": f"git+{repository_url}@{os.environ['GITHUB_REF']}",
                      }
                  ],
              },
              "runDetails": {
                  "builder": {"id": "https://github.com/actions/runner/github-hosted"}
              },
          }
          expected_statement = {
              "_type": "https://in-toto.io/Statement/v0.1",
              "predicateType": "https://slsa.dev/provenance/v1",
              "subject": [
                  {
                      "digest": {
                          "sha256": os.environ["EXPECTED_DIGEST"].removeprefix("sha256:")
                      },
                      "name": os.environ["IMAGE_NAME"],
                  }
              ],
              "predicate": expected_predicate,
          }
          envelopes = json_documents(
              Path("resumed-candidate-provenance.json").read_text(encoding="utf-8")
          )
          for envelope in envelopes:
              if not isinstance(envelope, dict) or not isinstance(envelope.get("payload"), str):
                  continue
              statement = json.loads(
                  base64.b64decode(envelope["payload"], validate=True).decode("utf-8")
              )
              if statement == expected_statement:
                  break
          else:
              raise SystemExit("resumed image lacks the exact signed candidate provenance")
          PY
          printf 'build_required=false\ndigest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Publish the multi-architecture release candidate
        id: push
        if: steps.resume.outputs.build_required == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.build-metadata.outputs.epoch }}
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          outputs: type=registry,rewrite-timestamp=true
          tags: >-
            ${{ env.IMAGE_NAME }}:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: false
          sbom: false
          build-args: |
            BUILD_DATE=${{ steps.build-metadata.outputs.created }}
            SOURCE_DATE_EPOCH=${{ steps.build-metadata.outputs.epoch }}
            VERSION=${{ needs.verify.outputs.version }}
            VCS_REF=${{ github.sha }}
      - name: Keyless-attest and verify exact candidate build provenance
        if: steps.resume.outputs.build_required == 'true'
        env:
          CANDIDATE_DIGEST: ${{ steps.push.outputs.digest }}
          EXPECTED_CREATED: ${{ steps.build-metadata.outputs.created }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "new candidate digest is missing or invalid: $CANDIDATE_DIGEST" >&2
            exit 1
          fi
          workflow_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          repository_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
          predicate = {
              "buildDefinition": {
                  "buildType": "https://slsa-framework.github.io/github-actions-buildtypes/workflow/v1",
                  "externalParameters": {
                      "candidate": f"{os.environ['IMAGE_NAME']}@{os.environ['CANDIDATE_DIGEST']}",
                      "created": os.environ["EXPECTED_CREATED"],
                      "version": os.environ["EXPECTED_VERSION"],
                      "workflow": {
                          "path": ".github/workflows/release.yml",
                          "ref": os.environ["GITHUB_REF"],
                          "repository": repository_url,
                      },
                  },
                  "resolvedDependencies": [
                      {
                          "digest": {"gitCommit": os.environ["GITHUB_SHA"]},
                          "uri": f"git+{repository_url}@{os.environ['GITHUB_REF']}",
                      }
                  ],
              },
              "runDetails": {
                  "builder": {"id": "https://github.com/actions/runner/github-hosted"}
              },
          }
          Path("candidate-provenance.json").write_text(
              json.dumps(predicate, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cosign attest --yes \
            --predicate candidate-provenance.json \
            --type slsaprovenance1 \
            "$IMAGE_NAME@$CANDIDATE_DIGEST"
          cosign verify-attestation \
            --type slsaprovenance1 \
            --certificate-identity "$workflow_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref "$GITHUB_REF" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            --certificate-github-workflow-trigger push \
            --output json \
            "$IMAGE_NAME@$CANDIDATE_DIGEST" > candidate-provenance-verification.json
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          def json_documents(raw: str) -> list[object]:
              decoder = json.JSONDecoder()
              documents: list[object] = []
              offset = 0
              while offset < len(raw):
                  while offset < len(raw) and raw[offset].isspace():
                      offset += 1
                  if offset == len(raw):
                      break
                  document, offset = decoder.raw_decode(raw, offset)
                  documents.extend(document if isinstance(document, list) else [document])
              return documents

          expected_statement = {
              "_type": "https://in-toto.io/Statement/v0.1",
              "predicateType": "https://slsa.dev/provenance/v1",
              "subject": [
                  {
                      "digest": {
                          "sha256": os.environ["CANDIDATE_DIGEST"].removeprefix("sha256:")
                      },
                      "name": os.environ["IMAGE_NAME"],
                  }
              ],
              "predicate": json.loads(
                  Path("candidate-provenance.json").read_text(encoding="utf-8")
              ),
          }
          envelopes = json_documents(
              Path("candidate-provenance-verification.json").read_text(encoding="utf-8")
          )
          for envelope in envelopes:
              if not isinstance(envelope, dict) or not isinstance(envelope.get("payload"), str):
                  continue
              statement = json.loads(
                  base64.b64decode(envelope["payload"], validate=True).decode("utf-8")
              )
              if statement == expected_statement:
                  break
          else:
              raise SystemExit("new image lacks the exact signed candidate provenance")
          PY
      - name: Select the exact new or resumed candidate digest
        id: candidate
        env:
          BUILT_DIGEST: ${{ steps.push.outputs.digest }}
          RESUMED_DIGEST: ${{ steps.resume.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          digest="${RESUMED_DIGEST:-$BUILT_DIGEST}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "candidate digest is missing or invalid: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  production-acceptance:
    name: Exercise the exact published candidate in the hardened three-node profile
    needs: [verify, package, image-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Log in to GHCR for the exact candidate
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Synchronize the frozen repository environment
        run: uv sync --all-extras --frozen
      - name: Run the mTLS production-profile acceptance against the exact candidate
        env:
          LETS_PRODUCTION_ACCEPTANCE_IMAGE: >-
            ${{ env.IMAGE_NAME }}@${{ needs.image-candidate.outputs.digest }}
        run: uv run --frozen python deploy/production/run_acceptance.py
      - name: Require acceptance evidence to bind the exact candidate digest
        env:
          EXPECTED_IMAGE: ${{ env.IMAGE_NAME }}@${{ needs.image-candidate.outputs.digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              Path("results/generated/production-profile-acceptance.json").read_text(
                  encoding="utf-8"
              )
          )
          actual = evidence.get("runtime_image_digest")
          if actual != os.environ["EXPECTED_IMAGE"]:
              raise SystemExit(
                  f"production acceptance used {actual!r}, expected {os.environ['EXPECTED_IMAGE']!r}"
              )
          PY
      - name: Archive production-profile evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-production-acceptance-${{ needs.verify.outputs.version }}
          path: results/generated/production-profile-acceptance.json
          if-no-files-found: error
          retention-days: 90

  production-soak:
    name: Sustain the exact published candidate under mixed traffic and repeated faults
    needs: [verify, package, image-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Log in to GHCR for the exact candidate
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Synchronize the frozen repository environment
        run: uv sync --all-extras --frozen
      - name: Run the one-hour production-profile soak against the exact candidate
        env:
          EXACT_IMAGE: >-
            ${{ env.IMAGE_NAME }}@${{ needs.image-candidate.outputs.digest }}
        run: >-
          uv run --frozen python deploy/production/run_soak.py
          --image "$EXACT_IMAGE"
          --duration-seconds 3600
          --output results/generated/production-profile-soak.json
      - name: Require sustained evidence to bind the exact candidate and source
        env:
          EXPECTED_IMAGE: >-
            ${{ env.IMAGE_NAME }}@${{ needs.image-candidate.outputs.digest }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import math
          import os
          import re
          from pathlib import Path

          def reject_constant(value):
              raise ValueError(f"non-finite JSON number is forbidden: {value}")

          def unique_object(pairs):
              document = {}
              for key, value in pairs:
                  if key in document:
                      raise ValueError(f"duplicate JSON key is forbidden: {key}")
                  document[key] = value
              return document

          evidence = json.loads(
              Path("results/generated/production-profile-soak.json").read_text(
                  encoding="utf-8"
              ),
              object_pairs_hook=unique_object,
              parse_constant=reject_constant,
          )
          if not isinstance(evidence, dict):
              raise SystemExit("soak evidence root is malformed")
          failures = []

          def required_mapping(value, label):
              if isinstance(value, dict):
                  return value
              failures.append(f"{label} is malformed")
              return {}

          def required_list(value, label):
              if isinstance(value, list):
                  return value
              failures.append(f"{label} is malformed")
              return []

          claimed_evidence_digest = evidence.get("evidence_payload_sha256")
          canonical_evidence = dict(evidence)
          canonical_evidence.pop("evidence_payload_sha256", None)
          computed_evidence_digest = "sha256:" + hashlib.sha256(
              json.dumps(
                  canonical_evidence,
                  ensure_ascii=True,
                  separators=(",", ":"),
                  sort_keys=True,
              ).encode("utf-8")
          ).hexdigest()
          if (
              not isinstance(claimed_evidence_digest, str)
              or re.fullmatch(r"sha256:[0-9a-f]{64}", claimed_evidence_digest) is None
              or claimed_evidence_digest != computed_evidence_digest
          ):
              failures.append("soak evidence payload digest is invalid")
          if evidence.get("passed") is not True:
              failures.append("soak did not pass")
          image_evidence = required_mapping(evidence.get("image"), "soak image evidence")
          if image_evidence.get("configured_digest") != os.environ["EXPECTED_IMAGE"]:
              failures.append("soak used the wrong image digest")
          source = required_mapping(evidence.get("source"), "soak source evidence")
          if source.get("git_commit") != os.environ["GITHUB_SHA"] or source.get("dirty") is not False:
              failures.append("soak source was not the exact clean release commit")
          configuration = required_mapping(
              evidence.get("configuration"), "soak configuration"
          )
          workload = required_mapping(evidence.get("workload"), "soak workload evidence")
          expected_release_configuration = {
              "convergence_timeout_seconds": 180.0,
              "cycle_interval_seconds": 0.5,
              "duration_seconds": 3600.0,
              "executor_reopen_every_cycles": 10,
              "health_interval_seconds": 10.0,
              "image": os.environ["EXPECTED_IMAGE"],
              "initial_share": 1_000_000,
              "partition_duration_seconds": 20.0,
              "partition_interval_seconds": 90.0,
              "resource_interval_seconds": 5.0,
              "restart_interval_seconds": 900.0,
              "retry_timeout_seconds": 90.0,
              "seed": 20260809,
              "smoke": False,
              "transfer_every_cycles": 3,
          }
          if configuration != expected_release_configuration or any(
              type(configuration.get(name)) is not type(expected)
              for name, expected in expected_release_configuration.items()
          ):
              failures.append("soak did not use the exact one-hour release profile")
          workload_duration_value = workload.get("duration_seconds")
          if (
              not isinstance(workload_duration_value, (int, float))
              or isinstance(workload_duration_value, bool)
              or not math.isfinite(float(workload_duration_value))
              or float(workload_duration_value) < 3600
          ):
              failures.append("mixed workload stopped before one hour")
          workload_evaluation = required_mapping(
              evidence.get("workload_evaluation"), "soak workload evaluation"
          )
          if workload_evaluation.get("passed") is not True:
              failures.append("soak workload adequacy checks did not pass")
          workload_metrics = required_mapping(
              workload_evaluation.get("metrics"), "soak workload metrics"
          )
          workload_checks = required_mapping(
              workload_evaluation.get("checks"), "soak workload checks"
          )
          if workload_checks.get("health_cadence") is not True:
              failures.append("soak health samples did not cover every audit-stall window")
          audit_progress = workload.get("audit_progress")
          if not isinstance(audit_progress, dict):
              failures.append("soak audit progress is malformed")
              audit_progress = {}
          error_sample_budget = audit_progress.get("error_sample_budget")
          error_sample_count = audit_progress.get("error_sample_count")
          recovered_error_sample_count = audit_progress.get("recovered_error_sample_count")
          unresolved_error_nodes = audit_progress.get("unresolved_error_nodes")
          error_samples_by_node = audit_progress.get("error_samples_by_node")
          recorded_error_sample_count = audit_progress.get("recorded_error_sample_count")
          recorded_error_samples_by_node = audit_progress.get("recorded_error_samples_by_node")
          recorded_recovered_error_sample_count = audit_progress.get(
              "recorded_recovered_error_sample_count"
          )
          recorded_unresolved_error_nodes = audit_progress.get(
              "recorded_unresolved_error_nodes"
          )
          expected_nodes = {"warden-a", "warden-b", "warden-c"}
          audit_busy_pattern = re.compile(
              r"\AStorageError: could not connect to the audit archive "
              r"\(sqlite_errorname=(SQLITE_BUSY(?:_[A-Z0-9_]+)?), "
              r"sqlite_errorcode=([0-9]+)\)\Z"
          )
          def finite_number(value):
              return (
                  isinstance(value, (int, float))
                  and not isinstance(value, bool)
                  and math.isfinite(float(value))
              )

          def close_number(left, right, tolerance=0.002):
              return (
                  finite_number(left)
                  and finite_number(right)
                  and abs(float(left) - float(right)) <= tolerance
              )

          configured_duration = (
              float(configuration["duration_seconds"])
              if finite_number(configuration.get("duration_seconds"))
              else 0.0
          )

          chaos = required_mapping(evidence.get("chaos"), "soak chaos evidence")
          partitions = required_list(chaos.get("partitions"), "soak partition evidence")
          restarts = required_list(chaos.get("restarts"), "soak restart evidence")
          orchestration = required_mapping(
              evidence.get("orchestration"), "soak orchestration evidence"
          )
          workload_start = orchestration.get("workload_start")
          chaos_started = orchestration.get("chaos_started_monotonic_seconds")
          chaos_completed = orchestration.get("chaos_completed_monotonic_seconds")
          expected_workload_configuration = {
              "cycle_interval_seconds": configuration.get("cycle_interval_seconds"),
              "duration_seconds": configuration.get("duration_seconds"),
              "executor_reopen_every_cycles": configuration.get(
                  "executor_reopen_every_cycles"
              ),
              "health_interval_seconds": configuration.get("health_interval_seconds"),
              "retry_timeout_seconds": configuration.get("retry_timeout_seconds"),
              "seed": configuration.get("seed"),
              "transfer_every_cycles": configuration.get("transfer_every_cycles"),
          }
          workload_identity_valid = (
              evidence.get("schema") == "lets.production-profile-soak/v2"
              and workload.get("schema") == "lets.production-profile-soak-workload/v2"
              and workload.get("status") == "passed"
              and workload.get("configuration") == expected_workload_configuration
              and isinstance(workload_start, dict)
              and isinstance(workload.get("run_id"), str)
              and bool(workload.get("run_id"))
              and workload_start.get("run_id") == workload.get("run_id")
              and workload_start.get("schema")
              == "lets.production-profile-soak-workload-start/v1"
              and workload_start.get("started_monotonic_seconds")
              == workload.get("started_monotonic_seconds")
              and workload_start.get("duration_seconds")
              == configuration.get("duration_seconds")
              and workload_start.get("cycle_interval_seconds")
              == configuration.get("cycle_interval_seconds")
              and workload_start.get("health_interval_seconds")
              == configuration.get("health_interval_seconds")
              and workload_start.get("retry_timeout_seconds")
              == configuration.get("retry_timeout_seconds")
              and workload_start.get("transfer_every_cycles")
              == configuration.get("transfer_every_cycles")
              and workload_start.get("executor_reopen_every_cycles")
              == configuration.get("executor_reopen_every_cycles")
              and workload_start.get("seed") == configuration.get("seed")
              and finite_number(workload_start.get("started_monotonic_seconds"))
              and finite_number(workload_start.get("host_wait_started_monotonic_seconds"))
              and finite_number(workload_start.get("host_received_monotonic_seconds"))
              and finite_number(chaos_started)
              and finite_number(chaos_completed)
              and float(workload_start["host_wait_started_monotonic_seconds"])
              <= float(workload_start["host_received_monotonic_seconds"])
              <= float(chaos_started)
              <= float(chaos_completed)
          )
          if not workload_identity_valid:
              failures.append("soak workload/startup identity or configuration is inconsistent")
          if (
              workload_checks.get("workload_identity") is not True
              or workload_checks.get("chaos_start_binding") is not True
          ):
              failures.append("soak evaluator did not bind workload and chaos startup")

          raw_restart_valid = workload_identity_valid and len(restarts) >= 3
          restart_bindings = {}
          restart_windows = {node: [] for node in expected_nodes}
          raw_restart_services = []
          if raw_restart_valid:
              for episode, restart in enumerate(restarts):
                  if not isinstance(restart, dict):
                      raw_restart_valid = False
                      continue
                  service = restart.get("service")
                  host_started = restart.get("host_operation_started_monotonic_seconds")
                  host_completed = restart.get("host_operation_completed_monotonic_seconds")
                  coordination = restart.get("workload_coordination")
                  if (
                      service not in expected_nodes
                      or service != ("warden-a", "warden-b", "warden-c")[episode % 3]
                      or restart.get("signal") != "SIGKILL"
                      or restart.get("planned_exit_code") != 137
                      or not isinstance(restart.get("prior_container_id"), str)
                      or not isinstance(restart.get("new_container_id"), str)
                      or re.fullmatch(
                          r"[0-9a-f]{12,64}",
                          restart.get("prior_container_id", ""),
                      )
                      is None
                      or re.fullmatch(
                          r"[0-9a-f]{12,64}",
                          restart.get("new_container_id", ""),
                      )
                      is None
                      or restart.get("prior_container_id") == restart.get("new_container_id")
                      or not isinstance(restart.get("prior_pid"), int)
                      or isinstance(restart.get("prior_pid"), bool)
                      or not isinstance(restart.get("new_pid"), int)
                      or isinstance(restart.get("new_pid"), bool)
                      or restart.get("prior_pid") <= 1
                      or restart.get("new_pid") <= 1
                      or restart.get("prior_pid") == restart.get("new_pid")
                      or restart.get("restart_counts")
                      != {"after": 0, "killed": 0, "prior": 0}
                      or not finite_number(restart.get("elapsed_seconds"))
                      or float(restart.get("elapsed_seconds")) < 0
                      or not finite_number(host_started)
                      or not finite_number(host_completed)
                      or not float(host_started) < float(host_completed)
                      or float(host_completed) - float(host_started) > 30.0
                      or not float(chaos_started)
                      <= float(host_started)
                      < float(host_completed)
                      <= float(chaos_completed)
                      or not isinstance(coordination, dict)
                  ):
                      raw_restart_valid = False
                      continue
                  raw_restart_services.append(service)
                  armed = coordination.get("armed")
                  completed = coordination.get("completed")
                  if not isinstance(armed, dict) or not isinstance(completed, dict):
                      raw_restart_valid = False
                      continue
                  armed_marker = armed.get("marker")
                  acknowledgement = armed.get("acknowledgement")
                  completed_marker = completed.get("marker")
                  recovery = completed.get("recovery_acknowledgement")
                  if not all(
                      isinstance(item, dict)
                      for item in (
                          armed_marker,
                          acknowledgement,
                          completed_marker,
                          recovery,
                      )
                  ):
                      raw_restart_valid = False
                      continue
                  identity = (
                      "armed_monotonic_seconds",
                      "episode",
                      "restart_id",
                      "service",
                  )
                  restart_id = armed_marker.get("restart_id")
                  identity_valid = (
                      isinstance(restart_id, str)
                      and bool(restart_id)
                      and restart_id not in restart_bindings
                      and all(
                          type(document.get("episode")) is int
                          for document in (
                              armed_marker, acknowledgement, completed_marker, recovery
                          )
                      )
                      and armed_marker.get("episode") == episode
                      and armed_marker.get("service") == service
                      and armed_marker.get("state") == "armed"
                      and armed_marker.get("completed_monotonic_seconds") is None
                      and completed_marker.get("state") == "completed"
                      and all(
                          completed_marker.get(key) == armed_marker.get(key)
                          for key in identity
                      )
                      and all(
                          acknowledgement.get(key) == armed_marker.get(key)
                          for key in identity
                      )
                      and all(
                          recovery.get(key) == armed_marker.get(key)
                          for key in identity
                      )
                  )
                  acknowledged = acknowledgement.get("acknowledged_monotonic_seconds")
                  completed_at = completed_marker.get("completed_monotonic_seconds")
                  recovered = recovery.get("recovered_monotonic_seconds")
                  container_timing_valid = (
                      finite_number(armed_marker.get("armed_monotonic_seconds"))
                      and finite_number(acknowledged)
                      and finite_number(completed_at)
                      and finite_number(recovered)
                      and recovery.get("acknowledged_monotonic_seconds") == acknowledged
                      and recovery.get("completed_monotonic_seconds") == completed_at
                      and float(armed_marker["armed_monotonic_seconds"])
                      <= float(acknowledged)
                      <= float(completed_at)
                      <= float(recovered)
                      and float(completed_at) - float(acknowledged) <= 30.0
                      and float(recovered) - float(completed_at) <= 15.0
                  )
                  host_values = (
                      armed.get("host_armed_started_monotonic_seconds"),
                      armed.get("host_monitor_acknowledged_monotonic_seconds"),
                      completed.get("host_completed_marker_monotonic_seconds"),
                      completed.get("host_monitor_recovered_monotonic_seconds"),
                  )
                  host_timing_valid = (
                      all(finite_number(value) for value in host_values)
                      and float(host_values[0])
                      >= float(chaos_started)
                      and float(host_values[0])
                      <= float(host_values[1])
                      <= float(host_started)
                      < float(host_completed)
                      <= float(host_values[2])
                      <= float(host_values[3])
                      <= float(chaos_completed)
                  )
                  if not identity_valid or not container_timing_valid or not host_timing_valid:
                      raw_restart_valid = False
                      continue
                  start_elapsed = float(acknowledged) - float(
                      workload_start["started_monotonic_seconds"]
                  )
                  end_elapsed = float(completed_at) - float(
                      workload_start["started_monotonic_seconds"]
                  )
                  if start_elapsed < 0 or end_elapsed < start_elapsed:
                      raw_restart_valid = False
                      continue
                  if float(armed_marker["armed_monotonic_seconds"]) < float(
                      workload_start["started_monotonic_seconds"]
                  ):
                      raw_restart_valid = False
                      continue
                  binding = {
                      "armed_marker": armed_marker,
                      "completed_marker": completed_marker,
                      "end_elapsed_seconds": end_elapsed,
                      "episode": episode,
                      "restart_id": restart_id,
                      "service": service,
                      "start_elapsed_seconds": start_elapsed,
                  }
                  restart_bindings[restart_id] = binding
                  restart_windows[service].append(
                      {
                          key: binding[key]
                          for key in (
                              "end_elapsed_seconds",
                              "episode",
                              "restart_id",
                              "service",
                              "start_elapsed_seconds",
                          )
                      }
                  )
          for node, windows in restart_windows.items():
              ordered = sorted(windows, key=lambda item: item["start_elapsed_seconds"])
              if any(
                  right["start_elapsed_seconds"] < left["end_elapsed_seconds"]
                  for left, right in zip(ordered, ordered[1:])
              ):
                  raw_restart_valid = False
              restart_windows[node] = ordered
          if set(raw_restart_services) != expected_nodes:
              raw_restart_valid = False
          global_restart_windows = sorted(
              (
                  window
                  for windows in restart_windows.values()
                  for window in windows
              ),
              key=lambda item: item["start_elapsed_seconds"],
          )
          if any(
              right["start_elapsed_seconds"] < left["end_elapsed_seconds"]
              for left, right in zip(
                  global_restart_windows,
                  global_restart_windows[1:],
              )
          ):
              raw_restart_valid = False
          host_restart_operations = sorted(
              (
                  float(item["host_operation_started_monotonic_seconds"]),
                  float(item["host_operation_completed_monotonic_seconds"]),
              )
              for item in restarts
              if isinstance(item, dict)
              and finite_number(item.get("host_operation_started_monotonic_seconds"))
              and finite_number(item.get("host_operation_completed_monotonic_seconds"))
          )
          if any(
              right[0] < left[1]
              for left, right in zip(
                  host_restart_operations,
                  host_restart_operations[1:],
              )
          ):
              raw_restart_valid = False
          restart_metrics = workload_metrics.get("restart_evidence", {})
          raw_restart_valid = (
              raw_restart_valid
              and isinstance(restart_metrics, dict)
              and restart_metrics.get("passed") is True
              and restart_metrics.get("binding_count") == len(restart_bindings)
              and restart_metrics.get("bindings") == restart_bindings
              and restart_metrics.get("windows_by_node") == restart_windows
          )
          if not raw_restart_valid:
              failures.append("soak restart cadence exclusions are not raw-bound")

          pause_intervals_value = workload.get("pause_intervals")
          pause_intervals = (
              pause_intervals_value if isinstance(pause_intervals_value, list) else []
          )
          raw_pause_valid = (
              isinstance(pause_intervals_value, list)
              and workload.get("pause_interval_count")
              == len(pause_intervals)
              == len(partitions)
              and close_number(
                  workload.get("measurement_window_seconds"),
                  configuration.get("duration_seconds"),
              )
              and workload_identity_valid
          )
          workload_pause_seconds = 0.0
          authorized_pause_seconds = 0.0
          raw_pause_bindings = []
          seen_pause_ids = set()
          prior_workload_end = -math.inf
          prior_host_end = -math.inf
          if raw_pause_valid:
              origin = float(workload_start["started_monotonic_seconds"])
              measurement_duration = float(configuration["duration_seconds"])
              for episode, (pause, partition) in enumerate(
                  zip(pause_intervals, partitions, strict=True)
              ):
                  if not isinstance(pause, dict) or not isinstance(partition, dict):
                      raw_pause_valid = False
                      continue
                  coordination = partition.get("workload_coordination")
                  if not isinstance(coordination, dict):
                      raw_pause_valid = False
                      continue
                  marker = coordination.get("marker")
                  acknowledgement = coordination.get("acknowledgement")
                  start_boundary = coordination.get("authorized_start")
                  end_boundary = coordination.get("authorized_end")
                  if not all(
                      isinstance(item, dict)
                      for item in (marker, acknowledgement, start_boundary, end_boundary)
                  ):
                      raw_pause_valid = False
                      continue
                  identity = ("episode", "pause_id", "requested_monotonic_seconds")
                  pause_id = pause.get("pause_id")
                  identity_valid = (
                      isinstance(pause_id, str)
                      and bool(pause_id)
                      and pause_id not in seen_pause_ids
                      and partition.get("episode") == episode
                      and pause.get("episode") == episode
                      and all(marker.get(key) == pause.get(key) for key in identity)
                      and all(
                          acknowledgement.get(key) == pause.get(key) for key in identity
                      )
                      and all(
                          start_boundary.get(key) == pause.get(key) for key in identity
                      )
                      and all(
                          end_boundary.get(key) == pause.get(key) for key in identity
                      )
                      and all(
                          coordination.get(key) == pause.get(key) for key in identity
                      )
                      and acknowledgement.get("paused") is True
                      and acknowledgement.get("observed_monotonic_seconds")
                      == pause.get("observed_monotonic_seconds")
                  )
                  numeric = (
                      pause.get("requested_monotonic_seconds"),
                      pause.get("observed_monotonic_seconds"),
                      pause.get("resumed_monotonic_seconds"),
                      pause.get("observed_elapsed_seconds"),
                      pause.get("resumed_elapsed_seconds"),
                      pause.get("duration_seconds"),
                      pause.get("measurement_clipped_duration_seconds"),
                      start_boundary.get("authorized_start_monotonic_seconds"),
                      start_boundary.get("host_boundary_started_monotonic_seconds"),
                      start_boundary.get("host_boundary_completed_monotonic_seconds"),
                      end_boundary.get("authorized_end_monotonic_seconds"),
                      end_boundary.get("host_boundary_started_monotonic_seconds"),
                      end_boundary.get("host_boundary_completed_monotonic_seconds"),
                      coordination.get("host_request_started_monotonic_seconds"),
                      coordination.get("host_acknowledged_monotonic_seconds"),
                      coordination.get("host_resume_started_monotonic_seconds"),
                      coordination.get("host_resume_completed_monotonic_seconds"),
                      coordination.get("workload_resume_requested_monotonic_seconds"),
                      coordination.get("host_pause_duration_seconds"),
                      partition.get("disabled_monotonic_seconds"),
                      partition.get("restored_monotonic_seconds"),
                  )
                  if not identity_valid or not all(finite_number(value) for value in numeric):
                      raw_pause_valid = False
                      continue
                  requested = float(pause["requested_monotonic_seconds"])
                  observed = float(pause["observed_monotonic_seconds"])
                  resumed = float(pause["resumed_monotonic_seconds"])
                  observed_elapsed = float(pause["observed_elapsed_seconds"])
                  resumed_elapsed = float(pause["resumed_elapsed_seconds"])
                  authorized_start = float(
                      start_boundary["authorized_start_monotonic_seconds"]
                  )
                  authorized_end = float(end_boundary["authorized_end_monotonic_seconds"])
                  resume_requested = float(
                      coordination["workload_resume_requested_monotonic_seconds"]
                  )
                  host_request = float(
                      coordination["host_request_started_monotonic_seconds"]
                  )
                  host_ack = float(coordination["host_acknowledged_monotonic_seconds"])
                  host_resume = float(
                      coordination["host_resume_started_monotonic_seconds"]
                  )
                  host_resume_completed = float(
                      coordination["host_resume_completed_monotonic_seconds"]
                  )
                  host_duration = host_resume - host_ack
                  clipped_pause = max(
                      0.0,
                      min(measurement_duration, resumed_elapsed)
                      - max(0.0, min(measurement_duration, observed_elapsed)),
                  )
                  clipped_bridge = max(
                      0.0,
                      min(origin + measurement_duration, authorized_end)
                      - max(origin, authorized_start),
                  )
                  authorized = min(clipped_bridge, host_duration)
                  causal_valid = (
                      observed >= prior_workload_end
                      and resumed >= observed
                      and close_number(observed_elapsed, observed - origin)
                      and close_number(resumed_elapsed, resumed - origin)
                      and origin
                      <= requested
                      <= observed
                      <= authorized_start
                      <= authorized_end
                      <= resume_requested
                      <= resumed
                      and close_number(pause.get("duration_seconds"), resumed - observed)
                      and close_number(
                          pause.get("measurement_clipped_duration_seconds"),
                          clipped_pause,
                      )
                      and host_ack >= prior_host_end
                      and host_request
                      >= float(chaos_started)
                      and host_request
                      <= host_ack
                      <= float(start_boundary["host_boundary_started_monotonic_seconds"])
                      <= float(start_boundary["host_boundary_completed_monotonic_seconds"])
                      <= float(partition["disabled_monotonic_seconds"])
                      <= float(partition["restored_monotonic_seconds"])
                      <= float(end_boundary["host_boundary_started_monotonic_seconds"])
                      <= float(end_boundary["host_boundary_completed_monotonic_seconds"])
                      <= host_resume
                      <= host_resume_completed
                      <= float(chaos_completed)
                      and close_number(
                          coordination.get("host_pause_duration_seconds"),
                          host_duration,
                      )
                  )
                  if not causal_valid:
                      raw_pause_valid = False
                      continue
                  seen_pause_ids.add(pause_id)
                  workload_pause_seconds += clipped_pause
                  authorized_pause_seconds += authorized
                  prior_workload_end = resumed
                  prior_host_end = host_resume
                  raw_pause_bindings.append(
                      {
                          "authorized_pause_seconds": round(authorized, 6),
                          "episode": episode,
                          "host_pause_seconds": round(host_duration, 6),
                          "pause_id": pause_id,
                          "workload_authorized_clipped_pause_seconds": round(
                              clipped_bridge,
                              6,
                          ),
                          "workload_clipped_pause_seconds": round(clipped_pause, 6),
                      }
                  )
          active_seconds = configured_duration - authorized_pause_seconds
          pause_metrics = workload_metrics.get("pause_evidence", {})
          raw_pause_valid = (
              raw_pause_valid
              and active_seconds >= 0
              and close_number(workload.get("paused_workload_seconds"), workload_pause_seconds)
              and close_number(
                  workload.get("active_workload_seconds"),
                  configured_duration - workload_pause_seconds,
              )
              and isinstance(pause_metrics, dict)
              and pause_metrics.get("passed") is True
              and pause_metrics.get("bindings") == raw_pause_bindings
              and close_number(
                  pause_metrics.get("authorized_paused_seconds"),
                  authorized_pause_seconds,
              )
              and close_number(
                  pause_metrics.get("active_workload_seconds"),
                  active_seconds,
              )
          )
          if not raw_pause_valid:
              failures.append("soak pause intervals or active-time denominator are not raw-bound")

          transfer_every = configuration.get("transfer_every_cycles")
          reopen_every = configuration.get("executor_reopen_every_cycles")
          cycles = workload.get("cycles")
          cycle_metrics_valid = (
              isinstance(transfer_every, int)
              and not isinstance(transfer_every, bool)
              and transfer_every > 0
              and isinstance(reopen_every, int)
              and not isinstance(reopen_every, bool)
              and reopen_every > 0
              and isinstance(cycles, int)
              and not isinstance(cycles, bool)
              and cycles >= 0
          )
          if cycle_metrics_valid:
              semantic_cycle_floor = max(3 * 6 * transfer_every, 3 * reopen_every)
              active_time_cycle_floor = math.ceil(active_seconds / 15.0)
              required_cycles = max(semantic_cycle_floor, active_time_cycle_floor)
              expected_transfers = (cycles + transfer_every - 1) // transfer_every
              expected_reopens = cycles // reopen_every
              pair_names = (
                  "warden-a->warden-b",
                  "warden-b->warden-a",
                  "warden-a->warden-c",
                  "warden-c->warden-a",
                  "warden-b->warden-c",
                  "warden-c->warden-b",
              )
              expected_pairs = {name: 0 for name in pair_names}
              for ordinal in range(expected_transfers):
                  expected_pairs[pair_names[ordinal % len(pair_names)]] += 1
              expected_counters = {
                  "authorizations": 2 * cycles - 1,
                  "closed": cycles,
                  "executor_failed_closed": 1,
                  "executor_faulting_calls": 1,
                  "issued_receipts": 2 * cycles,
                  "issued_roots": cycles,
                  "quiesced": cycles,
                  "renewed": cycles,
                  "resumed": cycles,
                  "transfers_prepared": expected_transfers,
              }
              executor = workload.get("executor", {})
              raw_counters = workload.get("counters")
              raw_pairs = workload.get("transfer_pair_counts")
              executor_claims = executor.get("claims") if isinstance(executor, dict) else None
              executor_reopens = (
                  executor.get("reopen_count") if isinstance(executor, dict) else None
              )
              executor_replays = (
                  executor.get("replay_rejections") if isinstance(executor, dict) else None
              )
              executor_status = executor.get("status") if isinstance(executor, dict) else None
              executor_head = (
                  executor_status.get("claim_sequence")
                  if isinstance(executor_status, dict) else None
              )
              cycle_metrics_valid = (
                  cycles >= required_cycles
                  and semantic_cycle_floor == 54
                  and isinstance(raw_pairs, dict)
                  and set(raw_pairs) == set(expected_pairs)
                  and all(type(value) is int and value >= 0 for value in raw_pairs.values())
                  and raw_pairs == expected_pairs
                  and all(value >= 3 for value in expected_pairs.values())
                  and isinstance(raw_counters, dict)
                  and set(raw_counters) == set(expected_counters)
                  and all(
                      type(value) is int and value >= 0
                      for value in raw_counters.values()
                  )
                  and raw_counters == expected_counters
                  and isinstance(executor, dict)
                  and type(executor_claims) is int
                  and executor_claims == 2 * cycles
                  and type(executor_reopens) is int
                  and executor_reopens == expected_reopens
                  and type(executor_replays) is int
                  and executor_replays == 2 * cycles + expected_reopens
                  and type(executor_head) is int
                  and executor_head == 2 * cycles
                  and type(workload_metrics.get("actual_cycles")) is int
                  and workload_metrics.get("actual_cycles") == cycles
                  and type(workload_metrics.get("required_cycles")) is int
                  and workload_metrics.get("required_cycles") == required_cycles
                  and type(workload_metrics.get("semantic_cycle_floor")) is int
                  and workload_metrics.get("semantic_cycle_floor") == semantic_cycle_floor
                  and type(workload_metrics.get("active_time_cycle_floor")) is int
                  and workload_metrics.get("active_time_cycle_floor")
                  == active_time_cycle_floor
                  and close_number(
                      workload_metrics.get("active_workload_seconds"),
                      active_seconds,
                  )
                  and workload_checks.get("minimum_cycles") is True
                  and workload_checks.get("semantic_path_coverage") is True
                  and workload_checks.get("transfer_pair_rotation") is True
              )
          if not cycle_metrics_valid:
              failures.append("soak evaluator-derived active-time throughput is inconsistent")

          health_samples_value = workload.get("health_samples")
          health_samples = (
              health_samples_value if isinstance(health_samples_value, list) else []
          )
          raw_health_valid = (
              isinstance(health_samples_value, list)
              and finite_number(workload.get("duration_seconds"))
              and finite_number(configuration.get("health_interval_seconds"))
              and 0 < float(configuration.get("health_interval_seconds")) <= 15.0
              and raw_restart_valid
          )
          expected_schedule = []
          observations = {node: [] for node in expected_nodes}
          unavailable_counts = {node: 0 for node in expected_nodes}
          acknowledged_unavailable_restart_ids = set()
          raw_health_retries = 0
          maximum_gaps = {}
          if raw_health_valid:
              workload_duration = float(workload["duration_seconds"])
              interval = float(configuration["health_interval_seconds"])
              scheduled = 0.0
              while scheduled < workload_duration:
                  expected_schedule.append(scheduled)
                  scheduled += interval
              expected_schedule.append(workload_duration)
              raw_health_valid = len(health_samples) == len(expected_schedule)
              prior_started = -math.inf
              prior_completed = -math.inf
              for index, (sample, expected_scheduled) in enumerate(
                  zip(health_samples, expected_schedule)
              ):
                  if not isinstance(sample, dict):
                      raw_health_valid = False
                      continue
                  scheduled_at = sample.get("scheduled_elapsed_seconds")
                  started_at = sample.get("started_elapsed_seconds")
                  completed_at = sample.get("completed_elapsed_seconds")
                  deadline_at = sample.get("deadline_elapsed_seconds")
                  timing_valid = (
                      sample.get("schedule_index") == index
                      and sample.get("deadline_missed") is False
                      and finite_number(sample.get("elapsed_seconds"))
                      and all(
                          finite_number(value)
                          for value in (
                              scheduled_at,
                              started_at,
                              completed_at,
                              deadline_at,
                          )
                      )
                  )
                  if timing_valid:
                      timing_valid = (
                          abs(float(scheduled_at) - expected_scheduled) <= 0.002
                          and float(scheduled_at) >= 0
                          and float(started_at) >= float(scheduled_at)
                          and float(completed_at) >= float(started_at)
                          and float(deadline_at) >= float(completed_at)
                          and float(deadline_at) - float(scheduled_at) <= 15.002
                          and abs(float(sample["elapsed_seconds"]) - float(started_at))
                          <= 0.001
                          and float(started_at) > prior_started
                          and float(completed_at) > prior_completed
                      )
                  if not timing_valid:
                      raw_health_valid = False
                      continue
                  prior_started = float(started_at)
                  prior_completed = float(completed_at)
                  nodes = sample.get("nodes")
                  planned_nodes = sample.get("planned_unavailable_nodes")
                  if (
                      not isinstance(nodes, dict)
                      or set(nodes) != expected_nodes
                      or not isinstance(planned_nodes, list)
                      or len(planned_nodes) != len(set(planned_nodes))
                      or len(planned_nodes) > 1
                      or any(node not in expected_nodes for node in planned_nodes)
                  ):
                      raw_health_valid = False
                      continue
                  actual_planned = []
                  for node in expected_nodes:
                      document = nodes[node]
                      observation = (
                          document.get("observation")
                          if isinstance(document, dict)
                          else None
                      )
                      if not isinstance(observation, dict):
                          raw_health_valid = False
                          continue
                      observed_started = observation.get("started_elapsed_seconds")
                      observed_metrics = observation.get("metrics_observed_elapsed_seconds")
                      observed_completed = observation.get("completed_elapsed_seconds")
                      retries = observation.get("request_retries")
                      observation_valid = (
                          finite_number(observed_started)
                          and finite_number(observed_completed)
                          and float(observed_started) >= float(started_at)
                          and float(observed_completed) >= float(observed_started)
                          and float(observed_completed) <= float(completed_at) + 0.002
                          and isinstance(retries, int)
                          and not isinstance(retries, bool)
                          and retries >= 0
                      )
                      if not observation_valid:
                          raw_health_valid = False
                          continue
                      raw_health_retries += retries
                      planned = document.get("planned_unavailable")
                      if planned is not None:
                          binding = (
                              restart_bindings.get(planned.get("restart_id"))
                              if isinstance(planned, dict)
                              else None
                          )
                          expected_marker = (
                              binding.get(f"{planned.get('state')}_marker")
                              if isinstance(binding, dict)
                              else None
                          )
                          if (
                              not isinstance(binding, dict)
                              or planned != expected_marker
                              or binding.get("service") != node
                              or observed_metrics is not None
                              or float(observed_completed)
                              < float(binding["start_elapsed_seconds"])
                              or float(observed_started)
                              > float(binding["end_elapsed_seconds"])
                              or (
                                  planned.get("state") == "completed"
                                  and float(binding["end_elapsed_seconds"])
                                  > float(observed_completed) + 0.002
                              )
                          ):
                              raw_health_valid = False
                              continue
                          actual_planned.append(node)
                          unavailable_counts[node] += 1
                          if planned.get("state") == "armed" and (
                              float(observed_started)
                              <= float(binding["start_elapsed_seconds"])
                              <= float(observed_completed)
                          ):
                              acknowledged_unavailable_restart_ids.add(
                                  planned["restart_id"]
                              )
                          continue
                      exporter = document.get("audit_exporter")
                      if (
                          not isinstance(exporter, dict)
                          or not close_number(exporter.get("max_stall_s"), 15.0, 0.0)
                          or not finite_number(observed_metrics)
                          or not float(observed_started)
                          <= float(observed_metrics)
                          <= float(observed_completed)
                      ):
                          raw_health_valid = False
                          continue
                      observations[node].append(float(observed_metrics))
                  if sorted(actual_planned) != sorted(planned_nodes):
                      raw_health_valid = False
              for node in expected_nodes:
                  points = [
                      0.0,
                      *sorted(
                          set(
                              max(0.0, min(workload_duration, value))
                              for value in observations[node]
                          )
                      ),
                  ]
                  if not observations[node]:
                      raw_health_valid = False
                      continue
                  if points[-1] != workload_duration:
                      points.append(workload_duration)
                  maximum_gap = 0.0
                  for left, right in zip(points, points[1:]):
                      cursor = left
                      for exclusion in restart_windows[node]:
                          excluded_start = max(
                              left,
                              float(exclusion["start_elapsed_seconds"]),
                          )
                          excluded_end = min(
                              right,
                              float(exclusion["end_elapsed_seconds"]),
                          )
                          if excluded_end <= cursor or excluded_start >= right:
                              continue
                          maximum_gap = max(
                              maximum_gap,
                              max(0.0, excluded_start - cursor),
                          )
                          cursor = max(cursor, excluded_end)
                      maximum_gap = max(maximum_gap, max(0.0, right - cursor))
                  maximum_gaps[node] = maximum_gap
                  if maximum_gap > 15.002:
                      raw_health_valid = False
              if acknowledged_unavailable_restart_ids != set(restart_bindings):
                  raw_health_valid = False
          monitor = workload.get("health_monitor")
          required_health_samples = len(expected_schedule)
          cadence_metrics = workload_metrics.get("health_cadence", {})
          rounded_gaps = {
              node: round(value, 6) for node, value in maximum_gaps.items()
          }
          raw_health_valid = (
              raw_health_valid
              and isinstance(monitor, dict)
              and monitor.get("status") == "passed"
              and monitor.get("schedule") == "absolute_monotonic"
              and monitor.get("joined") is True
              and monitor.get("deadline_miss_count") == 0
              and monitor.get("samples_truncated") == 0
              and monitor.get("audit_error_budget_instances") == 1
              and monitor.get("interval_seconds")
              == configuration.get("health_interval_seconds")
              and monitor.get("expected_sample_count") == required_health_samples
              and monitor.get("actual_sample_count") == len(health_samples)
              and monitor.get("retained_sample_count") == len(health_samples)
              and workload.get("health_sample_count") == len(health_samples)
              and monitor.get("request_retry_count") == raw_health_retries
              and workload_metrics.get("actual_health_samples") == len(health_samples)
              and workload_metrics.get("required_health_samples")
              == required_health_samples
              and workload_metrics.get("actual_health_request_retries")
              == raw_health_retries
              and workload_metrics.get("raw_health_request_retries")
              == raw_health_retries
              and isinstance(cadence_metrics, dict)
              and cadence_metrics.get("passed") is True
              and cadence_metrics.get("sample_count") == len(health_samples)
              and cadence_metrics.get("expected_sample_count") == required_health_samples
              and cadence_metrics.get("maximum_allowed_gap_seconds") == 15.0
              and cadence_metrics.get("maximum_gap_by_node_seconds") == rounded_gaps
              and close_number(
                  cadence_metrics.get("maximum_gap_seconds"),
                  max(maximum_gaps.values(), default=math.inf),
              )
              and cadence_metrics.get("planned_unavailable_samples_by_node")
              == unavailable_counts
              and cadence_metrics.get("strictly_increasing") is True
          )
          if not raw_health_valid:
              failures.append("soak raw per-node health cadence or retention is invalid")

          raw_error_evidence_valid = isinstance(health_samples_value, list)
          raw_error_sample_count = 0
          raw_error_samples_by_node = {node: 0 for node in expected_nodes}
          raw_recovered_error_sample_count = 0
          if raw_error_evidence_valid:
              for sample in health_samples:
                  if not isinstance(sample, dict):
                      raw_error_evidence_valid = False
                      continue
                  sample_elapsed = sample.get("elapsed_seconds")
                  recoveries = sample.get("audit_error_recoveries")
                  if not finite_number(sample_elapsed) or not isinstance(recoveries, list):
                      raw_error_evidence_valid = False
                      continue
                  nodes = sample.get("nodes")
                  if not isinstance(nodes, dict) or set(nodes) != expected_nodes:
                      raw_error_evidence_valid = False
                      continue
                  error_remaining_by_node = {}
                  for node in expected_nodes:
                      document = nodes[node]
                      if (
                          isinstance(document, dict)
                          and document.get("planned_unavailable") is not None
                      ):
                          continue
                      exporter = (
                          document.get("audit_exporter")
                          if isinstance(document, dict)
                          else None
                      )
                      if not isinstance(exporter, dict):
                          raw_error_evidence_valid = False
                          continue
                      last_error = exporter.get("last_error")
                      if last_error is None:
                          continue
                      raw_error_sample_count += 1
                      raw_error_samples_by_node[node] += 1
                      stalled_for = exporter.get("stalled_for_s")
                      maximum_stall = exporter.get("max_stall_s")
                      if (
                          not finite_number(stalled_for)
                          or not finite_number(maximum_stall)
                          or float(maximum_stall) != 15.0
                          or not 0 <= float(stalled_for) <= float(maximum_stall)
                          or not isinstance(exporter.get("pending"), int)
                          or isinstance(exporter.get("pending"), bool)
                          or exporter.get("pending") < 0
                      ):
                          raw_error_evidence_valid = False
                      else:
                          remaining_window = float(maximum_stall) - float(stalled_for)
                          if remaining_window <= 0:
                              raw_error_evidence_valid = False
                          else:
                              error_remaining_by_node[node] = remaining_window
                      if not isinstance(last_error, str):
                          raw_error_evidence_valid = False
                          continue
                      match = audit_busy_pattern.fullmatch(last_error)
                      if (
                          match is None
                          or len(last_error.encode("utf-8")) > 4096
                          or len(match.group(1)) > 64
                          or int(match.group(2)) > 0x7FFFFFFF
                          or int(match.group(2)) & 0xFF != 5
                      ):
                          raw_error_evidence_valid = False
                  recovery_nodes = set()
                  for recovery in recoveries:
                      if not isinstance(recovery, dict):
                          raw_error_evidence_valid = False
                          continue
                      node = recovery.get("node")
                      if node not in expected_nodes or node in recovery_nodes:
                          raw_error_evidence_valid = False
                          continue
                      recovery_nodes.add(node)
                      raw_recovered_error_sample_count += 1
                      expected_remaining = error_remaining_by_node.get(node)
                      recovery_elapsed = recovery.get("elapsed_seconds")
                      recorded_remaining = recovery.get("remaining_stall_window_seconds")
                      recovery_exporter = recovery.get("audit_exporter")
                      recovery_outbox = recovery.get("audit_outbox")
                      node_document = nodes.get(node)
                      node_observation = (
                          node_document.get("observation")
                          if isinstance(node_document, dict)
                          else None
                      )
                      metrics_observed = (
                          node_observation.get("metrics_observed_elapsed_seconds")
                          if isinstance(node_observation, dict)
                          else None
                      )
                      observation_completed = (
                          node_observation.get("completed_elapsed_seconds")
                          if isinstance(node_observation, dict)
                          else None
                      )
                      if (
                          expected_remaining is None
                          or not finite_number(recovery_elapsed)
                          or not finite_number(recorded_remaining)
                          or float(recorded_remaining) != round(expected_remaining, 3)
                          or not float(sample_elapsed) < float(recovery_elapsed)
                          or not finite_number(metrics_observed)
                          or not finite_number(observation_completed)
                          or not float(metrics_observed)
                          <= float(recovery_elapsed)
                          <= float(observation_completed)
                          or float(recovery_elapsed) - float(sample_elapsed)
                          > expected_remaining + 0.001
                          or not isinstance(recovery_exporter, dict)
                          or recovery_exporter.get("running") is not True
                          or recovery_exporter.get("healthy") is not True
                          or recovery_exporter.get("archive_reconciled") is not True
                          or recovery_exporter.get("catching_up") is not False
                          or recovery_exporter.get("last_error") is not None
                          or type(recovery_exporter.get("pending")) is not int
                          or recovery_exporter.get("pending") != 0
                          or recovery_exporter.get("publish_blocked") is not False
                          or recovery_exporter.get("sink_call_blocked") is not False
                          or not isinstance(recovery_outbox, dict)
                          or type(recovery_outbox.get("unpublished_count")) is not int
                          or recovery_outbox.get("unpublished_count") != 0
                          or recovery.get("ready") is not True
                          or recovery.get("service_ready") is not True
                      ):
                          raw_error_evidence_valid = False
                  if recovery_nodes != set(error_remaining_by_node):
                      raw_error_evidence_valid = False
          valid_error_samples_by_node = (
              isinstance(error_samples_by_node, dict)
              and set(error_samples_by_node) == expected_nodes
              and all(
                  isinstance(value, int) and not isinstance(value, bool) and value >= 0
                  for value in error_samples_by_node.values()
              )
          )
          if (
              error_sample_budget != 1
              or isinstance(error_sample_budget, bool)
              or not isinstance(error_sample_count, int)
              or isinstance(error_sample_count, bool)
              or not 0 <= error_sample_count <= 1
              or not isinstance(recovered_error_sample_count, int)
              or isinstance(recovered_error_sample_count, bool)
              or recovered_error_sample_count != error_sample_count
              or unresolved_error_nodes != []
              or not valid_error_samples_by_node
              or sum(error_samples_by_node.values()) != error_sample_count
              or not raw_error_evidence_valid
              or raw_error_sample_count != error_sample_count
              or raw_error_samples_by_node != error_samples_by_node
              or raw_recovered_error_sample_count != recovered_error_sample_count
              or recorded_error_sample_count != error_sample_count
              or recorded_error_samples_by_node != error_samples_by_node
              or recorded_recovered_error_sample_count != recovered_error_sample_count
              or recorded_unresolved_error_nodes != unresolved_error_nodes
              or audit_progress.get("error_evidence_complete") is not True
              or audit_progress.get("error_recovery_passed") is not True
              or workload_checks.get("audit_error_recovery") is not True
          ):
              failures.append("soak audit exporter transient-error budget or recovery failed")
          pair_counts = workload.get("transfer_pair_counts", {})
          if (
              not isinstance(pair_counts, dict)
              or len(pair_counts) != 6
              or any(
                  not isinstance(value, int)
                  or isinstance(value, bool)
                  or value < 3
                  for value in pair_counts.values()
              )
          ):
              failures.append("soak did not exercise all six directed transfer pairs")
          if len(partitions) < 2:
              failures.append("soak did not complete repeated partitions")
          elif any(
              not isinstance(item, dict)
              or not isinstance(item.get("observation"), dict)
              or item["observation"].get("durably_pending_observed") is not True
              or not isinstance(item["observation"].get("durable_sql"), dict)
              or item["observation"]["durable_sql"].get("status") != "PREPARED"
              for item in partitions
          ):
              failures.append("partition evidence did not bind exact durable failed transfers")
          recovery_value = chaos.get("partition_recovery")
          recovery = recovery_value if isinstance(recovery_value, list) else []
          if (
              not isinstance(recovery_value, list)
              or len(recovery) != len(partitions)
              or any(
                  not isinstance(item, dict) or item.get("passed") is not True
                  for item in recovery
              )
          ):
              failures.append("partition transfer streams did not recover exactly")
          restart_integrity = required_mapping(
              chaos.get("restart_integrity"), "soak restart-integrity evidence"
          )
          chaos_duration = (
              float(chaos_completed) - float(chaos_started)
              if finite_number(chaos_started) and finite_number(chaos_completed)
              else 0.0
          )
          restart_operations = (
              sorted(
                  (
                      float(item["host_operation_started_monotonic_seconds"])
                      - float(chaos_started),
                      float(item["host_operation_completed_monotonic_seconds"])
                      - float(chaos_started),
                      item["service"],
                  )
                  for item in restarts
                  if isinstance(item, dict)
                  and finite_number(item.get("host_operation_started_monotonic_seconds"))
                  and finite_number(item.get("host_operation_completed_monotonic_seconds"))
                  and item.get("service") in expected_nodes
              )
              if finite_number(chaos_started)
              else []
          )

          def lifetime_segments(operations):
              segments = []
              prior_completed = 0.0
              for operation_started, operation_completed, _service in operations:
                  segments.append(max(0.0, operation_started - prior_completed))
                  prior_completed = operation_completed
              segments.append(max(0.0, chaos_duration - prior_completed))
              return segments

          global_segments = lifetime_segments(restart_operations)
          required_lifetime = (
              float(configuration["restart_interval_seconds"]) * 0.8
              if finite_number(configuration.get("restart_interval_seconds"))
              else 0.0
          )
          expected_per_warden_lifetimes = {}
          for node in expected_nodes:
              node_operations = [
                  operation for operation in restart_operations if operation[2] == node
              ]
              node_segments = lifetime_segments(node_operations)
              expected_per_warden_lifetimes[node] = {
                  "longest_seconds": round(max(node_segments, default=0.0), 3),
                  "passed": True,
                  "planned_sigkill_seconds": [
                      round(operation[0], 3) for operation in node_operations
                  ],
                  "segments_seconds": [round(value, 3) for value in node_segments],
              }
          final_restart_state = restart_integrity.get("final_container_state")
          final_restart_state_valid = (
              isinstance(final_restart_state, dict)
              and set(final_restart_state) == expected_nodes
              and all(
                  isinstance(state, dict)
                  and state.get("status") == "running"
                  and state.get("oom_killed") is False
                  and state.get("restart_count") == 0
                  and isinstance(state.get("exit_code"), int)
                  and not isinstance(state.get("exit_code"), bool)
                  and state.get("exit_code") >= 0
                  for state in final_restart_state.values()
              )
          )
          if (
              restart_integrity.get("passed") is not True
              or restart_integrity.get("all_wardens_sigkilled") is not True
              or restart_integrity.get("planned_sigkills") != len(restarts)
              or not close_number(
                  restart_integrity.get("chaos_duration_seconds"),
                  round(chaos_duration, 3),
              )
              or not close_number(
                  restart_integrity.get("minimum_sigkill_free_seconds"),
                  round(required_lifetime, 3),
              )
              or not close_number(
                  restart_integrity.get("longest_sigkill_free_seconds"),
                  round(max(global_segments, default=0.0), 3),
              )
              or max(global_segments, default=0.0) < required_lifetime
              or restart_integrity.get("per_warden_lifetimes")
              != expected_per_warden_lifetimes
              or not final_restart_state_valid
              or restart_integrity.get("restart_count_policy")
              != "all samples and final states equal zero"
              or any(
                  item["longest_seconds"] < required_lifetime
                  for item in expected_per_warden_lifetimes.values()
              )
          ):
              failures.append("soak SIGKILL or per-warden lifetime evidence is incomplete")
          resources = required_mapping(evidence.get("resources"), "soak resource evidence")
          resource_evaluation = required_mapping(
              resources.get("evaluation"), "soak resource evaluation"
          )
          if resource_evaluation.get("passed") is not True:
              failures.append("soak resource bounds did not pass")
          expected_resource_bounds = {
              "cgroup_memory_max_bytes": 1024 * 1024 * 1024,
              "cgroup_pids_max": 256,
              "cgroup_swap_max_bytes": 0,
              "max_cgroup_memory_peak_bytes": 768 * 1024 * 1024,
              "max_cgroup_pids_peak": 192,
              "max_rss_bytes": 256 * 1024 * 1024,
              "max_rss_growth_bytes": 128 * 1024 * 1024,
          }
          actual_resource_bounds = required_mapping(
              resource_evaluation.get("bounds"), "soak resource bounds"
          )
          if any(
              actual_resource_bounds.get(name) != value
              for name, value in expected_resource_bounds.items()
          ):
              failures.append("soak used the wrong process or cgroup resource bounds")
          required_resource_checks = {
              "cgroup_memory_events",
              "cgroup_memory_limit",
              "cgroup_memory_peak",
              "cgroup_pids_events",
              "cgroup_pids_limit",
              "cgroup_pids_peak",
              "cgroup_probe",
              "cgroup_swap_events",
              "cgroup_swap_limit",
              "cgroup_swap_usage",
              "rss",
              "rss_growth",
          }
          resource_measurements = required_mapping(
              resource_evaluation.get("measurements"), "soak resource measurements"
          )
          if not isinstance(resource_measurements, dict) or set(resource_measurements) != {
              "warden-a",
              "warden-b",
              "warden-c",
          } or any(
              not isinstance(item, dict)
              or not isinstance(item.get("checks"), dict)
              or not required_resource_checks.issubset(item["checks"])
              or any(item["checks"].get(name) is not True for name in required_resource_checks)
              for item in (
                  resource_measurements.values()
                  if isinstance(resource_measurements, dict)
                  else ()
              )
          ):
              failures.append("soak cgroup v2 or LETS-child resource checks are incomplete")
          resource_samples_value = resources.get("samples")
          resource_samples = (
              resource_samples_value if isinstance(resource_samples_value, list) else []
          )
          resource_sample_count = resources.get("sample_count")
          if (
              not isinstance(resource_samples_value, list)
              or not isinstance(resource_sample_count, int)
              or isinstance(resource_sample_count, bool)
              or resource_sample_count != len(resource_samples)
          ):
              failures.append("soak resource sample count is inconsistent")
          for restart in restarts:
              if not isinstance(restart, dict):
                  failures.append("planned SIGKILL resource checkpoint is malformed")
                  continue
              checkpoint = restart.get("resource_checkpoint", {})
              if not isinstance(checkpoint, dict):
                  failures.append("planned SIGKILL resource checkpoint is malformed")
                  continue
              sample_index = checkpoint.get("sample_index")
              if (
                  checkpoint.get("evaluation_passed") is not True
                  or checkpoint.get("sample_reason") != "pre_sigkill"
                  or checkpoint.get("service") != restart.get("service")
                  or not finite_number(
                      checkpoint.get("host_observed_monotonic_seconds")
                  )
                  or not finite_number(chaos_started)
                  or float(checkpoint["host_observed_monotonic_seconds"])
                  < float(chaos_started)
                  or isinstance(sample_index, bool)
                  or not isinstance(sample_index, int)
                  or not 0 <= sample_index < len(resource_samples)
              ):
                  failures.append("planned SIGKILL lacks an evaluated resource checkpoint")
                  continue
              sample = resource_samples[sample_index]
              if (
                  not isinstance(sample, dict)
                  or
                  sample.get("reason") != "pre_sigkill"
                  or sample.get("planned_sigkill_service") != restart.get("service")
                  or sample.get("host_observed_monotonic_seconds")
                  != checkpoint.get("host_observed_monotonic_seconds")
              ):
                  failures.append("planned SIGKILL resource checkpoint is not bound to its sample")
          package = required_mapping(evidence.get("package"), "soak package evidence")
          package_identity = required_mapping(
              package.get("identity"), "soak package identity evidence"
          )
          if package_identity.get("passed") is not True:
              failures.append("soak package/OCI identity checks did not pass")
          cleanup = required_mapping(evidence.get("cleanup"), "soak cleanup evidence")
          if (
              cleanup.get("performed") is not True
              or cleanup.get("remaining_containers") != 0
              or cleanup.get("remaining_volumes") != 0
              or cleanup.get("remaining_networks") != 0
          ):
              failures.append("soak did not prove complete Docker cleanup")
          verification = required_mapping(
              evidence.get("verification"), "soak final verification"
          )
          if verification.get("converged") is not True:
              failures.append("soak did not converge")
          final_health = required_mapping(
              verification.get("final_health"), "soak final health evidence"
          )
          final_nodes = final_health.get("nodes")
          if (
              not isinstance(final_nodes, dict)
              or set(final_nodes) != expected_nodes
              or any(
                  not isinstance(document, dict)
                  or not isinstance(document.get("audit_exporter"), dict)
                  or document["audit_exporter"].get("last_error") is not None
                  for document in (
                      final_nodes.values() if isinstance(final_nodes, dict) else ()
                  )
              )
          ):
              failures.append("soak final audit exporter state retained an error")
          conservation = required_mapping(
              verification.get("conservation"), "soak conservation evidence"
          )
          if conservation.get("balanced") is not True:
              failures.append("soak conservation failed")
          # BEGIN RAW AUTHORITY EVIDENCE VERIFIER
          authority_summary = required_mapping(
              evidence.get("authority_evaluation"), "soak authority evaluation"
          )
          terminal_capture = verification.get("terminal_capture")
          raw_terminal_capture_valid = (
              verification.get("schema")
              == "lets.production-profile-soak-verification/v1"
              and verification.get("status") == "passed"
              and isinstance(terminal_capture, dict)
              and set(terminal_capture) == {
                  "completed_monotonic_seconds",
                  "deadline_monotonic_seconds",
                  "started_monotonic_seconds",
              }
              and all(finite_number(item) for item in terminal_capture.values())
          )
          if raw_terminal_capture_valid:
              capture_started = float(terminal_capture["started_monotonic_seconds"])
              capture_completed = float(terminal_capture["completed_monotonic_seconds"])
              capture_deadline = float(terminal_capture["deadline_monotonic_seconds"])
              raw_terminal_capture_valid = (
                  capture_started <= capture_completed <= capture_deadline
                  and close_number(capture_deadline - capture_started, 90.0)
              )
          core_authority_fields = {
              "admission_fenced", "enabled", "fault_reason", "fault_stage",
              "fence_id", "fenced_at_monotonic_ns", "first_fault", "healthy",
              "lifetime_id", "namespace_process_id", "permanent_faults",
              "retry_not_before_monotonic_ns", "state", "transport_fault_episodes",
              "transport_faults", "transport_recoveries",
              "transport_recovery_attempts", "unresolved_transport_faults",
          }
          executor_authority_fields = core_authority_fields - {
              "admission_fenced", "fence_id", "fenced_at_monotonic_ns",
              "namespace_process_id",
          }
          authority_counter_fields = (
              "transport_faults", "transport_fault_episodes",
              "transport_recovery_attempts", "transport_recoveries",
              "permanent_faults",
          )
          first_fault_fields = {
              "helper_exit_code", "helper_pid", "mutation_uncertain", "operation",
              "reason", "request_flushed", "stage",
          }
          transport_reasons = {
              "deadline", "helper_eof", "helper_pipe", "helper_start",
              "helper_start_deadline", "helper_start_in_progress",
              "process_lock_deadline",
          }
          transport_operations = {"compare-and-set", "confirm", "initialize", "read"}
          executor_checkpoint_fields = {
              "audience", "claim_digest", "claim_sequence", "clock_floor_ns",
              "config_epoch", "database_instance_id", "envelope_id",
              "executor_policy_sha256", "format", "schema_version", "tenant_id",
              "trust_registry_sha256",
          }

          def valid_identifier(value):
              return (
                  isinstance(value, str)
                  and value
                  and len(value) <= 512
                  and value == value.strip()
                  and not any(
                      ord(character) < 0x20 or ord(character) == 0x7F
                      for character in value
                  )
              )

          def valid_digest(value):
              if (
                  not isinstance(value, str)
                  or len(value) != 43
                  or re.fullmatch(r"[A-Za-z0-9_-]{43}", value) is None
              ):
                  return False
              try:
                  decoded = base64.urlsafe_b64decode(value + "=")
              except (ValueError, TypeError):
                  return False
              return (
                  len(decoded) == 32
                  and base64.urlsafe_b64encode(decoded).decode("ascii").rstrip("=")
                  == value
              )

          def valid_executor_checkpoint(value):
              if not isinstance(value, dict) or set(value) != executor_checkpoint_fields:
                  return False
              floor = value.get("clock_floor_ns")
              return (
                  value.get("format") == "LETS-EXECUTOR-AUTHORITY-ANCHOR/1"
                  and type(value.get("schema_version")) is int
                  and value.get("schema_version") == 5
                  and value.get("audience") == "production-soak-executor"
                  and value.get("tenant_id") == "production-acceptance-tenant"
                  and value.get("envelope_id") == "production-acceptance-envelope"
                  and value.get("config_epoch") == 1
                  and all(
                      valid_identifier(value.get(name))
                      for name in ("audience", "tenant_id", "envelope_id")
                  )
                  and type(value.get("config_epoch")) is int
                  and 1 <= value["config_epoch"] <= (1 << 63) - 1
                  and type(value.get("claim_sequence")) is int
                  and 0 <= value["claim_sequence"] <= (1 << 63) - 1
                  and (
                      floor is None
                      or type(floor) is int and 0 <= floor <= (1 << 63) - 1
                  )
                  and all(
                      valid_digest(value.get(name))
                      for name in (
                          "executor_policy_sha256", "trust_registry_sha256",
                          "database_instance_id", "claim_digest",
                      )
                  )
                  and (
                      value["claim_sequence"] != 0
                      or value["claim_digest"] == "A" * 43
                  )
              )

          def checkpoint_identity(value):
              return tuple(
                  value[name] for name in (
                      "audience", "tenant_id", "envelope_id", "config_epoch",
                      "executor_policy_sha256", "trust_registry_sha256",
                      "schema_version", "database_instance_id",
                  )
              )

          def valid_authority(value, *, executor=False, fenced=None, terminal=False):
              expected_fields = (
                  executor_authority_fields if executor else core_authority_fields
              )
              if not isinstance(value, dict) or set(value) != expected_fields:
                  return False
              state = value.get("state")
              if (
                  value.get("enabled") is not True
                  or state not in {
                      "healthy", "recoverable_transport_fault", "permanent_fault"
                  }
                  or type(value.get("healthy")) is not bool
                  or value.get("healthy") is not (state == "healthy")
                  or not isinstance(value.get("lifetime_id"), str)
                  or re.fullmatch(r"[0-9a-f]{32}", value["lifetime_id"]) is None
              ):
                  return False
              if executor:
                  if fenced is not None:
                      return False
              elif (
                  type(value.get("namespace_process_id")) is not int
                  or value["namespace_process_id"] <= 0
                  or type(value.get("admission_fenced")) is not bool
                  or (
                      fenced is not None
                      and value.get("admission_fenced") is not fenced
                  )
              ):
                  return False
              if not executor:
                  if value["admission_fenced"]:
                      if (
                          not isinstance(value.get("fence_id"), str)
                          or not 1 <= len(value["fence_id"]) <= 128
                          or type(value.get("fenced_at_monotonic_ns")) is not int
                          or value["fenced_at_monotonic_ns"] < 0
                      ):
                          return False
                  elif value.get("fence_id") is not None or value.get(
                      "fenced_at_monotonic_ns"
                  ) is not None:
                      return False
              counters = {}
              for name in authority_counter_fields:
                  item = value.get(name)
                  if type(item) is not int or not 0 <= item <= (1 << 63) - 1:
                      return False
                  counters[name] = item
              unresolved = value.get("unresolved_transport_faults")
              if (
                  type(unresolved) is not int
                  or unresolved not in {0, 1}
                  or counters["transport_faults"] < counters["transport_fault_episodes"]
                  or counters["transport_fault_episodes"] < counters["transport_recoveries"]
                  or counters["transport_recovery_attempts"]
                  < counters["transport_recoveries"]
                  or unresolved != int(state == "recoverable_transport_fault")
                  or (state == "permanent_fault" and counters["permanent_faults"] == 0)
              ):
                  return False
              stage = value.get("fault_stage")
              reason = value.get("fault_reason")
              retry = value.get("retry_not_before_monotonic_ns")
              if stage is not None and stage not in {"pre_begin", "post_commit"}:
                  return False
              if reason is not None and (
                  not isinstance(reason, str)
                  or re.fullmatch(r"[a-z0-9_]{1,64}", reason) is None
              ):
                  return False
              if state == "healthy":
                  if stage is not None or reason is not None or retry is not None:
                      return False
              elif state == "recoverable_transport_fault":
                  if (
                      stage is None or reason is None or type(retry) is not int or retry < 0
                  ):
                      return False
              elif retry is not None:
                  return False
              first = value.get("first_fault")
              if first is None:
                  if counters["transport_faults"] != 0:
                      return False
              elif (
                  not isinstance(first, dict)
                  or set(first) != first_fault_fields
                  or counters["transport_faults"] == 0
                  or first.get("stage") not in {"pre_begin", "post_commit"}
                  or first.get("operation") not in transport_operations
                  or first.get("reason") not in transport_reasons
                  or type(first.get("request_flushed")) is not bool
                  or type(first.get("mutation_uncertain")) is not bool
                  or (
                      first.get("operation") == "read"
                      and first.get("mutation_uncertain") is True
                  )
                  or (
                      first.get("reason")
                      in {"helper_start", "helper_start_deadline", "helper_start_in_progress"}
                      and (
                          first.get("request_flushed") is True
                          or first.get("mutation_uncertain") is True
                      )
                  )
              ):
                  return False
              else:
                  for name, positive in (("helper_pid", True), ("helper_exit_code", False)):
                      item = first.get(name)
                      minimum = 1 if positive else -(1 << 31)
                      if item is not None and (
                          type(item) is not int or not minimum <= item <= (1 << 31) - 1
                      ):
                          return False
              return not terminal or (
                  state == "healthy"
                  and unresolved == 0
                  and counters["permanent_faults"] == 0
                  and counters["transport_faults"]
                  == counters["transport_fault_episodes"]
                  == counters["transport_recovery_attempts"]
                  == counters["transport_recoveries"]
              )

          raw_authority_valid = cycle_metrics_valid and raw_terminal_capture_valid
          terminal_authorities = []
          all_lifetimes = set()
          executor_raw = workload.get("executor")
          recovery_events = (
              executor_raw.get("transport_recovery_events")
              if isinstance(executor_raw, dict) else None
          )
          executor_terminals = (
              executor_raw.get("terminal_statuses")
              if isinstance(executor_raw, dict) else None
          )
          executor_reopen_every = configuration.get("executor_reopen_every_cycles")
          verification_executor = verification.get("executor")
          final_executor_terminal = (
              verification_executor.get("terminal_status")
              if isinstance(verification_executor, dict) else None
          )
          try:
              event = recovery_events[0]
              original = event["original_transport_error"]
              faulted = event["faulted_authority_anchor"]
              recovered = event["recovered_authority_anchor"]
              raw_authority_valid = raw_authority_valid and (
                  isinstance(recovery_events, list)
                  and len(recovery_events) == 1
                  and isinstance(event, dict)
                  and set(event) == {
                      "durable_claim_outcome", "faulted_authority_anchor",
                      "faulting_call_effect_executed", "ordinal",
                      "original_call_raised", "original_transport_error", "phase",
                      "primary_returned", "protected_effect_executed_after_recovery",
                      "receipt_id", "recovered_authority_anchor", "retry_outcome",
                  }
                  and type(event.get("ordinal")) is int
                  and event.get("ordinal") == 0
                  and event.get("original_call_raised") is True
                  and event.get("phase") == "primary_claim"
                  and event.get("primary_returned") is False
                  and event.get("durable_claim_outcome") == "burned_before_response"
                  and event.get("retry_outcome") == "replay_rejected"
                  and event.get("faulting_call_effect_executed") is False
                  and event.get("protected_effect_executed_after_recovery") is False
                  and valid_identifier(event.get("receipt_id"))
                  and isinstance(original, dict)
                  and set(original) == first_fault_fields - {"stage"}
                  and original.get("reason") == "helper_eof"
                  and original.get("operation") == "compare-and-set"
                  and original.get("request_flushed") is True
                  and original.get("mutation_uncertain") is True
                  and valid_authority(faulted, executor=True)
                  and faulted.get("state") == "recoverable_transport_fault"
                  and faulted.get("fault_stage") == "post_commit"
                  and faulted.get("fault_reason") == original.get("reason")
                  and faulted.get("first_fault") == {**original, "stage": "post_commit"}
                  and tuple(
                      faulted.get(name) for name in (
                          "transport_faults", "transport_fault_episodes",
                          "transport_recovery_attempts", "transport_recoveries",
                          "unresolved_transport_faults", "permanent_faults",
                      )
                  ) == (1, 1, 0, 0, 1, 0)
                  and valid_authority(recovered, executor=True, terminal=True)
                  and recovered.get("lifetime_id") == faulted.get("lifetime_id")
                  and recovered.get("first_fault") == faulted.get("first_fault")
                  and tuple(
                      recovered.get(name) for name in (
                          "transport_faults", "transport_fault_episodes",
                          "transport_recovery_attempts", "transport_recoveries",
                          "unresolved_transport_faults", "permanent_faults",
                      )
                  ) == (1, 1, 1, 1, 0, 0)
                  and isinstance(executor_terminals, list)
                  and type(executor_reopen_every) is int
                  and executor_reopen_every > 0
                  and executor_raw.get("reopen_count")
                  == cycles // executor_reopen_every
                  and len(executor_terminals) == executor_raw.get("reopen_count") + 1
                  and isinstance(final_executor_terminal, dict)
              )
              executor_status_fields = {
                  "anchor", "authority_anchor", "authority_healthy", "claim_sequence",
                  "database_bytes", "integrity", "live_claims", "live_watermarks",
                  "rollback_protected", "shared_memory_bytes", "wal_bytes",
              }
              verification_executor_fields = {
                  "anchor_claim_sequence", "authority_anchor", "authority_healthy",
                  "claim_sequence", "database_bytes", "integrity",
                  "rollback_protected", "terminal_status", "wal_bytes",
              }
              raw_authority_valid = raw_authority_valid and (
                  set(verification_executor) == verification_executor_fields
                  and verification_executor.get("authority_healthy") is True
                  and verification_executor.get("rollback_protected") is True
                  and verification_executor.get("integrity") == ["ok"]
                  and type(verification_executor.get("anchor_claim_sequence")) is int
                  and verification_executor["anchor_claim_sequence"] >= 0
                  and type(verification_executor.get("claim_sequence")) is int
                  and verification_executor["claim_sequence"] >= 0
                  and type(verification_executor.get("database_bytes")) is int
                  and verification_executor["database_bytes"] >= 0
                  and type(verification_executor.get("wal_bytes")) is int
                  and verification_executor["wal_bytes"] >= 0
              )
              combined_executor = [*executor_terminals, final_executor_terminal]
              prior_claim_sequence = -1
              prior_checkpoint = None
              stable_checkpoint_identity = None
              recovered_terminal_seen = False
              for ordinal, terminal in enumerate(combined_executor):
                  status = terminal.get("status") if isinstance(terminal, dict) else None
                  authority = (
                      status.get("authority_anchor") if isinstance(status, dict) else None
                  )
                  claim_sequence = status.get("claim_sequence") if isinstance(status, dict) else None
                  checkpoint = status.get("anchor") if isinstance(status, dict) else None
                  expected_source = (
                      "workload" if ordinal < len(executor_terminals)
                      else "final_verification"
                  )
                  expected_claim_sequence = (
                      2 * executor_reopen_every * (ordinal + 1)
                      if ordinal < executor_raw["reopen_count"]
                      else 2 * cycles
                  )
                  valid = (
                      isinstance(terminal, dict)
                      and set(terminal) == {"lifetime_id", "ordinal", "source", "status"}
                      and type(terminal.get("ordinal")) is int
                      and terminal.get("ordinal") == ordinal
                      and terminal.get("source") == expected_source
                      and isinstance(status, dict)
                      and set(status) == executor_status_fields
                      and valid_authority(authority, executor=True, terminal=True)
                      and terminal.get("lifetime_id") == authority.get("lifetime_id")
                      and authority["lifetime_id"] not in all_lifetimes
                      and type(claim_sequence) is int
                      and claim_sequence == expected_claim_sequence
                      and claim_sequence >= prior_claim_sequence
                      and status.get("rollback_protected") is True
                      and status.get("authority_healthy") is True
                      and status.get("integrity") == ["ok"]
                      and all(
                          type(status.get(name)) is int and status[name] >= 0
                          for name in (
                              "database_bytes", "live_claims", "live_watermarks",
                              "shared_memory_bytes", "wal_bytes",
                          )
                      )
                      and status["live_claims"] <= claim_sequence
                      and status["live_watermarks"] <= claim_sequence
                      and valid_executor_checkpoint(checkpoint)
                      and checkpoint.get("claim_sequence") == claim_sequence
                      and (
                          stable_checkpoint_identity is None
                          or checkpoint_identity(checkpoint) == stable_checkpoint_identity
                      )
                      and (
                          prior_checkpoint is None
                          or checkpoint["claim_sequence"]
                          != prior_checkpoint["claim_sequence"]
                          or checkpoint["claim_digest"]
                          == prior_checkpoint["claim_digest"]
                      )
                      and (
                          prior_checkpoint is None
                          or prior_checkpoint["clock_floor_ns"] is None
                          or (
                              checkpoint["clock_floor_ns"] is not None
                              and checkpoint["clock_floor_ns"]
                              >= prior_checkpoint["clock_floor_ns"]
                          )
                      )
                  )
                  raw_authority_valid = raw_authority_valid and valid
                  if not valid:
                      continue
                  all_lifetimes.add(authority["lifetime_id"])
                  terminal_authorities.append(authority)
                  prior_claim_sequence = claim_sequence
                  prior_checkpoint = checkpoint
                  if stable_checkpoint_identity is None:
                      stable_checkpoint_identity = checkpoint_identity(checkpoint)
                  if authority == recovered:
                      recovered_terminal_seen = True
              raw_authority_valid = raw_authority_valid and (
                  recovered_terminal_seen
                  and executor_terminals[-1].get("status") == executor_raw.get("status")
                  and final_executor_terminal["status"].get("authority_anchor")
                  == verification_executor.get("authority_anchor")
                  and final_executor_terminal["status"].get("claim_sequence")
                  == verification_executor.get("claim_sequence")
                  and final_executor_terminal["status"].get("authority_healthy")
                  == verification_executor.get("authority_healthy")
                  and final_executor_terminal["status"].get("rollback_protected")
                  == verification_executor.get("rollback_protected")
                  and final_executor_terminal["status"].get("database_bytes")
                  == verification_executor.get("database_bytes")
                  and final_executor_terminal["status"].get("wal_bytes")
                  == verification_executor.get("wal_bytes")
                  and final_executor_terminal["status"].get("integrity")
                  == verification_executor.get("integrity")
                  and final_executor_terminal["status"].get("anchor")
                  == executor_terminals[-1]["status"].get("anchor")
                  and verification_executor.get("anchor_claim_sequence") == 2 * cycles
                  and prior_claim_sequence == 2 * cycles
              )
          except (KeyError, TypeError, IndexError, AttributeError):
              raw_authority_valid = False

          final_core_fences = verification.get("terminal_authority_fences")
          terminal_by_lifetime = {}
          recovery_baselines = {}
          planned_pairs = {node: [] for node in expected_nodes}
          fence_wrapper_fields = {
              "host_container_id", "host_exec_attempts", "host_pid",
              "prior_authority_anchor", "result",
          }
          fence_result_fields = {
              "node", "request_retry_count", "schema", "status", "terminal",
          }
          fence_terminal_fields = {
              "authority_anchor", "fenced_at_monotonic_ns", "lifetime_id",
              "namespace_process_id", "restart_id", "schema", "warden_id",
          }
          try:
              raw_authority_valid = raw_authority_valid and (
                  isinstance(final_core_fences, dict)
                  and set(final_core_fences) == expected_nodes
              )
              for restart in restarts:
                  service = restart["service"]
                  fence = restart["authority_fence"]
                  result = fence["result"]
                  terminal = result["terminal"]
                  authority = terminal["authority_anchor"]
                  prior = fence["prior_authority_anchor"]
                  new = restart["new_authority_anchor"]
                  armed = restart["workload_coordination"]["armed"]
                  marker = armed["marker"]
                  recovery_ack = restart["workload_coordination"]["completed"][
                      "recovery_acknowledgement"
                  ]
                  valid = (
                      service in expected_nodes
                      and set(fence) == fence_wrapper_fields
                      and type(fence.get("host_exec_attempts")) is int
                      and fence["host_exec_attempts"] >= 1
                      and set(result) == fence_result_fields
                      and type(result.get("request_retry_count")) is int
                      and result["request_retry_count"] >= 0
                      and result.get("schema")
                      == "lets.production-profile-authority-fence/v1"
                      and result.get("status") == "passed"
                      and result.get("node") == service
                      and terminal.get("schema") == "lets.authority-admission-fence/v1"
                      and set(terminal) == fence_terminal_fields
                      and type(terminal.get("namespace_process_id")) is int
                      and terminal["namespace_process_id"] > 0
                      and type(terminal.get("fenced_at_monotonic_ns")) is int
                      and terminal["fenced_at_monotonic_ns"] >= 0
                      and terminal.get("restart_id") == marker.get("restart_id")
                      and terminal.get("warden_id") == service
                      and valid_authority(authority, fenced=True, terminal=True)
                      and valid_authority(prior, fenced=False, terminal=True)
                      and valid_authority(new, fenced=False, terminal=True)
                      and terminal.get("lifetime_id") == authority.get("lifetime_id")
                      and terminal.get("namespace_process_id")
                      == authority.get("namespace_process_id")
                      and terminal.get("fenced_at_monotonic_ns")
                      == authority.get("fenced_at_monotonic_ns")
                      and authority.get("fence_id") == marker.get("restart_id")
                      and prior == armed["acknowledgement"].get("prior_authority_anchor")
                      and authority.get("lifetime_id") == prior.get("lifetime_id")
                      and authority.get("namespace_process_id")
                      == prior.get("namespace_process_id")
                      and all(
                          authority[name] >= prior[name]
                          for name in authority_counter_fields
                      )
                      and (
                          prior.get("first_fault") is None
                          or authority.get("first_fault") == prior.get("first_fault")
                      )
                      and recovery_ack.get("recovered_authority_anchor") == new
                      and new.get("lifetime_id") != prior.get("lifetime_id")
                      and fence.get("host_container_id") == restart.get("prior_container_id")
                      and fence.get("host_pid") == restart.get("prior_pid")
                  )
                  raw_authority_valid = raw_authority_valid and valid
                  if not valid:
                      continue
                  old_lifetime = authority["lifetime_id"]
                  new_lifetime = new["lifetime_id"]
                  if old_lifetime in all_lifetimes or new_lifetime in recovery_baselines:
                      raw_authority_valid = False
                  all_lifetimes.add(old_lifetime)
                  terminal_by_lifetime[old_lifetime] = authority
                  terminal_authorities.append(authority)
                  recovery_baselines[new_lifetime] = new
                  planned_pairs[service].append((old_lifetime, new_lifetime))
              for node in expected_nodes:
                  terminal = final_core_fences[node]
                  authority = terminal["authority_anchor"]
                  fence_id = terminal.get("restart_id")
                  final_snapshot = final_nodes[node]["authority_anchor"]
                  valid = (
                      terminal.get("schema") == "lets.authority-admission-fence/v1"
                      and set(terminal) == fence_terminal_fields
                      and type(terminal.get("namespace_process_id")) is int
                      and terminal["namespace_process_id"] > 0
                      and type(terminal.get("fenced_at_monotonic_ns")) is int
                      and terminal["fenced_at_monotonic_ns"] >= 0
                      and terminal.get("warden_id") == node
                      and valid_authority(authority, fenced=True, terminal=True)
                      and terminal.get("lifetime_id") == authority.get("lifetime_id")
                      and terminal.get("namespace_process_id")
                      == authority.get("namespace_process_id")
                      and terminal.get("fenced_at_monotonic_ns")
                      == authority.get("fenced_at_monotonic_ns")
                      and fence_id == authority.get("fence_id")
                      and fence_id
                      == f"final-verification-{configuration.get('seed')}-{node}"
                      and valid_authority(
                          final_snapshot, fenced=False, terminal=True
                      )
                      and authority.get("lifetime_id")
                      == final_snapshot.get("lifetime_id")
                      and authority.get("namespace_process_id")
                      == final_snapshot.get("namespace_process_id")
                      and all(
                          authority[name] >= final_snapshot[name]
                          for name in authority_counter_fields
                      )
                      and (
                          final_snapshot.get("first_fault") is None
                          or authority.get("first_fault")
                          == final_snapshot.get("first_fault")
                      )
                      and authority["lifetime_id"] not in all_lifetimes
                  )
                  raw_authority_valid = raw_authority_valid and valid
                  if not valid:
                      continue
                  all_lifetimes.add(authority["lifetime_id"])
                  terminal_by_lifetime[authority["lifetime_id"]] = authority
                  terminal_authorities.append(authority)
              for lifetime, baseline in recovery_baselines.items():
                  terminal = terminal_by_lifetime.get(lifetime)
                  raw_authority_valid = raw_authority_valid and (
                      isinstance(terminal, dict)
                      and terminal.get("namespace_process_id")
                      == baseline.get("namespace_process_id")
                      and all(
                          terminal[name] >= baseline[name]
                          for name in authority_counter_fields
                      )
                      and (
                          baseline.get("first_fault") is None
                          or terminal.get("first_fault") == baseline.get("first_fault")
                      )
                  )
              observed = {node: [] for node in expected_nodes}
              for sample in health_samples:
                  nodes = sample.get("nodes") if isinstance(sample, dict) else None
                  if not isinstance(nodes, dict):
                      raw_authority_valid = False
                      continue
                  for node in expected_nodes:
                      document = nodes.get(node)
                      if not isinstance(document, dict) or "planned_unavailable" in document:
                          continue
                      authority = document.get("authority_anchor")
                      terminal = (
                          terminal_by_lifetime.get(authority.get("lifetime_id"))
                          if isinstance(authority, dict) else None
                      )
                      valid = (
                          valid_authority(authority, fenced=False, terminal=True)
                          and isinstance(terminal, dict)
                          and terminal.get("namespace_process_id")
                          == authority.get("namespace_process_id")
                          and all(
                              terminal[name] >= authority[name]
                              for name in authority_counter_fields
                          )
                          and (
                              authority.get("first_fault") is None
                              or terminal.get("first_fault") == authority.get("first_fault")
                          )
                      )
                      raw_authority_valid = raw_authority_valid and valid
                      if valid:
                          observed[node].append(authority)
              for node, snapshots in observed.items():
                  if not snapshots:
                      raw_authority_valid = False
                      continue
                  transitions = []
                  previous = snapshots[0]
                  for current in snapshots[1:]:
                      if current["lifetime_id"] == previous["lifetime_id"]:
                          raw_authority_valid = raw_authority_valid and (
                              current["namespace_process_id"]
                              == previous["namespace_process_id"]
                              and all(
                                  current[name] >= previous[name]
                                  for name in authority_counter_fields
                              )
                              and (
                                  previous["first_fault"] is None
                                  or current["first_fault"] == previous["first_fault"]
                              )
                          )
                      else:
                          transitions.append(
                              (previous["lifetime_id"], current["lifetime_id"])
                          )
                      previous = current
                  raw_authority_valid = raw_authority_valid and (
                      transitions == planned_pairs[node]
                      and final_core_fences[node]["authority_anchor"]["lifetime_id"]
                      == previous["lifetime_id"]
                  )
          except (KeyError, TypeError, IndexError, AttributeError):
              raw_authority_valid = False

          authority_totals = {name: 0 for name in authority_counter_fields}
          for status in terminal_authorities:
              for name in authority_counter_fields:
                  authority_totals[name] += status[name]
          raw_authority_valid = raw_authority_valid and (
              authority_totals["transport_faults"]
              == authority_totals["transport_fault_episodes"]
              == authority_totals["transport_recovery_attempts"]
              == authority_totals["transport_recoveries"]
              == 1
              and authority_totals["permanent_faults"] == 0
              and authority_summary.get("passed") is True
              and set(authority_summary) == {
                  "core_lifetime_count", "executor_lifetime_count",
                  "global_counters", "passed", "terminal_lifetime_count",
              }
              and isinstance(authority_summary.get("global_counters"), dict)
              and set(authority_summary["global_counters"])
              == set(authority_counter_fields)
              and all(
                  type(value) is int and value >= 0
                  for value in authority_summary["global_counters"].values()
              )
              and authority_summary.get("global_counters") == authority_totals
              and type(authority_summary.get("core_lifetime_count")) is int
              and authority_summary.get("core_lifetime_count")
              == len(terminal_by_lifetime)
              and type(authority_summary.get("executor_lifetime_count")) is int
              and authority_summary.get("executor_lifetime_count")
              == len(all_lifetimes) - len(terminal_by_lifetime)
              and type(authority_summary.get("terminal_lifetime_count")) is int
              and authority_summary.get("terminal_lifetime_count")
              == len(terminal_authorities)
          )
          if not raw_authority_valid:
              failures.append("soak authority lifetime and recovery budget is not raw-bound")
          # END RAW AUTHORITY EVIDENCE VERIFIER
          if failures:
              raise SystemExit("; ".join(failures))
          PY
      - name: Archive failed production-profile soak diagnostics
        if: ${{ always() && (failure() || cancelled()) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: >-
            diagnostic-production-soak-${{ needs.verify.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/generated/production-profile-soak.json
          if-no-files-found: error
          retention-days: 90
      - name: Archive verified production-profile soak release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-production-soak-${{ needs.verify.outputs.version }}
          path: results/generated/production-profile-soak.json
          if-no-files-found: error
          retention-days: 90

  image:
    name: Scan, attest, sign, and promote the accepted OCI candidate
    needs: [verify, package, image-candidate, production-acceptance, production-soak]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Compute immutable release tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
      - name: Verify both candidate architectures are present
        id: manifest
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ needs.image-candidate.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE_REF" \
            --format '{{json .Manifest}}' > image-manifest.json
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          digest_pattern = re.compile(r"sha256:[0-9a-f]{64}")
          image_ref = os.environ["IMAGE_REF"]
          index_digest = image_ref.rsplit("@", 1)[-1]
          if digest_pattern.fullmatch(index_digest) is None:
              raise SystemExit(f"candidate has an invalid index digest: {index_digest!r}")

          manifest = json.loads(Path("image-manifest.json").read_text(encoding="utf-8"))
          required = {"linux/amd64", "linux/arm64"}
          descriptors: dict[str, str] = {}
          for entry in manifest.get("manifests", []):
              platform = entry.get("platform") or {}
              name = f'{platform.get("os", "")}/{platform.get("architecture", "")}'
              if name not in required:
                  continue
              digest = entry.get("digest", "")
              if digest_pattern.fullmatch(digest) is None:
                  raise SystemExit(f"published {name} manifest has an invalid digest: {digest!r}")
              if name in descriptors:
                  raise SystemExit(f"published image has duplicate {name} manifests")
              descriptors[name] = digest
          missing = required - descriptors.keys()
          if missing:
              raise SystemExit(f"published image is missing platforms: {sorted(missing)}")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f'amd64_digest={descriptors["linux/amd64"]}\n')
              stream.write(f'arm64_digest={descriptors["linux/arm64"]}\n')
          PY
      - name: Require patched SQLite in both exact published architectures
        env:
          AMD64_DIGEST: ${{ steps.manifest.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.manifest.outputs.arm64_digest }}
        shell: bash
        run: |
          set -euo pipefail
          : > sqlite-runtime-versions.txt
          for image in "linux/amd64 $AMD64_DIGEST" "linux/arm64 $ARM64_DIGEST"; do
            read -r platform child_digest <<< "$image"
            version="$(docker run --rm --pull always --platform "$platform" \
              --user 10001:10001 --read-only --network none --cap-drop ALL \
              --security-opt no-new-privileges --entrypoint python \
              "$IMAGE_NAME@$child_digest" \
              -c 'import sqlite3; from lets.cli import _require_production_sqlite; _require_production_sqlite(); print(sqlite3.sqlite_version)')"
            printf '%s %s\n' "$platform" "$version" | tee -a sqlite-runtime-versions.txt
          done
      - name: Scan the exact published amd64 candidate with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ needs.image-candidate.outputs.digest }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          output: trivy-amd64.txt
          exit-code: 1
          version: v0.73.0
      - name: Scan the exact published arm64 candidate with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ needs.image-candidate.outputs.digest }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          output: trivy-arm64.txt
          exit-code: 1
          version: v0.73.0
      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.50.0
      - name: Generate and validate one SPDX SBOM per published architecture
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ needs.image-candidate.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            arch="${platform#linux/}"
            "${{ steps.syft.outputs.cmd }}" scan "$IMAGE_REF" \
              --from registry \
              --platform "$platform" \
              --output "spdx-json=lets-container-$arch.spdx.json" \
              --output "syft-json=lets-container-$arch.syft.json"
          done
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          digest_pattern = re.compile(r"sha256:[0-9a-f]{64}")
          image_ref = os.environ["IMAGE_REF"]
          index_digest = image_ref.rsplit("@", 1)[-1]
          if digest_pattern.fullmatch(index_digest) is None:
              raise SystemExit(f"candidate has an invalid index digest: {index_digest!r}")

          manifest = json.loads(Path("image-manifest.json").read_text(encoding="utf-8"))
          child_digests: dict[str, str] = {}
          for entry in manifest.get("manifests", []):
              platform = entry.get("platform") or {}
              name = f'{platform.get("os", "")}/{platform.get("architecture", "")}'
              if name in {"linux/amd64", "linux/arm64"}:
                  digest = entry.get("digest", "")
                  if name in child_digests or digest_pattern.fullmatch(digest) is None:
                      raise SystemExit(f"invalid or duplicate {name} manifest descriptor")
                  child_digests[name] = digest
          if child_digests.keys() != {"linux/amd64", "linux/arm64"}:
              raise SystemExit("candidate manifest does not contain exactly the required platforms")

          bindings: dict[str, object] = {
              "schema": "lets.container-sbom-index/v1",
              "image": image_ref,
              "index_digest": index_digest,
              "generator": {"name": "syft", "version": "1.50.0"},
              "platforms": {},
          }
          platform_bindings = bindings["platforms"]
          assert isinstance(platform_bindings, dict)
          for platform in ("linux/amd64", "linux/arm64"):
              arch = platform.removeprefix("linux/")
              native_path = Path(f"lets-container-{arch}.syft.json")
              spdx_path = Path(f"lets-container-{arch}.spdx.json")
              native = json.loads(native_path.read_text(encoding="utf-8"))
              spdx = json.loads(spdx_path.read_text(encoding="utf-8"))

              descriptor = native.get("descriptor") or {}
              source = native.get("source") or {}
              metadata = source.get("metadata") or {}
              if descriptor.get("name") != "syft" or descriptor.get("version") != "1.50.0":
                  raise SystemExit(f"{platform} SBOM was not generated by pinned Syft 1.50.0")
              if source.get("type") != "image" or source.get("version") != index_digest:
                  raise SystemExit(f"{platform} SBOM is not bound to candidate index {index_digest}")
              if metadata.get("os") != "linux" or metadata.get("architecture") != arch:
                  raise SystemExit(f"{platform} SBOM source metadata names the wrong platform")
              child_digest = child_digests[platform]
              if metadata.get("manifestDigest") != child_digest:
                  raise SystemExit(f"{platform} SBOM names the wrong child manifest")
              if image_ref not in (metadata.get("repoDigests") or []):
                  raise SystemExit(f"{platform} SBOM does not name the exact candidate reference")
              if not native.get("artifacts"):
                  raise SystemExit(f"{platform} native Syft result has no packages")

              creators = (spdx.get("creationInfo") or {}).get("creators") or []
              if not spdx.get("spdxVersion", "").startswith("SPDX-"):
                  raise SystemExit(f"{platform} output is not an SPDX document")
              if not spdx.get("documentNamespace") or not spdx.get("packages"):
                  raise SystemExit(f"{platform} SPDX document is incomplete")
              if "Tool: syft-1.50.0" not in creators:
                  raise SystemExit(f"{platform} SPDX document does not name pinned Syft 1.50.0")

              platform_bindings[platform] = {
                  "manifest_digest": child_digest,
                  "spdx_file": spdx_path.name,
                  "spdx_sha256": hashlib.sha256(spdx_path.read_bytes()).hexdigest(),
                  "package_count": len(spdx["packages"]),
              }

          Path("lets-container-sbom-index.json").write_text(
              json.dumps(bindings, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          printf '%s\n' "$IMAGE_REF" > image-digest.txt
      - name: Keyless-attest and verify each SPDX SBOM against its child manifest
        env:
          AMD64_DIGEST: ${{ steps.manifest.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.manifest.outputs.arm64_digest }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          for arch in amd64 arm64; do
            if [ "$arch" = "amd64" ]; then
              digest="$AMD64_DIGEST"
            else
              digest="$ARM64_DIGEST"
            fi
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "$arch child digest is missing or invalid: $digest" >&2
              exit 1
            fi
            predicate="lets-container-$arch.spdx.json"
            verification="lets-container-$arch.spdx-verification.json"
            cosign attest --yes \
              --predicate "$predicate" \
              --type spdxjson \
              "$IMAGE_NAME@$digest"
            cosign verify-attestation \
              --type spdxjson \
              --certificate-identity "$workflow_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-ref "$GITHUB_REF" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              --certificate-github-workflow-trigger push \
              --output json \
              "$IMAGE_NAME@$digest" > "$verification"
            ARCH="$arch" CHILD_DIGEST="$digest" VERIFICATION="$verification" python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          def json_documents(raw: str) -> list[object]:
              decoder = json.JSONDecoder()
              documents: list[object] = []
              offset = 0
              while offset < len(raw):
                  while offset < len(raw) and raw[offset].isspace():
                      offset += 1
                  if offset == len(raw):
                      break
                  document, offset = decoder.raw_decode(raw, offset)
                  documents.extend(document if isinstance(document, list) else [document])
              return documents

          expected_statement = {
              "_type": "https://in-toto.io/Statement/v0.1",
              "predicateType": "https://spdx.dev/Document",
              "subject": [
                  {
                      "digest": {
                          "sha256": os.environ["CHILD_DIGEST"].removeprefix("sha256:")
                      },
                      "name": os.environ["IMAGE_NAME"],
                  }
              ],
              "predicate": json.loads(
                  Path(f"lets-container-{os.environ['ARCH']}.spdx.json").read_text(
                      encoding="utf-8"
                  )
              ),
          }
          envelopes = json_documents(
              Path(os.environ["VERIFICATION"]).read_text(encoding="utf-8")
          )
          for envelope in envelopes:
              if not isinstance(envelope, dict) or not isinstance(envelope.get("payload"), str):
                  continue
              statement = json.loads(
                  base64.b64decode(envelope["payload"], validate=True).decode("utf-8")
              )
              if statement == expected_statement:
                  break
          else:
              raise SystemExit(
                  f"{os.environ['ARCH']} child manifest lacks its exact signed SPDX SBOM"
              )
          PY
          done
      - name: Keyless-sign and verify the exact image digest
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE_NAME@${{ needs.image-candidate.outputs.digest }}"
          workflow_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign sign --yes "$image"
          cosign verify \
            --certificate-identity "$workflow_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref "$GITHUB_REF" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            --certificate-github-workflow-trigger push \
            "$image" > image-signature-verification.json
      - name: Promote the verified digest to immutable release tags
        shell: bash
        env:
          RELEASE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          candidate_digest="${{ needs.image-candidate.outputs.digest }}"
          while IFS= read -r tag; do
            test -n "$tag" || continue
            existing_digest=""
            inspect_error="$(mktemp)"
            if existing_digest="$(
              docker buildx imagetools inspect "$tag" \
                --format '{{.Manifest.Digest}}' 2>"$inspect_error"
            )"; then
              rm -f "$inspect_error"
              if [ "$existing_digest" != "$candidate_digest" ]; then
                echo "refusing to move existing release image tag: $tag" >&2
                echo "existing=$existing_digest candidate=$candidate_digest" >&2
                exit 1
              fi
              echo "$tag already resolves to the verified candidate digest"
            else
              if ! grep -Eiq 'manifest unknown|not found|404' "$inspect_error"; then
                cat "$inspect_error" >&2
                rm -f "$inspect_error"
                echo "could not prove that release image tag is absent: $tag" >&2
                exit 1
              fi
              rm -f "$inspect_error"
              docker buildx imagetools create \
                --tag "$tag" \
                "$IMAGE_NAME@$candidate_digest"
            fi
            promoted_digest="$(
              docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}'
            )"
            if [ "$promoted_digest" != "$candidate_digest" ]; then
              echo "release tag did not resolve to the verified candidate: $tag" >&2
              echo "resolved=$promoted_digest candidate=$candidate_digest" >&2
              exit 1
            fi
          done <<< "$RELEASE_TAGS"
      - name: Archive release image assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-image-${{ needs.verify.outputs.version }}
          path: |
            image-digest.txt
            image-manifest.json
            lets-container-amd64.spdx.json
            lets-container-arm64.spdx.json
            lets-container-sbom-index.json
            sqlite-runtime-versions.txt
            trivy-amd64.txt
            trivy-arm64.txt
          if-no-files-found: error
          retention-days: 90

  github-release:
    name: Publish GitHub release after every gate succeeds
    needs: [verify, package, production-acceptance, production-soak, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-inputs
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Require the exact nonempty, collision-free release asset set
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          source = Path("release-inputs")
          destination = Path("release-assets")
          expected = {
              f"release-package-{version}": {
                  "SHA256SUMS",
                  f"lets-deployment-{version}.tar.gz",
                  f"lets_agent-{version}-py3-none-any.whl",
                  f"lets_agent-{version}.tar.gz",
                  "lets-python.cdx.json",
              },
              f"release-production-acceptance-{version}": {
                  "production-profile-acceptance.json",
              },
              f"release-production-soak-{version}": {
                  "production-profile-soak.json",
              },
              f"release-image-{version}": {
                  "image-digest.txt",
                  "image-manifest.json",
                  "lets-container-amd64.spdx.json",
                  "lets-container-arm64.spdx.json",
                  "lets-container-sbom-index.json",
                  "sqlite-runtime-versions.txt",
                  "trivy-amd64.txt",
                  "trivy-arm64.txt",
              },
          }
          actual_groups = {path.name for path in source.iterdir() if path.is_dir()}
          unexpected_entries = {path.name for path in source.iterdir() if not path.is_dir()}
          if actual_groups != expected.keys() or unexpected_entries:
              raise SystemExit(
                  "release artifact groups are incomplete or unexpected: "
                  f"groups={sorted(actual_groups)!r}, entries={sorted(unexpected_entries)!r}"
              )

          destination.mkdir(exist_ok=False)
          seen: set[str] = set()
          for group_name, expected_files in expected.items():
              group = source / group_name
              actual_files = {path.name for path in group.iterdir() if path.is_file()}
              nested = {path.name for path in group.iterdir() if not path.is_file()}
              if actual_files != expected_files or nested:
                  raise SystemExit(
                      f"release artifact {group_name!r} has the wrong files: "
                      f"files={sorted(actual_files)!r}, entries={sorted(nested)!r}"
                  )
              collisions = seen & actual_files
              if collisions:
                  raise SystemExit(f"release asset name collision: {sorted(collisions)!r}")
              for name in sorted(actual_files):
                  artifact = group / name
                  if artifact.stat().st_size <= 0:
                      raise SystemExit(f"release asset is empty: {group_name}/{name}")
                  shutil.copy2(artifact, destination / name)
              seen.update(actual_files)
          PY
      - name: Extract exact compatibility, migration, and rollback release notes
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"(?ms)^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}\n"
              rf"(?P<body>.*?)(?=^## \[|\Z)",
              changelog,
          )
          if match is None:
              raise SystemExit("release changelog section is missing")
          notes = f"## LETS {version}\n\n{match.group('body').strip()}\n"
          required = (
              "### Compatibility, migration, and rollback",
              "Compatibility",
              "migration",
              "rollback",
          )
          missing = [value for value in required if value not in notes]
          if missing:
              raise SystemExit(f"release notes omit required lifecycle facts: {missing!r}")
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          PY
      - name: Verify package hashes and construct the complete release checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS
          python - <<'PY'
          import hashlib
          from pathlib import Path

          directory = Path(".")
          checksum_name = "RELEASE_SHA256SUMS"
          signature_name = f"{checksum_name}.sigstore.json"
          artifacts = sorted(
              path
              for path in directory.iterdir()
              if path.is_file() and path.name not in {checksum_name, signature_name}
          )
          if len(artifacts) != 15:
              raise SystemExit("release asset set is incomplete")
          lines = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}"
              for path in artifacts
          ]
          (directory / checksum_name).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          sha256sum --check RELEASE_SHA256SUMS
      - name: Keyless-sign and verify the complete release checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="release-assets/RELEASE_SHA256SUMS"
          bundle_name="RELEASE_SHA256SUMS.sigstore.json"
          bundle="release-assets/$bundle_name"
          workflow_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign sign-blob --yes \
            --bundle "$bundle" \
            "$manifest" > /dev/null
          test -s "$bundle"
          cosign verify-blob \
            --bundle "$bundle" \
            --certificate-identity "$workflow_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref "$GITHUB_REF" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            --certificate-github-workflow-trigger push \
            "$manifest"

          release_state="$(mktemp)"
          release_error="$(mktemp)"
          trap 'rm -f "$release_state" "$release_error"' EXIT
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            > "$release_state" 2> "$release_error"; then
            bundle_mode="$(RELEASE_STATE="$release_state" BUNDLE_NAME="$bundle_name" python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path(os.environ["RELEASE_STATE"]).read_text(encoding="utf-8"))
          matching = [
              asset
              for asset in (state.get("assets") or [])
              if asset.get("name") == os.environ["BUNDLE_NAME"]
          ]
          if len(matching) > 1:
              raise SystemExit("existing GitHub release has duplicate Sigstore bundles")
          is_draft = state.get("draft")
          if not isinstance(is_draft, bool):
              raise SystemExit("existing GitHub release has an invalid draft state")
          print("reuse" if is_draft is False and matching else "retain")
          PY
            )"
            if [ "$bundle_mode" = "reuse" ]; then
              remote_dir="$(mktemp -d)"
              gh release download "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$bundle_name" \
                --dir "$remote_dir"
              test "$(find "$remote_dir" -maxdepth 1 -type f -name "$bundle_name" | wc -l)" -eq 1
              remote_bundle="$remote_dir/$bundle_name"
              test -s "$remote_bundle"
              cosign verify-blob \
                --bundle "$remote_bundle" \
                --certificate-identity "$workflow_identity" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
                --certificate-github-workflow-ref "$GITHUB_REF" \
                --certificate-github-workflow-sha "$GITHUB_SHA" \
                --certificate-github-workflow-trigger push \
                "$manifest"
              mv "$remote_bundle" "$bundle"
              echo "reused the existing release's verified Sigstore bundle"
            else
              echo "retained the freshly signed bundle for a draft or bundle-free release"
            fi
          elif ! grep -Eiq 'HTTP 404|not found' "$release_error"; then
            cat "$release_error" >&2
            echo "could not prove that an existing release bundle is absent" >&2
            exit 1
          fi
      - name: Publish or safely resume the immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: LETS ${{ needs.verify.outputs.version }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          ref="repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}"
          object_type="$(gh api "$ref" --jq '.object.type')"
          object_sha="$(gh api "$ref" --jq '.object.sha')"
          test "$object_type" = "tag" || {
            echo "release tag stopped being annotated before publication" >&2
            exit 1
          }
          tag="repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}"
          test "$(gh api "$tag" --jq '.verification.verified')" = "true"
          test "$(gh api "$tag" --jq '.object.type')" = "commit"
          test "$(gh api "$tag" --jq '.object.sha')" = "$GITHUB_SHA" || {
            echo "release tag moved before publication" >&2
            exit 1
          }
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          expected = {
              "RELEASE_SHA256SUMS",
              "RELEASE_SHA256SUMS.sigstore.json",
              "SHA256SUMS",
              "image-digest.txt",
              "image-manifest.json",
              "lets-container-amd64.spdx.json",
              "lets-container-arm64.spdx.json",
              "lets-container-sbom-index.json",
              f"lets-deployment-{version}.tar.gz",
              "lets-python.cdx.json",
              f"lets_agent-{version}-py3-none-any.whl",
              f"lets_agent-{version}.tar.gz",
              "production-profile-acceptance.json",
              "production-profile-soak.json",
              "sqlite-runtime-versions.txt",
              "trivy-amd64.txt",
              "trivy-arm64.txt",
          }
          directory = Path("release-assets")
          actual = {path.name for path in directory.iterdir() if path.is_file()}
          nested = {path.name for path in directory.iterdir() if not path.is_file()}
          if actual != expected or nested:
              raise SystemExit(
                  "final release asset allowlist mismatch: "
                  f"files={sorted(actual)!r}, entries={sorted(nested)!r}"
              )
          PY
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 17
          state_file="$(mktemp)"
          view_error="$(mktemp)"
          if ! gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,assets,body \
            >"$state_file" 2>"$view_error"; then
