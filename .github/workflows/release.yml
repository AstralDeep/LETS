          if len(partitions) < 2:
              failures.append("soak did not complete repeated partitions")
          elif any(
              not isinstance(item, dict)
              or not isinstance(item.get("observation"), dict)
              or item["observation"].get("durably_pending_observed") is not True
              or not isinstance(item["observation"].get("durable_sql"), dict)
              or item["observation"]["durable_sql"].get("status") != "PREPARED"
              for item in partitions
          ):
              failures.append("partition evidence did not bind exact durable failed transfers")
          recovery_value = chaos.get("partition_recovery")
          recovery = recovery_value if isinstance(recovery_value, list) else []
          if (
              not isinstance(recovery_value, list)
              or len(recovery) != len(partitions)
              or any(
                  not isinstance(item, dict) or item.get("passed") is not True
                  for item in recovery
              )
          ):
              failures.append("partition transfer streams did not recover exactly")
          restart_integrity = required_mapping(
              chaos.get("restart_integrity"), "soak restart-integrity evidence"
          )
          chaos_duration = (
              float(chaos_completed) - float(chaos_started)
              if finite_number(chaos_started) and finite_number(chaos_completed)
              else 0.0
          )
          restart_operations = (
              sorted(
                  (
                      float(item["host_operation_started_monotonic_seconds"])
                      - float(chaos_started),
                      float(item["host_operation_completed_monotonic_seconds"])
                      - float(chaos_started),
                      item["service"],
                  )
                  for item in restarts
                  if isinstance(item, dict)
                  and finite_number(item.get("host_operation_started_monotonic_seconds"))
                  and finite_number(item.get("host_operation_completed_monotonic_seconds"))
                  and item.get("service") in expected_nodes
              )
              if finite_number(chaos_started)
              else []
          )

          def lifetime_segments(operations):
              segments = []
              prior_completed = 0.0
              for operation_started, operation_completed, _service in operations:
                  segments.append(max(0.0, operation_started - prior_completed))
                  prior_completed = operation_completed
              segments.append(max(0.0, chaos_duration - prior_completed))
              return segments

          global_segments = lifetime_segments(restart_operations)
          required_lifetime = (
              float(configuration["restart_interval_seconds"]) * 0.8
              if finite_number(configuration.get("restart_interval_seconds"))
              else 0.0
          )
          expected_per_warden_lifetimes = {}
          for node in expected_nodes:
              node_operations = [
                  operation for operation in restart_operations if operation[2] == node
              ]
              node_segments = lifetime_segments(node_operations)
              expected_per_warden_lifetimes[node] = {
                  "longest_seconds": round(max(node_segments, default=0.0), 3),
                  "passed": True,
                  "planned_sigkill_seconds": [
                      round(operation[0], 3) for operation in node_operations
                  ],
                  "segments_seconds": [round(value, 3) for value in node_segments],
              }
          final_restart_state = restart_integrity.get("final_container_state")
          final_restart_state_valid = (
              isinstance(final_restart_state, dict)
              and set(final_restart_state) == expected_nodes
              and all(
                  isinstance(state, dict)
                  and state.get("status") == "running"
                  and state.get("oom_killed") is False
                  and state.get("restart_count") == 0
                  and isinstance(state.get("exit_code"), int)
                  and not isinstance(state.get("exit_code"), bool)
                  and state.get("exit_code") >= 0
                  for state in final_restart_state.values()
              )
          )
          if (
              restart_integrity.get("passed") is not True
              or restart_integrity.get("all_wardens_sigkilled") is not True
              or restart_integrity.get("planned_sigkills") != len(restarts)
              or not close_number(
                  restart_integrity.get("chaos_duration_seconds"),
                  round(chaos_duration, 3),
              )
              or not close_number(
                  restart_integrity.get("minimum_sigkill_free_seconds"),
                  round(required_lifetime, 3),
              )
              or not close_number(
                  restart_integrity.get("longest_sigkill_free_seconds"),
                  round(max(global_segments, default=0.0), 3),
              )
              or max(global_segments, default=0.0) < required_lifetime
              or restart_integrity.get("per_warden_lifetimes")
              != expected_per_warden_lifetimes
              or not final_restart_state_valid
              or restart_integrity.get("restart_count_policy")
              != "all samples and final states equal zero"
              or any(
                  item["longest_seconds"] < required_lifetime
                  for item in expected_per_warden_lifetimes.values()
              )
          ):
              failures.append("soak SIGKILL or per-warden lifetime evidence is incomplete")
          resources = required_mapping(evidence.get("resources"), "soak resource evidence")
          resource_evaluation = required_mapping(
              resources.get("evaluation"), "soak resource evaluation"
          )
          if resource_evaluation.get("passed") is not True:
              failures.append("soak resource bounds did not pass")
          expected_resource_bounds = {
              "cgroup_memory_max_bytes": 1024 * 1024 * 1024,
              "cgroup_pids_max": 256,
              "cgroup_swap_max_bytes": 0,
              "max_cgroup_memory_peak_bytes": 768 * 1024 * 1024,
              "max_cgroup_pids_peak": 192,
              "max_rss_bytes": 256 * 1024 * 1024,
              "max_rss_growth_bytes": 128 * 1024 * 1024,
          }
          actual_resource_bounds = required_mapping(
              resource_evaluation.get("bounds"), "soak resource bounds"
          )
          if any(
              actual_resource_bounds.get(name) != value
              for name, value in expected_resource_bounds.items()
          ):
              failures.append("soak used the wrong process or cgroup resource bounds")
          required_resource_checks = {
              "cgroup_memory_events",
              "cgroup_memory_limit",
              "cgroup_memory_peak",
              "cgroup_pids_events",
              "cgroup_pids_limit",
              "cgroup_pids_peak",
              "cgroup_probe",
              "cgroup_swap_events",
              "cgroup_swap_limit",
              "cgroup_swap_usage",
              "rss",
              "rss_growth",
          }
          resource_measurements = required_mapping(
              resource_evaluation.get("measurements"), "soak resource measurements"
          )
          if not isinstance(resource_measurements, dict) or set(resource_measurements) != {
              "warden-a",
              "warden-b",
              "warden-c",
          } or any(
              not isinstance(item, dict)
              or not isinstance(item.get("checks"), dict)
              or not required_resource_checks.issubset(item["checks"])
              or any(item["checks"].get(name) is not True for name in required_resource_checks)
              for item in (
                  resource_measurements.values()
                  if isinstance(resource_measurements, dict)
                  else ()
              )
          ):
              failures.append("soak cgroup v2 or LETS-child resource checks are incomplete")
          resource_samples_value = resources.get("samples")
          resource_samples = (
              resource_samples_value if isinstance(resource_samples_value, list) else []
          )
          resource_sample_count = resources.get("sample_count")
          if (
              not isinstance(resource_samples_value, list)
              or not isinstance(resource_sample_count, int)
              or isinstance(resource_sample_count, bool)
              or resource_sample_count != len(resource_samples)
          ):
              failures.append("soak resource sample count is inconsistent")
          for restart in restarts:
              if not isinstance(restart, dict):
                  failures.append("planned SIGKILL resource checkpoint is malformed")
                  continue
              checkpoint = restart.get("resource_checkpoint", {})
              if not isinstance(checkpoint, dict):
                  failures.append("planned SIGKILL resource checkpoint is malformed")
                  continue
              sample_index = checkpoint.get("sample_index")
              if (
                  checkpoint.get("evaluation_passed") is not True
                  or checkpoint.get("sample_reason") != "pre_sigkill"
                  or checkpoint.get("service") != restart.get("service")
                  or not finite_number(
                      checkpoint.get("host_observed_monotonic_seconds")
                  )
                  or not finite_number(chaos_started)
                  or float(checkpoint["host_observed_monotonic_seconds"])
                  < float(chaos_started)
                  or isinstance(sample_index, bool)
                  or not isinstance(sample_index, int)
                  or not 0 <= sample_index < len(resource_samples)
              ):
                  failures.append("planned SIGKILL lacks an evaluated resource checkpoint")
                  continue
              sample = resource_samples[sample_index]
              if (
                  not isinstance(sample, dict)
                  or
                  sample.get("reason") != "pre_sigkill"
                  or sample.get("planned_sigkill_service") != restart.get("service")
                  or sample.get("host_observed_monotonic_seconds")
                  != checkpoint.get("host_observed_monotonic_seconds")
              ):
                  failures.append("planned SIGKILL resource checkpoint is not bound to its sample")
          package = required_mapping(evidence.get("package"), "soak package evidence")
          package_identity = required_mapping(
              package.get("identity"), "soak package identity evidence"
          )
          if package_identity.get("passed") is not True:
              failures.append("soak package/OCI identity checks did not pass")
          cleanup = required_mapping(evidence.get("cleanup"), "soak cleanup evidence")
          if (
              cleanup.get("performed") is not True
              or cleanup.get("remaining_containers") != 0
              or cleanup.get("remaining_volumes") != 0
              or cleanup.get("remaining_networks") != 0
          ):
              failures.append("soak did not prove complete Docker cleanup")
          verification = required_mapping(
              evidence.get("verification"), "soak final verification"
          )
          if verification.get("converged") is not True:
              failures.append("soak did not converge")
          final_health = required_mapping(
              verification.get("final_health"), "soak final health evidence"
          )
          final_nodes = final_health.get("nodes")
          if (
              not isinstance(final_nodes, dict)
              or set(final_nodes) != expected_nodes
              or any(
                  not isinstance(document, dict)
                  or not isinstance(document.get("audit_exporter"), dict)
                  or document["audit_exporter"].get("last_error") is not None
                  for document in (
                      final_nodes.values() if isinstance(final_nodes, dict) else ()
                  )
              )
          ):
              failures.append("soak final audit exporter state retained an error")
          conservation = required_mapping(
              verification.get("conservation"), "soak conservation evidence"
          )
          if conservation.get("balanced") is not True:
              failures.append("soak conservation failed")
          # BEGIN RAW AUTHORITY EVIDENCE VERIFIER
          import hashlib
          import json
          import math

          health_samples_value = workload.get("health_samples")
          health_samples = (
              health_samples_value if isinstance(health_samples_value, list) else []
          )
          final_health_value = verification.get("final_health")
          final_nodes = (
              final_health_value.get("nodes")
              if isinstance(final_health_value, dict)
              else None
          )
          authority_summary = required_mapping(
              evidence.get("authority_evaluation"), "soak authority evaluation"
          )
          terminal_capture = verification.get("terminal_capture")
          raw_terminal_capture_valid = (
              verification.get("schema")
              == "lets.production-profile-soak-verification/v1"
              and verification.get("status") == "passed"
              and isinstance(terminal_capture, dict)
              and set(terminal_capture) == {
                  "completed_monotonic_seconds",
                  "deadline_monotonic_seconds",
                  "started_monotonic_seconds",
              }
              and all(finite_number(item) for item in terminal_capture.values())
          )
          if raw_terminal_capture_valid:
              capture_started = float(terminal_capture["started_monotonic_seconds"])
              capture_completed = float(terminal_capture["completed_monotonic_seconds"])
              capture_deadline = float(terminal_capture["deadline_monotonic_seconds"])
              raw_terminal_capture_valid = (
                  capture_started <= capture_completed <= capture_deadline
                  and close_number(capture_deadline - capture_started, 90.0)
              )
          core_authority_fields = {
              "admission_fenced", "enabled", "fault_reason", "fault_stage",
              "fence_id", "fenced_at_monotonic_ns", "first_fault", "healthy",
              "lifetime_id", "namespace_process_id", "permanent_faults",
              "retry_not_before_monotonic_ns", "state", "transport_fault_episodes",
              "transport_faults", "transport_recoveries",
              "transport_recovery_attempts", "unresolved_transport_faults",
          }
          executor_authority_fields = core_authority_fields - {
              "admission_fenced", "fence_id", "fenced_at_monotonic_ns",
              "namespace_process_id",
          }
          authority_counter_fields = (
              "transport_faults", "transport_fault_episodes",
              "transport_recovery_attempts", "transport_recoveries",
              "permanent_faults",
          )
          first_fault_fields = {
              "helper_exit_code", "helper_pid", "mutation_uncertain", "operation",
              "reason", "request_flushed", "stage",
          }
          transport_reasons = {
              "deadline", "helper_eof", "helper_pipe", "helper_start",
              "helper_start_deadline", "helper_start_in_progress",
              "process_lock_deadline",
          }
          transport_operations = {"compare-and-set", "confirm", "initialize", "read"}
          executor_checkpoint_fields = {
              "audience", "claim_digest", "claim_sequence", "clock_floor_ns",
              "config_epoch", "database_instance_id", "envelope_id",
              "executor_policy_sha256", "format", "schema_version", "tenant_id",
              "trust_registry_sha256",
          }

          def valid_identifier(value):
              return (
                  isinstance(value, str)
                  and value
                  and len(value) <= 512
                  and value == value.strip()
                  and not any(
                      ord(character) < 0x20 or ord(character) == 0x7F
                      for character in value
                  )
              )

          def valid_digest(value):
              if (
                  not isinstance(value, str)
                  or len(value) != 43
                  or re.fullmatch(r"[A-Za-z0-9_-]{43}", value) is None
              ):
                  return False
              try:
                  decoded = base64.urlsafe_b64decode(value + "=")
              except (ValueError, TypeError):
                  return False
              return (
                  len(decoded) == 32
                  and base64.urlsafe_b64encode(decoded).decode("ascii").rstrip("=")
                  == value
              )

          def valid_executor_checkpoint(value):
              if not isinstance(value, dict) or set(value) != executor_checkpoint_fields:
                  return False
              floor = value.get("clock_floor_ns")
              return (
                  value.get("format") == "LETS-EXECUTOR-AUTHORITY-ANCHOR/1"
                  and type(value.get("schema_version")) is int
                  and value.get("schema_version") == 5
                  and value.get("audience") == "production-soak-executor"
                  and value.get("tenant_id") == "production-acceptance-tenant"
                  and value.get("envelope_id") == "production-acceptance-envelope"
                  and value.get("config_epoch") == 1
                  and all(
                      valid_identifier(value.get(name))
                      for name in ("audience", "tenant_id", "envelope_id")
                  )
                  and type(value.get("config_epoch")) is int
                  and 1 <= value["config_epoch"] <= (1 << 63) - 1
                  and type(value.get("claim_sequence")) is int
                  and 0 <= value["claim_sequence"] <= (1 << 63) - 1
                  and (
                      floor is None
                      or type(floor) is int and 0 <= floor <= (1 << 63) - 1
                  )
                  and all(
                      valid_digest(value.get(name))
                      for name in (
                          "executor_policy_sha256", "trust_registry_sha256",
                          "database_instance_id", "claim_digest",
                      )
                  )
                  and (
                      value["claim_sequence"] != 0
                      or value["claim_digest"] == "A" * 43
                  )
              )

          def checkpoint_identity(value):
              return tuple(
                  value[name] for name in (
                      "audience", "tenant_id", "envelope_id", "config_epoch",
                      "executor_policy_sha256", "trust_registry_sha256",
                      "schema_version", "database_instance_id",
                  )
              )

          def valid_authority(value, *, executor=False, fenced=None, terminal=False):
              expected_fields = (
                  executor_authority_fields if executor else core_authority_fields
              )
              if not isinstance(value, dict) or set(value) != expected_fields:
                  return False
              state = value.get("state")
              if (
                  value.get("enabled") is not True
                  or state not in {
                      "healthy", "recoverable_transport_fault", "permanent_fault"
                  }
                  or type(value.get("healthy")) is not bool
                  or value.get("healthy") is not (state == "healthy")
                  or not isinstance(value.get("lifetime_id"), str)
                  or re.fullmatch(r"[0-9a-f]{32}", value["lifetime_id"]) is None
              ):
                  return False
              if executor:
                  if fenced is not None:
                      return False
              elif (
                  type(value.get("namespace_process_id")) is not int
                  or value["namespace_process_id"] <= 0
                  or value["namespace_process_id"] > (1 << 31) - 1
                  or type(value.get("admission_fenced")) is not bool
                  or (
                      fenced is not None
                      and value.get("admission_fenced") is not fenced
                  )
              ):
                  return False
              if not executor:
                  if value["admission_fenced"]:
                      if (
                          not isinstance(value.get("fence_id"), str)
                          or not 1 <= len(value["fence_id"]) <= 128
                          or type(value.get("fenced_at_monotonic_ns")) is not int
                          or not 0
                          <= value["fenced_at_monotonic_ns"]
                          <= (1 << 63) - 1
                      ):
                          return False
                  elif value.get("fence_id") is not None or value.get(
                      "fenced_at_monotonic_ns"
                  ) is not None:
                      return False
              counters = {}
              for name in authority_counter_fields:
                  item = value.get(name)
                  if type(item) is not int or not 0 <= item <= (1 << 63) - 1:
                      return False
                  counters[name] = item
              unresolved = value.get("unresolved_transport_faults")
              if (
                  type(unresolved) is not int
                  or unresolved not in {0, 1}
                  or counters["transport_faults"] < counters["transport_fault_episodes"]
                  or counters["transport_fault_episodes"] < counters["transport_recoveries"]
                  or counters["transport_recovery_attempts"]
                  < counters["transport_recoveries"]
                  or unresolved != int(state == "recoverable_transport_fault")
                  or (state == "permanent_fault" and counters["permanent_faults"] == 0)
              ):
                  return False
              stage = value.get("fault_stage")
              reason = value.get("fault_reason")
              retry = value.get("retry_not_before_monotonic_ns")
              if stage is not None and stage not in {"pre_begin", "post_commit"}:
                  return False
              if reason is not None and (
                  not isinstance(reason, str)
                  or re.fullmatch(r"[a-z0-9_]{1,64}", reason) is None
              ):
                  return False
              if state == "healthy":
                  if stage is not None or reason is not None or retry is not None:
                      return False
              elif state == "recoverable_transport_fault":
                  if (
                      stage is None
                      or reason is None
                      or type(retry) is not int
                      or not 0 <= retry <= (1 << 63) - 1
                  ):
                      return False
              elif retry is not None:
                  return False
              first = value.get("first_fault")
              if first is None:
                  if counters["transport_faults"] != 0:
                      return False
              elif (
                  not isinstance(first, dict)
                  or set(first) != first_fault_fields
                  or counters["transport_faults"] == 0
                  or first.get("stage") not in {"pre_begin", "post_commit"}
                  or first.get("operation") not in transport_operations
                  or first.get("reason") not in transport_reasons
                  or type(first.get("request_flushed")) is not bool
                  or type(first.get("mutation_uncertain")) is not bool
                  or (
                      first.get("operation") == "read"
                      and first.get("mutation_uncertain") is True
                  )
                  or (
                      first.get("reason")
                      in {"helper_start", "helper_start_deadline", "helper_start_in_progress"}
                      and (
                          first.get("request_flushed") is True
                          or first.get("mutation_uncertain") is True
                      )
                  )
              ):
                  return False
              else:
                  for name, positive in (("helper_pid", True), ("helper_exit_code", False)):
                      item = first.get(name)
                      minimum = 1 if positive else -(1 << 31)
                      if item is not None and (
                          type(item) is not int or not minimum <= item <= (1 << 31) - 1
                      ):
                          return False
              return not terminal or (
                  state == "healthy"
                  and unresolved == 0
                  and counters["permanent_faults"] == 0
                  and counters["transport_faults"]
                  == counters["transport_fault_episodes"]
                  == counters["transport_recovery_attempts"]
                  == counters["transport_recoveries"]
              )

          observation_dynamic_fields = {
              "age_ns", "authority_anchor", "capture_status", "fresh", "ready",
              "served_at_monotonic_ns", "service_ready",
          }
          observation_immutable_fields = {
              "audit_exporter", "audit_outbox", "audit_verification",
              "authority_checkpoint", "capture_duration_ns",
              "capture_started_monotonic_ns", "captured_at_monotonic_ns",
              "captured_at_ns", "captured_authority_anchor", "checked_at_ns",
              "clock_healthy", "core_state_revision", "database_instance_id",
              "generation", "invariant", "invariant_healthy", "leases",
              "lifetime_id", "max_age_ns", "observation_eligible",
              "peer_dispatcher", "published_at_monotonic_ns", "published_at_ns",
              "receipts", "resources", "revision", "runtime", "schema",
              "signing_key_healthy", "snapshot_id", "sqlite_schema_sha256",
              "storage_capacity", "transfers",
          }
          core_checkpoint_fields = {
              "audit_hash", "audit_sequence", "clock_floor_ns", "config_epoch",
              "database_instance_id", "envelope_id", "format", "schema_version",
              "signing_key_id", "signing_public_key_sha256", "state_digest",
              "state_revision", "tenant_id", "warden_id",
          }
          core_checkpoint_stable_fields = {
              "config_epoch", "database_instance_id", "envelope_id", "format",
              "schema_version", "signing_key_id", "signing_public_key_sha256",
              "tenant_id", "warden_id",
          }
          terminal_audit_proof_fields = {
              "authority_checkpoint_sha256", "authority_state_revision",
              "database_instance_id", "generation", "lifetime_id", "schema",
              "schema_definition_sha256", "startup_full_verification_at_ns",
              "valid", "verification_mode", "verified_at_ns",
              "verified_head_hash", "verified_head_sequence",
          }
          observation_document_fields = {
              "audit_exporter", "audit_outbox", "authority_anchor", "invariant",
              "observation", "observation_generation", "observation_revision",
              "observation_snapshot", "observation_snapshot_id", "peer_dispatcher",
              "ready", "receipts", "service_ready", "storage_capacity", "transfers",
          }
          observation_timing_fields = {
              "completed_elapsed_seconds", "metrics_observed_elapsed_seconds",
              "request_count", "request_path", "request_retries", "retry_errors",
              "started_elapsed_seconds",
          }

          def sha256_json(value):
              return "sha256:" + hashlib.sha256(
                  json.dumps(
                      value,
                      allow_nan=False,
                      ensure_ascii=False,
                      separators=(",", ":"),
                      sort_keys=True,
                  ).encode("utf-8")
              ).hexdigest()

          def valid_sha256(value):
              return (
                  isinstance(value, str)
                  and re.fullmatch(r"sha256:[0-9a-f]{64}", value) is not None
              )

          def valid_core_checkpoint(value, *, node):
              if not isinstance(value, dict) or set(value) != core_checkpoint_fields:
                  return False
              floor = value.get("clock_floor_ns")
              return (
                  value.get("format") == "LETS-AUTHORITY-ANCHOR/1"
                  and value.get("warden_id") == node
                  and value.get("tenant_id") == "production-acceptance-tenant"
                  and value.get("envelope_id") == "production-acceptance-envelope"
                  and type(value.get("config_epoch")) is int
                  and value.get("config_epoch") == 1
                  and type(value.get("schema_version")) is int
                  and value.get("schema_version") == 2
                  and valid_identifier(value.get("signing_key_id"))
                  and all(
                      valid_digest(value.get(name))
                      for name in (
                          "audit_hash", "database_instance_id",
                          "signing_public_key_sha256", "state_digest",
                      )
                  )
                  and type(value.get("audit_sequence")) is int
                  and -1 <= value["audit_sequence"] <= (1 << 63) - 1
                  and type(value.get("state_revision")) is int
                  and 0 <= value["state_revision"] <= (1 << 63) - 1
                  and (
                      floor is None
                      or type(floor) is int and 0 <= floor <= (1 << 63) - 1
                  )
              )

          def core_checkpoint_extends(prior, current):
              prior_floor = prior.get("clock_floor_ns")
              current_floor = current.get("clock_floor_ns")
              return (
                  all(
                      current.get(name) == prior.get(name)
                      for name in core_checkpoint_stable_fields
                  )
                  and current["state_revision"] >= prior["state_revision"]
                  and current["audit_sequence"] >= prior["audit_sequence"]
                  and not (
                      type(prior_floor) is int and type(current_floor) is not int
                  )
                  and not (
                      type(prior_floor) is int
                      and type(current_floor) is int
                      and current_floor < prior_floor
                  )
                  and (
                      current["audit_sequence"] != prior["audit_sequence"]
                      or (
                          current["audit_hash"] == prior["audit_hash"]
                          and current["state_revision"] == prior["state_revision"]
                          and current["state_digest"] == prior["state_digest"]
                      )
                  )
              )

          def valid_resource_vector(value, *, dimensions=None):
              return (
                  isinstance(value, list)
                  and bool(value)
                  and len(value) <= 256
                  and (dimensions is None or len(value) == dimensions)
                  and all(
                      type(item) is int and 0 <= item <= (1 << 63) - 1
                      for item in value
                  )
              )

          def valid_bounded_integer(value, *, minimum=0):
              return type(value) is int and minimum <= value <= (1 << 63) - 1

          def valid_runtime_status(value):
              return (
                  isinstance(value, dict)
                  and set(value)
                  == {"changed_at_ns", "changed_by", "generation", "mode", "reason"}
                  and value.get("mode") == "ACTIVE"
                  and valid_bounded_integer(value.get("generation"))
                  and valid_bounded_integer(value.get("changed_at_ns"))
                  and valid_identifier(value.get("changed_by"))
                  and isinstance(value.get("reason"), str)
                  and 1 <= len(value["reason"]) <= 2_000
              )

          def valid_capacity_status(value):
              fields = {
                  "additional_shared_memory_bytes", "database_bytes",
                  "effective_database_bytes", "filesystem_free_bytes", "free_pages",
                  "healthy", "logical_live_bytes", "main_database_bytes",
                  "max_database_bytes", "max_page_count", "min_free_disk_bytes",
                  "page_count", "page_size", "prior_full_error",
                  "remaining_main_growth_bytes", "required_filesystem_free_bytes",
                  "reserve_pages", "reusable_bytes", "shared_memory_bytes", "wal_bytes",
                  "worst_case_shared_memory_bytes", "worst_case_transaction_wal_bytes",
              }
              if not isinstance(value, dict) or set(value) != fields:
                  return False
              optional = {"filesystem_free_bytes", "max_database_bytes"}
              if (
                  value.get("healthy") is not True
                  or value.get("prior_full_error") is not False
                  or any(
                      not valid_bounded_integer(value.get(name))
                      for name in fields - optional - {"healthy", "prior_full_error"}
                  )
                  or any(
                      value.get(name) is not None
                      and not valid_bounded_integer(value.get(name))
                      for name in optional
                  )
                  or value["page_size"]
                  not in {512, 1_024, 2_048, 4_096, 8_192, 16_384, 32_768, 65_536}
                  or not value["free_pages"] <= value["page_count"] <= value["max_page_count"]
                  or value["database_bytes"]
                  != value["main_database_bytes"]
                  + value["wal_bytes"]
                  + value["shared_memory_bytes"]
                  or value["reusable_bytes"]
                  != min(
                      value["main_database_bytes"],
                      value["free_pages"] * value["page_size"],
                  )
                  or value["logical_live_bytes"]
                  != (value["page_count"] - value["free_pages"])
                  * value["page_size"]
                  or value["effective_database_bytes"] != value["logical_live_bytes"]
              ):
                  return False
              maximum = value["max_database_bytes"]
              configured_pages = (
                  value["page_count"] if maximum is None else value["max_page_count"]
              )
              if maximum is None:
                  if (
                      value["remaining_main_growth_bytes"] != 0
                      or value["worst_case_transaction_wal_bytes"] != 0
                  ):
                      return False
              elif (
                  maximum <= 0
                  or not value["max_page_count"] * value["page_size"]
                  <= maximum
                  < (value["max_page_count"] + 1) * value["page_size"]
                  or value["remaining_main_growth_bytes"]
                  != max(
                      0,
                      value["max_page_count"] * value["page_size"]
                      - value["main_database_bytes"],
                  )
                  or value["worst_case_transaction_wal_bytes"]
                  != 32
                  + value["max_page_count"] * (value["page_size"] + 24)
              ):
                  return False
              existing_wal_frames = 0
              if value["wal_bytes"] > 32:
                  frame_bytes = value["page_size"] + 24
                  existing_wal_frames = (
                      value["wal_bytes"] - 32 + frame_bytes - 1
                  ) // frame_bytes
              future_wal_frames = existing_wal_frames + (
                  configured_pages if maximum is not None else 0
              )
              worst_shared = 0
              if future_wal_frames > 0:
                  extra_frames = max(0, future_wal_frames - 4_062)
                  worst_shared = (1 + (extra_frames + 4_095) // 4_096) * 32_768
              reserve_bytes = value["reserve_pages"] * value["page_size"]
              required_free = value["min_free_disk_bytes"] + reserve_bytes
              if maximum is not None:
                  required_free = (
                      value["min_free_disk_bytes"]
                      + value["remaining_main_growth_bytes"]
                      + value["worst_case_transaction_wal_bytes"]
                      + value["additional_shared_memory_bytes"]
                  )
              filesystem_free = value["filesystem_free_bytes"]
              return (
                  value["worst_case_shared_memory_bytes"] == worst_shared
                  and value["additional_shared_memory_bytes"]
                  == max(0, worst_shared - value["shared_memory_bytes"])
                  and value["required_filesystem_free_bytes"] == required_free
                  and value["max_page_count"] - value["page_count"]
                  + value["free_pages"]
                  >= value["reserve_pages"]
                  and (
                      (
                          filesystem_free is not None
                          and filesystem_free >= required_free
                      )
                      or (
                          filesystem_free is None
                          and value["min_free_disk_bytes"] == 0
                      )
                  )
                  and (
                      maximum is None
                      or value["effective_database_bytes"] + reserve_bytes <= maximum
                  )
              )

          def valid_leases_status(value):
              allowed_statuses = {
                  "ACTIVE", "CLOSED", "EXPIRED", "MIGRATING", "PROVISIONED",
                  "QUIESCENT", "REVOKED", "TERMINATED",
              }
              by_status = value.get("by_status") if isinstance(value, dict) else None
              return (
                  isinstance(value, dict)
                  and set(value) == {"by_status", "total"}
                  and valid_bounded_integer(value.get("total"))
                  and isinstance(by_status, dict)
                  and set(by_status) <= allowed_statuses
                  and all(valid_bounded_integer(item) for item in by_status.values())
                  and sum(by_status.values()) == value["total"]
              )

          def valid_receipts_status(value):
              return (
                  isinstance(value, dict)
                  and set(value) == {"total"}
                  and valid_bounded_integer(value.get("total"))
              )

          def valid_transfers_status(value):
              fields = {
                  "in_flight_count", "inbound_gap_count",
                  "incoming_compacted_high_water", "incoming_contiguous_high_water",
                  "incoming_streams", "outgoing_acked_high_water",
                  "outgoing_compacted_high_water", "outgoing_streams",
              }
              return (
                  isinstance(value, dict)
                  and set(value) == fields
                  and all(valid_bounded_integer(value.get(name)) for name in fields)
                  and value["incoming_compacted_high_water"]
                  <= value["incoming_contiguous_high_water"]
                  and value["outgoing_compacted_high_water"]
                  <= value["outgoing_acked_high_water"]
              )

          def valid_outbox_status(value):
              return (
                  isinstance(value, dict)
                  and set(value) == {"oldest_unpublished_age_ns", "unpublished_count"}
                  and valid_bounded_integer(value.get("oldest_unpublished_age_ns"))
                  and valid_bounded_integer(value.get("unpublished_count"))
                  and (
                      value["unpublished_count"] != 0
                      or value["oldest_unpublished_age_ns"] == 0
                  )
              )

          def valid_peer_status(value, *, node, published_at_ns):
              fields = {
                  "configured_peers", "delivered_records", "durable_retry",
                  "failed_records", "healthy", "last_cycle_ns", "last_error",
                  "pending_records", "prepared_transfers", "running",
                  "superseded_records",
              }
              if not isinstance(value, dict) or set(value) != fields:
                  return False
              counted = fields - {
                  "durable_retry", "healthy", "last_cycle_ns", "last_error", "running",
              }
              if (
                  value.get("configured_peers") != 2
                  or any(not valid_bounded_integer(value.get(name)) for name in counted)
                  or value["failed_records"] > value["pending_records"]
                  or type(value.get("healthy")) is not bool
                  or value.get("running") is not True
                  or (
                      value.get("last_error") is not None
                      and (
                          not isinstance(value.get("last_error"), str)
                          or re.fullmatch(
                              r"[A-Za-z_][A-Za-z0-9_]{0,63}", value["last_error"]
                          ) is None
                      )
                  )
                  # With running pinned True, runtime healthy is exactly
                  # (last_cycle_ns is not None and last_error is None);
                  # last_cycle_ns is None before the first cycle completes.
                  or value.get("healthy")
                  is not (
                      value.get("last_cycle_ns") is not None
                      and value.get("last_error") is None
                  )
                  or (
                      value.get("last_cycle_ns") is not None
                      and (
                          not valid_bounded_integer(value.get("last_cycle_ns"), minimum=1)
                          or value["last_cycle_ns"] > published_at_ns
                      )
                  )
              ):
                  return False
              retry = value.get("durable_retry")
              retry_valid = retry is None or (
                  isinstance(retry, dict)
                  and set(retry)
                  == {
                      "attempt_count", "exception_class", "next_retry_delay_seconds",
                      "record_kind", "target_warden",
                  }
                  and valid_bounded_integer(retry.get("attempt_count"), minimum=1)
                  and isinstance(retry.get("exception_class"), str)
                  and re.fullmatch(
                      r"[A-Za-z_][A-Za-z0-9_]{0,63}", retry["exception_class"]
                  ) is not None
                  and finite_number(retry.get("next_retry_delay_seconds"))
                  and 0 <= float(retry["next_retry_delay_seconds"]) <= 30.0
                  and retry.get("record_kind")
                  in {"checkpoint", "revocation", "transfer"}
                  and retry.get("target_warden")
                  in {"warden-a", "warden-b", "warden-c"} - {node}
              )
              # A volatile cycle error may outlive its durable failed row once
              # delivery or supersession clears it, so durable_retry binds to
              # failed_records rather than last_error.
              return (
                  retry_valid
                  and (retry is None) is (value["failed_records"] == 0)
              )

          def valid_audit_exporter_status(value):
              fields = {
                  "archive_reconciled", "configured", "healthy", "last_error",
                  "last_success_ns", "max_pending", "max_stall_s",
                  "oldest_pending_age_s", "pending", "publish_blocked",
                  "publish_timeout_s", "running", "sink_call_blocked", "stalled_for_s",
              }
              if not isinstance(value, dict) or set(value) != fields:
                  return False
              if (
                  any(
                      type(value.get(name)) is not bool
                      for name in {
                          "archive_reconciled", "configured", "healthy",
                          "publish_blocked", "running", "sink_call_blocked",
                      }
                  )
                  or value.get("configured") is not True
                  or value.get("running") is not True
                  or value.get("publish_blocked") is not False
                  or value.get("sink_call_blocked") is not False
                  or not valid_bounded_integer(value.get("max_pending"), minimum=1)
                  or not valid_bounded_integer(value.get("pending"))
                  or value["pending"] > value["max_pending"]
                  or not finite_number(value.get("max_stall_s"))
                  or float(value["max_stall_s"]) <= 0
                  or not finite_number(value.get("publish_timeout_s"))
                  or float(value["publish_timeout_s"]) <= 0
                  or not finite_number(value.get("stalled_for_s"))
                  or not 0 <= float(value["stalled_for_s"]) <= float(value["max_stall_s"])
              ):
                  return False
              oldest = value.get("oldest_pending_age_s")
              if (
                  oldest is not None
                  and (
                      not finite_number(oldest)
                      or not 0 <= float(oldest) <= float(value["max_stall_s"])
                  )
              ) or (value["pending"] == 0) is not (oldest is None):
                  return False
              last_error = value.get("last_error")
              last_success = value.get("last_success_ns")
              # last_success_ns is volatile and resets to None on process
              # start, so an error before the first acknowledged non-empty
              # batch legitimately reports no prior success.
              return (
                  last_error in {None, "StorageError:sqlite_busy"}
                  and (
                      last_success is None
                      or valid_bounded_integer(last_success, minimum=1)
                  )
                  and value.get("healthy")
                  is (
                      last_error is None
                      and value.get("archive_reconciled") is True
                  )
                  and (
                      last_error is None
                      or value.get("archive_reconciled") is False
                  )
              )

          def valid_audit_exporter_projection(summary, raw):
              fields = {
                  "archive_reconciled", "catching_up", "healthy", "last_error",
                  "last_success_ns", "max_pending", "max_stall_s",
                  "oldest_pending_age_s", "pending", "publish_blocked", "running",
                  "sink_call_blocked", "stalled_for_s",
              }
              projected = {
                  name: raw.get(name)
                  for name in fields - {"catching_up"}
              } | {"catching_up": raw.get("healthy") is False}
              return isinstance(summary, dict) and set(summary) == fields and summary == projected

          def valid_observation_snapshot(value, *, node):
              if (
                  not isinstance(value, dict)
                  or set(value)
                  != observation_immutable_fields | observation_dynamic_fields
              ):
                  return False
              try:
                  encoded = json.dumps(
                      value,
                      allow_nan=False,
                      ensure_ascii=False,
                      separators=(",", ":"),
                      sort_keys=True,
                  ).encode("utf-8")
              except (TypeError, ValueError):
                  return False
              if len(encoded) > 20 * 1024:
                  return False
              generation = value.get("generation")
              lifetime = value.get("lifetime_id")
              snapshot_id = value.get("snapshot_id")
              immutable = {
                  key: item
                  for key, item in value.items()
                  if key not in observation_dynamic_fields and key != "snapshot_id"
              }
              immutable_with_id = {
                  key: item
                  for key, item in value.items()
                  if key not in observation_dynamic_fields
              }
              try:
                  immutable_encoded = json.dumps(
                      immutable_with_id,
                      allow_nan=False,
                      ensure_ascii=False,
                      separators=(",", ":"),
                      sort_keys=True,
                  ).encode("utf-8")
              except (TypeError, ValueError):
                  return False
              if (
                  value.get("schema") != "lets.observation-snapshot/v1"
                  or len(immutable_encoded) > 16 * 1024
                  or not isinstance(generation, str)
                  or re.fullmatch(r"[0-9a-f]{32}", generation) is None
                  or not isinstance(lifetime, str)
                  or re.fullmatch(r"[0-9a-f]{32}", lifetime) is None
                  or not valid_sha256(snapshot_id)
                  or snapshot_id != sha256_json(immutable)
              ):
                  return False

              integer_fields = (
                  "age_ns", "capture_duration_ns", "capture_started_monotonic_ns",
                  "captured_at_monotonic_ns", "captured_at_ns", "checked_at_ns",
                  "core_state_revision", "max_age_ns", "published_at_monotonic_ns",
                  "published_at_ns", "revision", "served_at_monotonic_ns",
              )
              if any(
                  not valid_bounded_integer(value.get(name))
                  for name in integer_fields
              ) or value["revision"] < 1:
                  return False
              if (
                  not value["capture_started_monotonic_ns"]
                  <= value["captured_at_monotonic_ns"]
                  <= value["published_at_monotonic_ns"]
                  or value["capture_duration_ns"]
                  != value["published_at_monotonic_ns"]
                  - value["capture_started_monotonic_ns"]
                  or value["published_at_ns"] < value["captured_at_ns"]
                  or value["max_age_ns"] != 15_000_000_000
                  or value["served_at_monotonic_ns"]
                  < value["published_at_monotonic_ns"]
                  or value["age_ns"]
                  != value["served_at_monotonic_ns"]
                  - value["captured_at_monotonic_ns"]
                  or value["age_ns"] >= value["max_age_ns"]
                  or value.get("fresh") is not True
              ):
                  return False
              capture_status = value.get("capture_status")
              if (
                  not isinstance(capture_status, dict)
                  or set(capture_status) != {
                      "attempt_sequence", "capture_in_progress",
                      "last_attempt_monotonic_ns", "last_error_type",
                      "last_successful_attempt_sequence",
                  }
                  or type(capture_status.get("attempt_sequence")) is not int
                  or not 1
                  <= capture_status["attempt_sequence"]
                  <= (1 << 63) - 1
                  or type(capture_status.get("capture_in_progress")) is not bool
                  or not valid_bounded_integer(
                      capture_status.get("last_attempt_monotonic_ns")
                  )
                  or capture_status["last_attempt_monotonic_ns"]
                  > value["served_at_monotonic_ns"]
                  or capture_status.get("last_error_type") is not None
                  or type(capture_status.get("last_successful_attempt_sequence"))
                  is not int
                  or not 1
                  <= capture_status["last_successful_attempt_sequence"]
                  <= (1 << 63) - 1
                  or capture_status["last_successful_attempt_sequence"]
                  > capture_status["attempt_sequence"]
                  or (
                      capture_status["capture_in_progress"] is False
                      and capture_status["last_successful_attempt_sequence"]
                      != capture_status["attempt_sequence"]
                  )
              ):
                  return False
              captured_authority = value.get("captured_authority_anchor")
              current_authority = value.get("authority_anchor")
              if (
                  not valid_authority(captured_authority, fenced=False)
                  or not valid_authority(current_authority, fenced=False)
                  or captured_authority.get("state") != "healthy"
                  or current_authority.get("state") != "healthy"
                  or captured_authority.get("lifetime_id") != lifetime
                  or current_authority.get("lifetime_id") != lifetime
                  or captured_authority.get("namespace_process_id")
                  != current_authority.get("namespace_process_id")
                  or any(
                      current_authority[name] < captured_authority[name]
                      for name in authority_counter_fields
                  )
                  or (
                      captured_authority.get("first_fault") is not None
                      and current_authority.get("first_fault")
                      != captured_authority.get("first_fault")
                  )
              ):
                  return False
              checkpoint = value.get("authority_checkpoint")
              if (
                  not valid_core_checkpoint(checkpoint, node=node)
                  or value.get("core_state_revision")
                  != checkpoint.get("state_revision")
                  or value.get("database_instance_id")
                  != checkpoint.get("database_instance_id")
              ):
                  return False
              audit = value.get("audit_verification")
              audit_fields = {
                  "captured_head_hash", "captured_head_sequence", "catching_up",
                  "error_type", "lag", "last_full_verification_at_ns", "page_size",
                  "schema_definition_sha256", "sticky_failure",
                  "sweep_cursor_sequence", "sweep_last_completed_at_ns",
                  "sweep_last_completed_head_hash",
                  "sweep_last_completed_head_sequence", "sweep_target_sequence",
                  "valid", "verified_through_hash", "verified_through_sequence",
              }
              try:
                  checkpoint_audit = base64.urlsafe_b64decode(
                      checkpoint["audit_hash"] + "="
                  )
              except (KeyError, TypeError, ValueError):
                  return False
              checkpoint_hash = "sha256:" + checkpoint_audit.hex()
              if (
                  not isinstance(audit, dict)
                  or set(audit) != audit_fields
                  or audit.get("valid") is not True
                  or audit.get("sticky_failure") is not False
                  or audit.get("catching_up") is not False
                  or audit.get("error_type") is not None
                  or type(audit.get("lag")) is not int
                  or audit.get("lag") != 0
                  or audit.get("captured_head_sequence")
                  != checkpoint.get("audit_sequence")
                  or audit.get("verified_through_sequence")
                  != checkpoint.get("audit_sequence")
                  or audit.get("captured_head_hash") != checkpoint_hash
                  or audit.get("verified_through_hash") != checkpoint_hash
                  or type(audit.get("last_full_verification_at_ns")) is not int
                  or not 0
                  < audit["last_full_verification_at_ns"]
                  <= (1 << 63) - 1
                  or type(audit.get("page_size")) is not int
                  or not 1 <= audit["page_size"] <= 1_000
                  or not valid_sha256(audit.get("schema_definition_sha256"))
                  or audit.get("schema_definition_sha256")
                  != value.get("sqlite_schema_sha256")
                  or type(audit.get("sweep_cursor_sequence")) is not int
                  or type(audit.get("sweep_target_sequence")) is not int
                  or not -1
                  <= audit["sweep_cursor_sequence"]
                  <= (1 << 63) - 1
                  or not -1
                  <= audit["sweep_target_sequence"]
                  <= (1 << 63) - 1
                  or audit["sweep_cursor_sequence"] > audit["sweep_target_sequence"]
                  or type(audit.get("sweep_last_completed_at_ns")) is not int
                  or not 0 < audit["sweep_last_completed_at_ns"]
                  <= (1 << 63) - 1
                  or type(audit.get("sweep_last_completed_head_sequence")) is not int
                  or not -1
                  <= audit["sweep_last_completed_head_sequence"]
                  <= (1 << 63) - 1
                  or not valid_sha256(audit.get("sweep_last_completed_head_hash"))
              ):
                  return False
              if (
                  audit["last_full_verification_at_ns"]
                  > audit["sweep_last_completed_at_ns"]
                  or audit["sweep_last_completed_at_ns"] > value["captured_at_ns"]
                  or audit["sweep_target_sequence"] > audit["captured_head_sequence"]
                  or audit["sweep_last_completed_head_sequence"]
                  > audit["sweep_target_sequence"]
                  or (
                      audit["sweep_last_completed_head_sequence"]
                      == audit["captured_head_sequence"]
                      and audit["sweep_last_completed_head_hash"] != checkpoint_hash
                  )
                  or (
                      audit["sweep_last_completed_head_sequence"] == -1
                      and audit["sweep_last_completed_head_hash"]
                      != "sha256:" + "0" * 64
                  )
              ):
                  return False
              invariant = value.get("invariant")
              resources = value.get("resources")
              resource_fields = {
                  "consumed", "free_pool", "initial_share", "lease_residual",
                  "transferred_in", "transferred_out",
              }
              invariant_fields = resource_fields | {
                  "checked_at_ns", "config_epoch", "envelope_id", "healthy",
                  "tenant_id",
              }
              if not isinstance(invariant, dict) or set(invariant) != invariant_fields:
                  return False
              dimensions = (
                  len(invariant["initial_share"])
                  if valid_resource_vector(invariant.get("initial_share")) else None
              )
              if (
                  dimensions != 1
                  or not isinstance(resources, dict)
                  or set(resources) != resource_fields
                  or any(
                      not valid_resource_vector(invariant.get(name), dimensions=dimensions)
                      or resources.get(name) != invariant.get(name)
                      for name in resource_fields
                  )
                  or any(
                      invariant["initial_share"][index]
                      + invariant["transferred_in"][index]
                      != invariant["free_pool"][index]
                      + invariant["lease_residual"][index]
                      + invariant["consumed"][index]
                      + invariant["transferred_out"][index]
                      for index in range(dimensions)
                  )
                  or any(
                      invariant["initial_share"][index]
                      + invariant["transferred_in"][index]
                      > (1 << 63) - 1
                      for index in range(dimensions)
                  )
                  or invariant.get("tenant_id")
                  != "production-acceptance-tenant"
                  or invariant.get("envelope_id")
                  != "production-acceptance-envelope"
                  or type(invariant.get("config_epoch")) is not int
                  or invariant.get("config_epoch") != 1
                  or invariant.get("checked_at_ns") != value.get("checked_at_ns")
                  or invariant.get("healthy") is not True
                  or value.get("invariant_healthy") is not True
                  or value.get("clock_healthy") is not True
                  or value.get("signing_key_healthy") is not True
                  or value.get("observation_eligible") is not True
              ):
                  return False
              exporter = value.get("audit_exporter")
              peer = value.get("peer_dispatcher")
              if (
                  not valid_audit_exporter_status(exporter)
                  or not valid_peer_status(
                      peer,
                      node=node,
                      published_at_ns=value["published_at_ns"],
                  )
                  or value.get("service_ready") is not True
                  or value.get("ready")
                  is not (
                      exporter.get("healthy") is True
                      and peer.get("healthy") is True
                  )
              ):
                  return False
              return (
                  valid_outbox_status(value.get("audit_outbox"))
                  and valid_leases_status(value.get("leases"))
                  and valid_receipts_status(value.get("receipts"))
                  and valid_runtime_status(value.get("runtime"))
                  and valid_capacity_status(value.get("storage_capacity"))
                  and valid_transfers_status(value.get("transfers"))
              )

          def valid_retry_scope(value):
              return (
                  isinstance(value, dict)
                  and set(value) == {"first_error", "last_error"}
                  and all(
                      item is None or isinstance(item, str)
                      for item in value.values()
                  )
              )

          def valid_observation_timing(value, *, planned):
              return (
                  isinstance(value, dict)
                  and set(value) == observation_timing_fields
                  and finite_number(value.get("started_elapsed_seconds"))
                  and finite_number(value.get("completed_elapsed_seconds"))
                  and float(value["completed_elapsed_seconds"])
                  >= float(value["started_elapsed_seconds"])
                  and (
                      value.get("metrics_observed_elapsed_seconds") is None
                      if planned
                      else finite_number(value.get("metrics_observed_elapsed_seconds"))
                      and float(value["started_elapsed_seconds"])
                      <= float(value["metrics_observed_elapsed_seconds"])
                      <= float(value["completed_elapsed_seconds"])
                  )
                  and type(value.get("request_retries")) is int
                  and value.get("request_retries") == 0
                  and type(value.get("request_count")) is int
                  and value.get("request_count") in ({0, 1} if planned else {1})
                  and value.get("request_path") == "/v1/metrics"
                  and valid_retry_scope(value.get("retry_errors"))
              )

          def valid_sample_request_budget(request_total, planned_count):
              return (
                  type(request_total) is int
                  and type(planned_count) is int
                  and planned_count in {0, 1}
                  and (
                      request_total == 3
                      if planned_count == 0
                      else request_total in {2, 3}
                  )
              )

          def valid_observation_document(document, *, node):
              if (
                  not isinstance(document, dict)
                  or set(document) != observation_document_fields
                  or not valid_observation_timing(
                      document.get("observation"), planned=False
                  )
              ):
                  return False
              snapshot = document.get("observation_snapshot")
              if not valid_observation_snapshot(snapshot, node=node):
                  return False
              invariant = snapshot["invariant"]
              summary_invariant = document.get("invariant")
              invariant_summary_fields = {
                  "consumed", "free_pool", "healthy", "lease_residual",
                  "transferred_in", "transferred_out",
              }
              return (
                  valid_audit_exporter_projection(
                      document.get("audit_exporter"), snapshot.get("audit_exporter")
                  )
                  and document.get("audit_outbox") == snapshot.get("audit_outbox")
                  and document.get("authority_anchor") == snapshot.get("authority_anchor")
                  and isinstance(summary_invariant, dict)
                  and set(summary_invariant) == invariant_summary_fields
                  and summary_invariant
                  == {name: invariant[name] for name in invariant_summary_fields}
                  and document.get("peer_dispatcher") == snapshot.get("peer_dispatcher")
                  and document.get("ready") == snapshot.get("ready")
                  and document.get("receipts") == snapshot.get("receipts")
                  and document.get("service_ready") == snapshot.get("service_ready")
                  and document.get("storage_capacity")
                  == snapshot.get("storage_capacity")
                  and document.get("transfers") == snapshot.get("transfers")
                  and document.get("observation_generation")
                  == snapshot.get("generation")
                  and document.get("observation_revision")
                  == snapshot.get("revision")
                  and document.get("observation_snapshot_id")
                  == snapshot.get("snapshot_id")
              )

          def valid_terminal_fence(
              terminal,
              *,
              node,
              restart_id,
              expected_lifetime,
              prior_authority,
              prior_observation,
              full_audit_verification,
          ):
              compact_prior_valid = (
                  isinstance(prior_observation, dict)
                  and set(prior_observation) == {
                      "audit_verification", "authority_checkpoint", "generation",
                      "lifetime_id", "sqlite_schema_sha256",
                  }
                  and isinstance(prior_observation.get("generation"), str)
                  and re.fullmatch(
                      r"[0-9a-f]{32}", prior_observation["generation"]
                  ) is not None
                  and isinstance(prior_observation.get("lifetime_id"), str)
                  and re.fullmatch(
                      r"[0-9a-f]{32}", prior_observation["lifetime_id"]
                  ) is not None
                  and prior_observation.get("lifetime_id") == expected_lifetime
                  and valid_sha256(prior_observation.get("sqlite_schema_sha256"))
                  and isinstance(prior_observation.get("audit_verification"), dict)
                  and set(prior_observation["audit_verification"])
                  == {"last_full_verification_at_ns"}
                  and type(
                      prior_observation["audit_verification"].get(
                          "last_full_verification_at_ns"
                      )
                  ) is int
                  and prior_observation["audit_verification"][
                      "last_full_verification_at_ns"
                  ] > 0
                  and valid_core_checkpoint(
                      prior_observation.get("authority_checkpoint"), node=node
                  )
              )
              if (
                  not isinstance(terminal, dict)
                  or set(terminal) != {
                      "authority_anchor", "authority_checkpoint",
                      "fenced_at_monotonic_ns", "lifetime_id",
                      "namespace_process_id", "restart_id", "schema",
                      "terminal_audit_proof", "warden_id",
                  }
                  or (
                      not valid_observation_snapshot(prior_observation, node=node)
                      if full_audit_verification
                      else not (
                          compact_prior_valid
                          or valid_observation_snapshot(prior_observation, node=node)
                      )
                  )
              ):
                  return False
              authority = terminal.get("authority_anchor")
              checkpoint = terminal.get("authority_checkpoint")
              proof = terminal.get("terminal_audit_proof")
              prior_checkpoint = prior_observation.get("authority_checkpoint")
              prior_audit = prior_observation.get("audit_verification")
              if (
                  terminal.get("schema") != "lets.authority-admission-fence/v1"
                  or terminal.get("restart_id") != restart_id
                  or terminal.get("warden_id") != node
                  or terminal.get("lifetime_id") != expected_lifetime
                  or type(terminal.get("namespace_process_id")) is not int
                  or terminal["namespace_process_id"] <= 0
                  or type(terminal.get("fenced_at_monotonic_ns")) is not int
                  or terminal["fenced_at_monotonic_ns"] < 0
                  or not valid_authority(authority, fenced=True, terminal=True)
                  or authority.get("lifetime_id") != expected_lifetime
                  or authority.get("fence_id") != restart_id
                  or terminal.get("namespace_process_id")
                  != authority.get("namespace_process_id")
                  or terminal.get("fenced_at_monotonic_ns")
                  != authority.get("fenced_at_monotonic_ns")
                  or not valid_authority(prior_authority, fenced=False)
                  or prior_authority.get("state") != "healthy"
                  or (
                      full_audit_verification
                      and prior_observation.get("authority_anchor") != prior_authority
                  )
                  or prior_authority.get("lifetime_id") != expected_lifetime
                  or authority.get("namespace_process_id")
                  != prior_authority.get("namespace_process_id")
                  or any(
                      authority[name] < prior_authority[name]
                      for name in authority_counter_fields
                  )
                  or (
                      prior_authority.get("first_fault") is not None
                      and authority.get("first_fault")
                      != prior_authority.get("first_fault")
                  )
                  or not valid_core_checkpoint(checkpoint, node=node)
                  or not valid_core_checkpoint(prior_checkpoint, node=node)
                  or not core_checkpoint_extends(prior_checkpoint, checkpoint)
                  or not isinstance(proof, dict)
                  or set(proof) != terminal_audit_proof_fields
                  or proof.get("schema") != "lets.terminal-audit-proof/v1"
                  or proof.get("valid") is not True
                  or proof.get("verification_mode")
                  != (
                      "full"
                      if full_audit_verification
                      else "trusted-startup-plus-tail"
                  )
                  or proof.get("lifetime_id") != expected_lifetime
                  or proof.get("generation") != prior_observation.get("generation")
                  or type(proof.get("verified_at_ns")) is not int
                  or proof["verified_at_ns"] <= 0
                  or type(proof.get("startup_full_verification_at_ns")) is not int
                  or not 0 < proof["startup_full_verification_at_ns"]
                  <= proof["verified_at_ns"]
                  or not isinstance(prior_audit, dict)
                  or proof.get("startup_full_verification_at_ns")
                  != prior_audit.get("last_full_verification_at_ns")
                  or proof.get("verified_head_sequence")
                  != checkpoint.get("audit_sequence")
                  or proof.get("authority_state_revision")
                  != checkpoint.get("state_revision")
                  or proof.get("database_instance_id")
                  != checkpoint.get("database_instance_id")
                  or proof.get("authority_checkpoint_sha256")
                  != sha256_json(checkpoint)
                  or proof.get("schema_definition_sha256")
                  != prior_observation.get("sqlite_schema_sha256")
                  or not valid_sha256(proof.get("schema_definition_sha256"))
              ):
                  return False
              try:
                  audit_hash = base64.urlsafe_b64decode(
                      checkpoint["audit_hash"] + "="
                  )
              except (KeyError, TypeError, ValueError):
                  return False
              return proof.get("verified_head_hash") == (
                  "sha256:" + audit_hash.hex()
              )

          def valid_observation_progression(prior, current, *, allow_same_snapshot):
              if not isinstance(prior, dict) or not isinstance(current, dict):
                  return False
              prior_checkpoint = prior.get("authority_checkpoint")
              current_checkpoint = current.get("authority_checkpoint")
              if not isinstance(prior_checkpoint, dict) or not isinstance(
                  current_checkpoint, dict
              ):
                  return False
              same_lifetime = current.get("lifetime_id") == prior.get("lifetime_id")
              same_snapshot = current.get("snapshot_id") == prior.get("snapshot_id")
              if (
                  current.get("database_instance_id")
                  != prior.get("database_instance_id")
                  or current.get("sqlite_schema_sha256")
                  != prior.get("sqlite_schema_sha256")
                  or not valid_core_checkpoint(
                      prior_checkpoint,
                      node=prior_checkpoint.get("warden_id"),
                  )
                  or not valid_core_checkpoint(
                      current_checkpoint,
                      node=current_checkpoint.get("warden_id"),
                  )
                  or not core_checkpoint_extends(
                      prior_checkpoint, current_checkpoint
                  )
              ):
                  return False
              if not same_lifetime:
                  return (
                      current.get("generation") != prior.get("generation")
                      and not same_snapshot
                  )
              if (
                  current.get("generation") != prior.get("generation")
                  or type(current.get("revision")) is not int
                  or type(prior.get("revision")) is not int
                  or current.get("core_state_revision", -1)
                  < prior.get("core_state_revision", -1)
              ):
                  return False
              if allow_same_snapshot:
                  return (
                      current["revision"] >= prior["revision"]
                      and (
                          (current["revision"] == prior["revision"]) == same_snapshot
                      )
                  )
              return current["revision"] > prior["revision"] and not same_snapshot

          raw_observation_valid = isinstance(health_samples_value, list)
          observation_histories = {node: [] for node in expected_nodes}
          observation_transitions = {node: [] for node in expected_nodes}
          final_observations = {}
          observation_schema_digests = set()
          if raw_observation_valid:
              for sample in health_samples:
                  nodes = sample.get("nodes") if isinstance(sample, dict) else None
                  planned_nodes = (
                      sample.get("planned_unavailable_nodes")
                      if isinstance(sample, dict) else None
                  )
                  if (
                      not isinstance(nodes, dict)
                      or set(nodes) != expected_nodes
                      or not isinstance(planned_nodes, list)
                      or len(planned_nodes) > 1
                      or any(
                          not isinstance(node, str) or node not in expected_nodes
                          for node in planned_nodes
                      )
                      or len(set(planned_nodes)) != len(planned_nodes)
                  ):
                      raw_observation_valid = False
                      continue
                  request_total = 0
                  for node in expected_nodes:
                      document = nodes[node]
                      if node in planned_nodes:
                          valid = (
                              isinstance(document, dict)
                              and set(document) == {"observation", "planned_unavailable"}
                              and isinstance(document.get("planned_unavailable"), dict)
                              and valid_observation_timing(
                                  document.get("observation"), planned=True
                              )
                          )
                          raw_observation_valid = raw_observation_valid and valid
                          if valid:
                              request_total += document["observation"]["request_count"]
                          continue
                      valid = valid_observation_document(document, node=node)
                      raw_observation_valid = raw_observation_valid and valid
                      if not valid:
                          continue
                      request_total += document["observation"]["request_count"]
                      snapshot = document["observation_snapshot"]
                      observation_histories[node].append(snapshot)
                      observation_schema_digests.add(snapshot["sqlite_schema_sha256"])
                  if not valid_sample_request_budget(
                      request_total, len(planned_nodes)
                  ):
                      raw_observation_valid = False
          if (
              not isinstance(final_nodes, dict)
              or set(final_nodes) != expected_nodes
          ):
              raw_observation_valid = False
          else:
              final_request_total = 0
              for node in expected_nodes:
                  document = final_nodes[node]
                  valid = valid_observation_document(document, node=node)
                  raw_observation_valid = raw_observation_valid and valid
                  if not valid:
                      continue
                  final_request_total += document["observation"]["request_count"]
                  snapshot = document["observation_snapshot"]
                  final_observations[node] = snapshot
                  observation_schema_digests.add(snapshot["sqlite_schema_sha256"])
              raw_observation_valid = raw_observation_valid and final_request_total == 3
          for node, snapshots in observation_histories.items():
              if not snapshots:
                  raw_observation_valid = False
                  continue
              seen_snapshot_ids = set()
              previous = None
              for snapshot in snapshots:
                  if snapshot["snapshot_id"] in seen_snapshot_ids:
                      raw_observation_valid = False
                  seen_snapshot_ids.add(snapshot["snapshot_id"])
                  if previous is not None:
                      same_lifetime = (
                          snapshot["lifetime_id"] == previous["lifetime_id"]
                      )
                      if not valid_observation_progression(
                          previous, snapshot, allow_same_snapshot=False
                      ):
                          raw_observation_valid = False
                      if not same_lifetime:
                          observation_transitions[node].append(
                              (previous["lifetime_id"], snapshot["lifetime_id"])
                          )
                  previous = snapshot
              final_snapshot = final_observations.get(node)
              if not isinstance(final_snapshot, dict) or previous is None:
                  raw_observation_valid = False
                  continue
              if (
                  final_snapshot["lifetime_id"] != previous["lifetime_id"]
                  or not valid_observation_progression(
                      previous, final_snapshot, allow_same_snapshot=True
                  )
              ):
                  raw_observation_valid = False
          if len(observation_schema_digests) != 1:
              raw_observation_valid = False
          computed_conservation = None
          if raw_observation_valid:
              try:
                  final_invariants = [
                      final_nodes[node]["observation_snapshot"]["invariant"]
                      for node in sorted(expected_nodes)
                  ]
                  dimensions = len(final_invariants[0]["transferred_in"])
                  transferred_in = [
                      sum(item["transferred_in"][index] for item in final_invariants)
                      for index in range(dimensions)
                  ]
                  transferred_out = [
                      sum(item["transferred_out"][index] for item in final_invariants)
                      for index in range(dimensions)
                  ]
                  computed_conservation = {
                      "balanced": transferred_in == transferred_out,
                      "transferred_in": transferred_in,
                      "transferred_out": transferred_out,
                  }
                  raw_observation_valid = (
                      computed_conservation["balanced"] is True
                      and isinstance(conservation, dict)
                      and set(conservation) == set(computed_conservation)
                      and conservation == computed_conservation
                  )
              except (KeyError, TypeError, IndexError):
                  raw_observation_valid = False
          if not raw_observation_valid:
              failures.append(
                  "soak raw observation snapshots or one-request sampler binding is invalid"
              )

          raw_authority_valid = (
              cycle_metrics_valid
              and raw_terminal_capture_valid
              and raw_observation_valid
          )
          terminal_authorities = []
          all_lifetimes = set()
          executor_raw = workload.get("executor")
          recovery_events = (
              executor_raw.get("transport_recovery_events")
              if isinstance(executor_raw, dict) else None
          )
          executor_terminals = (
              executor_raw.get("terminal_statuses")
              if isinstance(executor_raw, dict) else None
          )
          executor_reopen_every = configuration.get("executor_reopen_every_cycles")
          verification_executor = verification.get("executor")
          final_executor_terminal = (
              verification_executor.get("terminal_status")
              if isinstance(verification_executor, dict) else None
          )
          try:
              event = recovery_events[0]
              original = event["original_transport_error"]
              faulted = event["faulted_authority_anchor"]
              recovered = event["recovered_authority_anchor"]
              raw_authority_valid = raw_authority_valid and (
                  isinstance(recovery_events, list)
                  and len(recovery_events) == 1
                  and isinstance(event, dict)
                  and set(event) == {
                      "durable_claim_outcome", "faulted_authority_anchor",
                      "faulting_call_effect_executed", "ordinal",
                      "original_call_raised", "original_transport_error", "phase",
                      "primary_returned", "protected_effect_executed_after_recovery",
                      "receipt_id", "recovered_authority_anchor", "retry_outcome",
                  }
                  and type(event.get("ordinal")) is int
                  and event.get("ordinal") == 0
                  and event.get("original_call_raised") is True
                  and event.get("phase") == "primary_claim"
                  and event.get("primary_returned") is False
                  and event.get("durable_claim_outcome") == "burned_before_response"
                  and event.get("retry_outcome") == "replay_rejected"
                  and event.get("faulting_call_effect_executed") is False
                  and event.get("protected_effect_executed_after_recovery") is False
                  and valid_identifier(event.get("receipt_id"))
                  and isinstance(original, dict)
                  and set(original) == first_fault_fields - {"stage"}
                  and original.get("reason") == "helper_eof"
                  and original.get("operation") == "compare-and-set"
                  and original.get("request_flushed") is True
                  and original.get("mutation_uncertain") is True
                  and valid_authority(faulted, executor=True)
                  and faulted.get("state") == "recoverable_transport_fault"
                  and faulted.get("fault_stage") == "post_commit"
                  and faulted.get("fault_reason") == original.get("reason")
                  and faulted.get("first_fault") == {**original, "stage": "post_commit"}
                  and tuple(
                      faulted.get(name) for name in (
                          "transport_faults", "transport_fault_episodes",
                          "transport_recovery_attempts", "transport_recoveries",
                          "unresolved_transport_faults", "permanent_faults",
                      )
                  ) == (1, 1, 0, 0, 1, 0)
                  and valid_authority(recovered, executor=True, terminal=True)
                  and recovered.get("lifetime_id") == faulted.get("lifetime_id")
                  and recovered.get("first_fault") == faulted.get("first_fault")
                  and tuple(
                      recovered.get(name) for name in (
                          "transport_faults", "transport_fault_episodes",
                          "transport_recovery_attempts", "transport_recoveries",
                          "unresolved_transport_faults", "permanent_faults",
                      )
                  ) == (1, 1, 1, 1, 0, 0)
                  and isinstance(executor_terminals, list)
                  and type(executor_reopen_every) is int
                  and executor_reopen_every > 0
                  and executor_raw.get("reopen_count")
                  == cycles // executor_reopen_every
                  and len(executor_terminals) == executor_raw.get("reopen_count") + 1
                  and isinstance(final_executor_terminal, dict)
              )
              executor_status_fields = {
                  "anchor", "authority_anchor", "authority_healthy", "claim_sequence",
                  "database_bytes", "integrity", "live_claims", "live_watermarks",
                  "rollback_protected", "shared_memory_bytes", "wal_bytes",
              }
              verification_executor_fields = {
                  "anchor_claim_sequence", "authority_anchor", "authority_healthy",
                  "claim_sequence", "database_bytes", "integrity",
                  "rollback_protected", "terminal_status", "wal_bytes",
              }
              raw_authority_valid = raw_authority_valid and (
                  set(verification_executor) == verification_executor_fields
                  and verification_executor.get("authority_healthy") is True
                  and verification_executor.get("rollback_protected") is True
                  and verification_executor.get("integrity") == ["ok"]
                  and type(verification_executor.get("anchor_claim_sequence")) is int
                  and verification_executor["anchor_claim_sequence"] >= 0
                  and type(verification_executor.get("claim_sequence")) is int
                  and verification_executor["claim_sequence"] >= 0
                  and type(verification_executor.get("database_bytes")) is int
                  and verification_executor["database_bytes"] >= 0
                  and type(verification_executor.get("wal_bytes")) is int
                  and verification_executor["wal_bytes"] >= 0
              )
              combined_executor = [*executor_terminals, final_executor_terminal]
              prior_claim_sequence = -1
              prior_checkpoint = None
              stable_checkpoint_identity = None
              recovered_terminal_seen = False
              for ordinal, terminal in enumerate(combined_executor):
                  status = terminal.get("status") if isinstance(terminal, dict) else None
                  authority = (
                      status.get("authority_anchor") if isinstance(status, dict) else None
                  )
                  claim_sequence = status.get("claim_sequence") if isinstance(status, dict) else None
                  checkpoint = status.get("anchor") if isinstance(status, dict) else None
                  expected_source = (
                      "workload" if ordinal < len(executor_terminals)
                      else "final_verification"
                  )
                  expected_claim_sequence = (
                      2 * executor_reopen_every * (ordinal + 1)
                      if ordinal < executor_raw["reopen_count"]
                      else 2 * cycles
                  )
                  valid = (
                      isinstance(terminal, dict)
                      and set(terminal) == {"lifetime_id", "ordinal", "source", "status"}
                      and type(terminal.get("ordinal")) is int
                      and terminal.get("ordinal") == ordinal
                      and terminal.get("source") == expected_source
                      and isinstance(status, dict)
                      and set(status) == executor_status_fields
                      and valid_authority(authority, executor=True, terminal=True)
                      and terminal.get("lifetime_id") == authority.get("lifetime_id")
                      and authority["lifetime_id"] not in all_lifetimes
                      and type(claim_sequence) is int
                      and claim_sequence == expected_claim_sequence
                      and claim_sequence >= prior_claim_sequence
                      and status.get("rollback_protected") is True
                      and status.get("authority_healthy") is True
                      and status.get("integrity") == ["ok"]
                      and all(
                          type(status.get(name)) is int and status[name] >= 0
                          for name in (
                              "database_bytes", "live_claims", "live_watermarks",
                              "shared_memory_bytes", "wal_bytes",
                          )
                      )
                      and status["live_claims"] <= claim_sequence
                      and status["live_watermarks"] <= claim_sequence
                      and valid_executor_checkpoint(checkpoint)
                      and checkpoint.get("claim_sequence") == claim_sequence
                      and (
                          stable_checkpoint_identity is None
                          or checkpoint_identity(checkpoint) == stable_checkpoint_identity
                      )
                      and (
                          prior_checkpoint is None
                          or checkpoint["claim_sequence"]
                          != prior_checkpoint["claim_sequence"]
                          or checkpoint["claim_digest"]
                          == prior_checkpoint["claim_digest"]
                      )
                      and (
                          prior_checkpoint is None
                          or prior_checkpoint["clock_floor_ns"] is None
                          or (
                              checkpoint["clock_floor_ns"] is not None
                              and checkpoint["clock_floor_ns"]
                              >= prior_checkpoint["clock_floor_ns"]
                          )
                      )
                  )
                  raw_authority_valid = raw_authority_valid and valid
                  if not valid:
                      continue
                  all_lifetimes.add(authority["lifetime_id"])
                  terminal_authorities.append(authority)
                  prior_claim_sequence = claim_sequence
                  prior_checkpoint = checkpoint
                  if stable_checkpoint_identity is None:
                      stable_checkpoint_identity = checkpoint_identity(checkpoint)
                  if authority == recovered:
                      recovered_terminal_seen = True
              raw_authority_valid = raw_authority_valid and (
                  recovered_terminal_seen
                  and executor_terminals[-1].get("status") == executor_raw.get("status")
                  and final_executor_terminal["status"].get("authority_anchor")
                  == verification_executor.get("authority_anchor")
                  and final_executor_terminal["status"].get("claim_sequence")
                  == verification_executor.get("claim_sequence")
                  and final_executor_terminal["status"].get("authority_healthy")
                  == verification_executor.get("authority_healthy")
                  and final_executor_terminal["status"].get("rollback_protected")
                  == verification_executor.get("rollback_protected")
                  and final_executor_terminal["status"].get("database_bytes")
                  == verification_executor.get("database_bytes")
                  and final_executor_terminal["status"].get("wal_bytes")
                  == verification_executor.get("wal_bytes")
                  and final_executor_terminal["status"].get("integrity")
                  == verification_executor.get("integrity")
                  and final_executor_terminal["status"].get("anchor")
                  == executor_terminals[-1]["status"].get("anchor")
                  and verification_executor.get("anchor_claim_sequence") == 2 * cycles
                  and prior_claim_sequence == 2 * cycles
              )
          except (KeyError, TypeError, IndexError, AttributeError):
              raw_authority_valid = False

          final_core_fences = verification.get("terminal_authority_fences")
          full_audit_verifications = verification.get("full_audit_verifications")
          terminal_by_lifetime = {}
          recovery_baselines = {}
          planned_pairs = {node: [] for node in expected_nodes}
          fence_wrapper_fields = {
              "host_container_id", "host_exec_attempts", "host_pid",
              "host_validated_monotonic_seconds", "prior_authority_anchor", "result",
          }
          fence_result_fields = {
              "node", "request_retry_count", "schema", "status", "terminal",
          }
          fence_terminal_fields = {
              "authority_anchor", "authority_checkpoint", "fenced_at_monotonic_ns",
              "lifetime_id", "namespace_process_id", "restart_id", "schema",
              "terminal_audit_proof", "warden_id",
          }
          try:
              raw_authority_valid = raw_authority_valid and (
                  isinstance(final_core_fences, dict)
                  and set(final_core_fences) == expected_nodes
                  and isinstance(full_audit_verifications, dict)
                  and set(full_audit_verifications) == expected_nodes
              )
              for restart in restarts:
                  service = restart["service"]
                  fence = restart["authority_fence"]
                  result = fence["result"]
                  terminal = result["terminal"]
                  authority = terminal["authority_anchor"]
                  prior = fence["prior_authority_anchor"]
                  new = restart["new_authority_anchor"]
                  armed = restart["workload_coordination"]["armed"]
                  marker = armed["marker"]
                  armed_ack = armed["acknowledgement"]
                  prior_observation = armed_ack.get("prior_observation")
                  recovery_ack = restart["workload_coordination"]["completed"][
                      "recovery_acknowledgement"
                  ]
                  valid = (
                      service in expected_nodes
                      and set(fence) == fence_wrapper_fields
                      and type(fence.get("host_exec_attempts")) is int
                      and fence["host_exec_attempts"] >= 1
                      and set(result) == fence_result_fields
                      and type(result.get("request_retry_count")) is int
                      and result["request_retry_count"] >= 0
                      and result.get("schema")
                      == "lets.production-profile-authority-fence/v1"
                      and result.get("status") == "passed"
                      and result.get("node") == service
                      and set(terminal) == fence_terminal_fields
                      and valid_authority(prior, fenced=False, terminal=True)
                      and valid_authority(new, fenced=False, terminal=True)
                      and prior == armed_ack.get("prior_authority_anchor")
                      and isinstance(prior_observation, dict)
                      and prior_observation.get("authority_checkpoint")
                      == armed_ack.get("prior_authority_checkpoint")
                      and valid_terminal_fence(
                          terminal,
                          node=service,
                          restart_id=marker.get("restart_id"),
                          expected_lifetime=prior.get("lifetime_id"),
                          prior_authority=prior,
                          prior_observation=prior_observation,
                          full_audit_verification=False,
                      )
                      and recovery_ack.get("recovered_authority_anchor") == new
                      and new.get("lifetime_id") != prior.get("lifetime_id")
                      and fence.get("host_container_id") == restart.get("prior_container_id")
                      and fence.get("host_pid") == restart.get("prior_pid")
                      and fence.get("host_validated_monotonic_seconds")
                      == armed_ack.get("host_fence_validated_monotonic_seconds")
                  )
                  raw_authority_valid = raw_authority_valid and valid
                  if not valid:
                      continue
                  old_lifetime = authority["lifetime_id"]
                  new_lifetime = new["lifetime_id"]
                  if old_lifetime in all_lifetimes or new_lifetime in recovery_baselines:
                      raw_authority_valid = False
                  all_lifetimes.add(old_lifetime)
                  terminal_by_lifetime[old_lifetime] = authority
                  terminal_authorities.append(authority)
                  recovery_baselines[new_lifetime] = new
                  planned_pairs[service].append((old_lifetime, new_lifetime))
              for node in expected_nodes:
                  terminal = final_core_fences[node]
                  authority = terminal["authority_anchor"]
                  fence_id = terminal.get("restart_id")
                  final_snapshot = final_nodes[node]["authority_anchor"]
                  final_observation = final_nodes[node]["observation_snapshot"]
                  valid = (
                      set(terminal) == fence_terminal_fields
                      and valid_authority(final_snapshot, fenced=False, terminal=True)
                      and valid_terminal_fence(
                          terminal,
                          node=node,
                          restart_id=(
                              f"final-verification-{configuration.get('seed')}-{node}"
                          ),
                          expected_lifetime=final_snapshot.get("lifetime_id"),
                          prior_authority=final_snapshot,
                          prior_observation=final_observation,
                          full_audit_verification=True,
                      )
                      and full_audit_verifications.get(node)
                      == terminal.get("terminal_audit_proof")
                      and authority["lifetime_id"] not in all_lifetimes
                  )
                  raw_authority_valid = raw_authority_valid and valid
                  if not valid:
                      continue
                  all_lifetimes.add(authority["lifetime_id"])
                  terminal_by_lifetime[authority["lifetime_id"]] = authority
                  terminal_authorities.append(authority)
              for lifetime, baseline in recovery_baselines.items():
                  terminal = terminal_by_lifetime.get(lifetime)
                  raw_authority_valid = raw_authority_valid and (
                      isinstance(terminal, dict)
                      and terminal.get("namespace_process_id")
                      == baseline.get("namespace_process_id")
                      and all(
                          terminal[name] >= baseline[name]
                          for name in authority_counter_fields
                      )
                      and (
                          baseline.get("first_fault") is None
                          or terminal.get("first_fault") == baseline.get("first_fault")
                      )
                  )
              observed = {node: [] for node in expected_nodes}
              for sample in health_samples:
                  nodes = sample.get("nodes") if isinstance(sample, dict) else None
                  if not isinstance(nodes, dict):
                      raw_authority_valid = False
                      continue
                  for node in expected_nodes:
                      document = nodes.get(node)
                      if not isinstance(document, dict) or "planned_unavailable" in document:
                          continue
                      authority = document.get("authority_anchor")
                      terminal = (
                          terminal_by_lifetime.get(authority.get("lifetime_id"))
                          if isinstance(authority, dict) else None
                      )
                      valid = (
                          valid_authority(authority, fenced=False, terminal=True)
                          and isinstance(terminal, dict)
                          and terminal.get("namespace_process_id")
                          == authority.get("namespace_process_id")
                          and all(
                              terminal[name] >= authority[name]
                              for name in authority_counter_fields
                          )
                          and (
                              authority.get("first_fault") is None
                              or terminal.get("first_fault") == authority.get("first_fault")
                          )
                      )
                      raw_authority_valid = raw_authority_valid and valid
                      if valid:
                          observed[node].append(authority)
              for node, snapshots in observed.items():
                  if not snapshots:
                      raw_authority_valid = False
                      continue
                  transitions = []
                  previous = snapshots[0]
                  for current in snapshots[1:]:
                      if current["lifetime_id"] == previous["lifetime_id"]:
                          raw_authority_valid = raw_authority_valid and (
                              current["namespace_process_id"]
                              == previous["namespace_process_id"]
                              and all(
                                  current[name] >= previous[name]
                                  for name in authority_counter_fields
                              )
                              and (
                                  previous["first_fault"] is None
                                  or current["first_fault"] == previous["first_fault"]
                              )
                          )
                      else:
                          transitions.append(
                              (previous["lifetime_id"], current["lifetime_id"])
                          )
                      previous = current
                  raw_authority_valid = raw_authority_valid and (
                      transitions == planned_pairs[node]
                      and observation_transitions[node] == planned_pairs[node]
                      and final_core_fences[node]["authority_anchor"]["lifetime_id"]
                      == previous["lifetime_id"]
                  )
          except (KeyError, TypeError, IndexError, AttributeError):
              raw_authority_valid = False

          authority_totals = {name: 0 for name in authority_counter_fields}
          for status in terminal_authorities:
              for name in authority_counter_fields:
                  authority_totals[name] += status[name]
          raw_authority_valid = raw_authority_valid and (
              authority_totals["transport_faults"]
              == authority_totals["transport_fault_episodes"]
              == authority_totals["transport_recovery_attempts"]
              == authority_totals["transport_recoveries"]
              == 1
              and authority_totals["permanent_faults"] == 0
              and authority_summary.get("passed") is True
              and set(authority_summary) == {
                  "core_lifetime_count", "executor_lifetime_count",
                  "global_counters", "passed", "terminal_lifetime_count",
              }
              and isinstance(authority_summary.get("global_counters"), dict)
              and set(authority_summary["global_counters"])
              == set(authority_counter_fields)
              and all(
                  type(value) is int and value >= 0
                  for value in authority_summary["global_counters"].values()
              )
              and authority_summary.get("global_counters") == authority_totals
              and type(authority_summary.get("core_lifetime_count")) is int
              and authority_summary.get("core_lifetime_count")
              == len(terminal_by_lifetime)
              and type(authority_summary.get("executor_lifetime_count")) is int
              and authority_summary.get("executor_lifetime_count")
              == len(all_lifetimes) - len(terminal_by_lifetime)
              and type(authority_summary.get("terminal_lifetime_count")) is int
              and authority_summary.get("terminal_lifetime_count")
              == len(terminal_authorities)
          )
          if not raw_authority_valid:
              failures.append("soak authority lifetime and recovery budget is not raw-bound")
          # END RAW AUTHORITY EVIDENCE VERIFIER
          if failures:
              raise SystemExit("; ".join(failures))
          PY
      - name: Archive failed production-profile soak diagnostics
        if: ${{ always() && (failure() || cancelled()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: >-
            diagnostic-production-soak-${{ needs.verify.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/generated/production-profile-soak.json
          if-no-files-found: error
          retention-days: 90
      - name: Archive verified production-profile soak release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-production-soak-${{ needs.verify.outputs.version }}
          path: results/generated/production-profile-soak.json
          if-no-files-found: error
          retention-days: 90

  image:
    name: Scan, attest, sign, and promote the accepted OCI candidate
    needs: [verify, package, image-candidate, production-acceptance, production-soak]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Compute immutable release tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
      - name: Verify both candidate architectures are present
        id: manifest
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ needs.image-candidate.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE_REF" \
            --format '{{json .Manifest}}' > image-manifest.json
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          digest_pattern = re.compile(r"sha256:[0-9a-f]{64}")
          image_ref = os.environ["IMAGE_REF"]
          index_digest = image_ref.rsplit("@", 1)[-1]
          if digest_pattern.fullmatch(index_digest) is None:
              raise SystemExit(f"candidate has an invalid index digest: {index_digest!r}")

          manifest = json.loads(Path("image-manifest.json").read_text(encoding="utf-8"))
          required = {"linux/amd64", "linux/arm64"}
          descriptors: dict[str, str] = {}
          for entry in manifest.get("manifests", []):
              platform = entry.get("platform") or {}
              name = f'{platform.get("os", "")}/{platform.get("architecture", "")}'
              if name not in required:
                  continue
              digest = entry.get("digest", "")
              if digest_pattern.fullmatch(digest) is None:
                  raise SystemExit(f"published {name} manifest has an invalid digest: {digest!r}")
              if name in descriptors:
                  raise SystemExit(f"published image has duplicate {name} manifests")
              descriptors[name] = digest
          missing = required - descriptors.keys()
          if missing:
              raise SystemExit(f"published image is missing platforms: {sorted(missing)}")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f'amd64_digest={descriptors["linux/amd64"]}\n')
              stream.write(f'arm64_digest={descriptors["linux/arm64"]}\n')
          PY
      - name: Require patched SQLite in both exact published architectures
        env:
          AMD64_DIGEST: ${{ steps.manifest.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.manifest.outputs.arm64_digest }}
        shell: bash
        run: |
          set -euo pipefail
          : > sqlite-runtime-versions.txt
          for image in "linux/amd64 $AMD64_DIGEST" "linux/arm64 $ARM64_DIGEST"; do
            read -r platform child_digest <<< "$image"
            version="$(docker run --rm --pull always --platform "$platform" \
              --user 10001:10001 --read-only --network none --cap-drop ALL \
              --security-opt no-new-privileges --entrypoint python \
              "$IMAGE_NAME@$child_digest" \
              -c 'import sqlite3; from lets.cli import _require_production_sqlite; _require_production_sqlite(); print(sqlite3.sqlite_version)')"
            printf '%s %s\n' "$platform" "$version" | tee -a sqlite-runtime-versions.txt
          done
      - name: Scan the exact published amd64 candidate with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ needs.image-candidate.outputs.digest }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          output: trivy-amd64.txt
          exit-code: 1
          version: v0.73.0
      - name: Scan the exact published arm64 candidate with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ needs.image-candidate.outputs.digest }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          output: trivy-arm64.txt
          exit-code: 1
          version: v0.73.0
      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.50.0
      - name: Generate and validate one SPDX SBOM per published architecture
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ needs.image-candidate.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            arch="${platform#linux/}"
            "${{ steps.syft.outputs.cmd }}" scan "$IMAGE_REF" \
              --from registry \
              --platform "$platform" \
              --output "spdx-json=lets-container-$arch.spdx.json" \
              --output "syft-json=lets-container-$arch.syft.json"
          done
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          digest_pattern = re.compile(r"sha256:[0-9a-f]{64}")
          image_ref = os.environ["IMAGE_REF"]
          index_digest = image_ref.rsplit("@", 1)[-1]
          if digest_pattern.fullmatch(index_digest) is None:
              raise SystemExit(f"candidate has an invalid index digest: {index_digest!r}")

          manifest = json.loads(Path("image-manifest.json").read_text(encoding="utf-8"))
          child_digests: dict[str, str] = {}
          for entry in manifest.get("manifests", []):
              platform = entry.get("platform") or {}
              name = f'{platform.get("os", "")}/{platform.get("architecture", "")}'
              if name in {"linux/amd64", "linux/arm64"}:
                  digest = entry.get("digest", "")
                  if name in child_digests or digest_pattern.fullmatch(digest) is None:
                      raise SystemExit(f"invalid or duplicate {name} manifest descriptor")
                  child_digests[name] = digest
          if child_digests.keys() != {"linux/amd64", "linux/arm64"}:
              raise SystemExit("candidate manifest does not contain exactly the required platforms")

          bindings: dict[str, object] = {
              "schema": "lets.container-sbom-index/v1",
              "image": image_ref,
              "index_digest": index_digest,
              "generator": {"name": "syft", "version": "1.50.0"},
              "platforms": {},
          }
          platform_bindings = bindings["platforms"]
          assert isinstance(platform_bindings, dict)
          for platform in ("linux/amd64", "linux/arm64"):
              arch = platform.removeprefix("linux/")
              native_path = Path(f"lets-container-{arch}.syft.json")
              spdx_path = Path(f"lets-container-{arch}.spdx.json")
              native = json.loads(native_path.read_text(encoding="utf-8"))
              spdx = json.loads(spdx_path.read_text(encoding="utf-8"))

              descriptor = native.get("descriptor") or {}
              source = native.get("source") or {}
              metadata = source.get("metadata") or {}
              if descriptor.get("name") != "syft" or descriptor.get("version") != "1.50.0":
                  raise SystemExit(f"{platform} SBOM was not generated by pinned Syft 1.50.0")
              if source.get("type") != "image" or source.get("version") != index_digest:
                  raise SystemExit(f"{platform} SBOM is not bound to candidate index {index_digest}")
              if metadata.get("os") != "linux" or metadata.get("architecture") != arch:
                  raise SystemExit(f"{platform} SBOM source metadata names the wrong platform")
              child_digest = child_digests[platform]
              if metadata.get("manifestDigest") != child_digest:
                  raise SystemExit(f"{platform} SBOM names the wrong child manifest")
              if image_ref not in (metadata.get("repoDigests") or []):
                  raise SystemExit(f"{platform} SBOM does not name the exact candidate reference")
              if not native.get("artifacts"):
                  raise SystemExit(f"{platform} native Syft result has no packages")

              creators = (spdx.get("creationInfo") or {}).get("creators") or []
              if not spdx.get("spdxVersion", "").startswith("SPDX-"):
                  raise SystemExit(f"{platform} output is not an SPDX document")
              if not spdx.get("documentNamespace") or not spdx.get("packages"):
                  raise SystemExit(f"{platform} SPDX document is incomplete")
              if "Tool: syft-1.50.0" not in creators:
                  raise SystemExit(f"{platform} SPDX document does not name pinned Syft 1.50.0")

              platform_bindings[platform] = {
                  "manifest_digest": child_digest,
                  "spdx_file": spdx_path.name,
                  "spdx_sha256": hashlib.sha256(spdx_path.read_bytes()).hexdigest(),
                  "package_count": len(spdx["packages"]),
              }

          Path("lets-container-sbom-index.json").write_text(
              json.dumps(bindings, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          printf '%s\n' "$IMAGE_REF" > image-digest.txt
      - name: Keyless-attest and verify each SPDX SBOM against its child manifest
        env:
          AMD64_DIGEST: ${{ steps.manifest.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.manifest.outputs.arm64_digest }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          for arch in amd64 arm64; do
            if [ "$arch" = "amd64" ]; then
              digest="$AMD64_DIGEST"
            else
              digest="$ARM64_DIGEST"
            fi
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "$arch child digest is missing or invalid: $digest" >&2
              exit 1
            fi
            predicate="lets-container-$arch.spdx.json"
            verification="lets-container-$arch.spdx-verification.json"
            cosign attest --yes \
              --predicate "$predicate" \
              --type spdxjson \
              "$IMAGE_NAME@$digest"
            cosign verify-attestation \
              --type spdxjson \
              --certificate-identity "$workflow_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-ref "$GITHUB_REF" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              --certificate-github-workflow-trigger push \
              --output json \
              "$IMAGE_NAME@$digest" > "$verification"
            ARCH="$arch" CHILD_DIGEST="$digest" VERIFICATION="$verification" python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          def json_documents(raw: str) -> list[object]:
              decoder = json.JSONDecoder()
              documents: list[object] = []
              offset = 0
              while offset < len(raw):
                  while offset < len(raw) and raw[offset].isspace():
                      offset += 1
                  if offset == len(raw):
                      break
                  document, offset = decoder.raw_decode(raw, offset)
                  documents.extend(document if isinstance(document, list) else [document])
              return documents

          expected_statement = {
              "_type": "https://in-toto.io/Statement/v0.1",
              "predicateType": "https://spdx.dev/Document",
              "subject": [
                  {
                      "digest": {
                          "sha256": os.environ["CHILD_DIGEST"].removeprefix("sha256:")
                      },
                      "name": os.environ["IMAGE_NAME"],
                  }
              ],
              "predicate": json.loads(
                  Path(f"lets-container-{os.environ['ARCH']}.spdx.json").read_text(
                      encoding="utf-8"
                  )
              ),
          }
          envelopes = json_documents(
              Path(os.environ["VERIFICATION"]).read_text(encoding="utf-8")
          )
          for envelope in envelopes:
              if not isinstance(envelope, dict) or not isinstance(envelope.get("payload"), str):
                  continue
              statement = json.loads(
                  base64.b64decode(envelope["payload"], validate=True).decode("utf-8")
              )
              if statement == expected_statement:
                  break
          else:
              raise SystemExit(
                  f"{os.environ['ARCH']} child manifest lacks its exact signed SPDX SBOM"
              )
          PY
          done
      - name: Keyless-sign and verify the exact image digest
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE_NAME@${{ needs.image-candidate.outputs.digest }}"
          workflow_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign sign --yes "$image"
          cosign verify \
            --certificate-identity "$workflow_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref "$GITHUB_REF" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            --certificate-github-workflow-trigger push \
            "$image" > image-signature-verification.json
      - name: Promote the verified digest to immutable release tags
        shell: bash
        env:
          RELEASE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          candidate_digest="${{ needs.image-candidate.outputs.digest }}"
          while IFS= read -r tag; do
            test -n "$tag" || continue
            existing_digest=""
            inspect_error="$(mktemp)"
            if existing_digest="$(
              docker buildx imagetools inspect "$tag" \
                --format '{{.Manifest.Digest}}' 2>"$inspect_error"
            )"; then
              rm -f "$inspect_error"
              if [ "$existing_digest" != "$candidate_digest" ]; then
                echo "refusing to move existing release image tag: $tag" >&2
                echo "existing=$existing_digest candidate=$candidate_digest" >&2
                exit 1
              fi
              echo "$tag already resolves to the verified candidate digest"
            else
              if ! grep -Eiq 'manifest unknown|not found|404' "$inspect_error"; then
                cat "$inspect_error" >&2
                rm -f "$inspect_error"
                echo "could not prove that release image tag is absent: $tag" >&2
                exit 1
              fi
              rm -f "$inspect_error"
              docker buildx imagetools create \
                --tag "$tag" \
                "$IMAGE_NAME@$candidate_digest"
            fi
            promoted_digest="$(
              docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}'
            )"
            if [ "$promoted_digest" != "$candidate_digest" ]; then
              echo "release tag did not resolve to the verified candidate: $tag" >&2
              echo "resolved=$promoted_digest candidate=$candidate_digest" >&2
              exit 1
            fi
          done <<< "$RELEASE_TAGS"
      - name: Archive release image assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-${{ needs.verify.outputs.version }}
          path: |
            image-digest.txt
            image-manifest.json
            lets-container-amd64.spdx.json
            lets-container-arm64.spdx.json
            lets-container-sbom-index.json
            sqlite-runtime-versions.txt
            trivy-amd64.txt
            trivy-arm64.txt
          if-no-files-found: error
          retention-days: 90

  github-release:
    name: Publish GitHub release after every gate succeeds
    needs: [verify, package, production-acceptance, production-soak, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-inputs
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Require the exact nonempty, collision-free release asset set
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          source = Path("release-inputs")
          destination = Path("release-assets")
          expected = {
              f"release-package-{version}": {
                  "SHA256SUMS",
                  f"lets-deployment-{version}.tar.gz",
                  f"lets_agent-{version}-py3-none-any.whl",
                  f"lets_agent-{version}.tar.gz",
                  "lets-python.cdx.json",
              },
              f"release-production-acceptance-{version}": {
                  "production-profile-acceptance.json",
              },
              f"release-production-soak-{version}": {
                  "production-profile-soak.json",
              },
              f"release-image-{version}": {
                  "image-digest.txt",
                  "image-manifest.json",
                  "lets-container-amd64.spdx.json",
                  "lets-container-arm64.spdx.json",
                  "lets-container-sbom-index.json",
                  "sqlite-runtime-versions.txt",
                  "trivy-amd64.txt",
                  "trivy-arm64.txt",
              },
          }
          actual_groups = {path.name for path in source.iterdir() if path.is_dir()}
          unexpected_entries = {path.name for path in source.iterdir() if not path.is_dir()}
          if actual_groups != expected.keys() or unexpected_entries:
              raise SystemExit(
                  "release artifact groups are incomplete or unexpected: "
                  f"groups={sorted(actual_groups)!r}, entries={sorted(unexpected_entries)!r}"
              )

          destination.mkdir(exist_ok=False)
          seen: set[str] = set()
          for group_name, expected_files in expected.items():
              group = source / group_name
              actual_files = {path.name for path in group.iterdir() if path.is_file()}
              nested = {path.name for path in group.iterdir() if not path.is_file()}
              if actual_files != expected_files or nested:
                  raise SystemExit(
                      f"release artifact {group_name!r} has the wrong files: "
                      f"files={sorted(actual_files)!r}, entries={sorted(nested)!r}"
                  )
              collisions = seen & actual_files
              if collisions:
                  raise SystemExit(f"release asset name collision: {sorted(collisions)!r}")
              for name in sorted(actual_files):
                  artifact = group / name
                  if artifact.stat().st_size <= 0:
                      raise SystemExit(f"release asset is empty: {group_name}/{name}")
                  shutil.copy2(artifact, destination / name)
              seen.update(actual_files)
          PY
      - name: Extract exact compatibility, migration, and rollback release notes
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"(?ms)^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}\n"
              rf"(?P<body>.*?)(?=^## \[|\Z)",
              changelog,
          )
          if match is None:
              raise SystemExit("release changelog section is missing")
          notes = f"## LETS {version}\n\n{match.group('body').strip()}\n"
          required = (
              "### Compatibility, migration, and rollback",
              "Compatibility",
              "migration",
              "rollback",
          )
          missing = [value for value in required if value not in notes]
          if missing:
              raise SystemExit(f"release notes omit required lifecycle facts: {missing!r}")
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          PY
      - name: Verify package hashes and construct the complete release checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS
          python - <<'PY'
          import hashlib
          from pathlib import Path

          directory = Path(".")
          checksum_name = "RELEASE_SHA256SUMS"
          signature_name = f"{checksum_name}.sigstore.json"
          artifacts = sorted(
              path
              for path in directory.iterdir()
              if path.is_file() and path.name not in {checksum_name, signature_name}
          )
          if len(artifacts) != 15:
              raise SystemExit("release asset set is incomplete")
          lines = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}"
              for path in artifacts
          ]
          (directory / checksum_name).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          sha256sum --check RELEASE_SHA256SUMS
      - name: Keyless-sign and verify the complete release checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="release-assets/RELEASE_SHA256SUMS"
          bundle_name="RELEASE_SHA256SUMS.sigstore.json"
          bundle="release-assets/$bundle_name"
          workflow_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign sign-blob --yes \
            --bundle "$bundle" \
            "$manifest" > /dev/null
          test -s "$bundle"
          cosign verify-blob \
            --bundle "$bundle" \
            --certificate-identity "$workflow_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref "$GITHUB_REF" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            --certificate-github-workflow-trigger push \
            "$manifest"

          release_state="$(mktemp)"
          release_error="$(mktemp)"
          trap 'rm -f "$release_state" "$release_error"' EXIT
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            > "$release_state" 2> "$release_error"; then
            bundle_mode="$(RELEASE_STATE="$release_state" BUNDLE_NAME="$bundle_name" python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path(os.environ["RELEASE_STATE"]).read_text(encoding="utf-8"))
          matching = [
              asset
              for asset in (state.get("assets") or [])
              if asset.get("name") == os.environ["BUNDLE_NAME"]
          ]
          if len(matching) > 1:
              raise SystemExit("existing GitHub release has duplicate Sigstore bundles")
          is_draft = state.get("draft")
          if not isinstance(is_draft, bool):
              raise SystemExit("existing GitHub release has an invalid draft state")
          print("reuse" if is_draft is False and matching else "retain")
          PY
            )"
            if [ "$bundle_mode" = "reuse" ]; then
              remote_dir="$(mktemp -d)"
              gh release download "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$bundle_name" \
                --dir "$remote_dir"
              test "$(find "$remote_dir" -maxdepth 1 -type f -name "$bundle_name" | wc -l)" -eq 1
              remote_bundle="$remote_dir/$bundle_name"
              test -s "$remote_bundle"
              cosign verify-blob \
                --bundle "$remote_bundle" \
                --certificate-identity "$workflow_identity" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
                --certificate-github-workflow-ref "$GITHUB_REF" \
                --certificate-github-workflow-sha "$GITHUB_SHA" \
                --certificate-github-workflow-trigger push \
                "$manifest"
              mv "$remote_bundle" "$bundle"
              echo "reused the existing release's verified Sigstore bundle"
            else
              echo "retained the freshly signed bundle for a draft or bundle-free release"
            fi
          elif ! grep -Eiq 'HTTP 404|not found' "$release_error"; then
            cat "$release_error" >&2
            echo "could not prove that an existing release bundle is absent" >&2
            exit 1
          fi
      - name: Publish or safely resume the immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: LETS ${{ needs.verify.outputs.version }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          ref="repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}"
          object_type="$(gh api "$ref" --jq '.object.type')"
          object_sha="$(gh api "$ref" --jq '.object.sha')"
          test "$object_type" = "tag" || {
            echo "release tag stopped being annotated before publication" >&2
            exit 1
          }
          tag="repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}"
          test "$(gh api "$tag" --jq '.verification.verified')" = "true"
          test "$(gh api "$tag" --jq '.object.type')" = "commit"
          test "$(gh api "$tag" --jq '.object.sha')" = "$GITHUB_SHA" || {
            echo "release tag moved before publication" >&2
            exit 1
          }
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          expected = {
              "RELEASE_SHA256SUMS",
              "RELEASE_SHA256SUMS.sigstore.json",
              "SHA256SUMS",
              "image-digest.txt",
              "image-manifest.json",
              "lets-container-amd64.spdx.json",
              "lets-container-arm64.spdx.json",
              "lets-container-sbom-index.json",
              f"lets-deployment-{version}.tar.gz",
              "lets-python.cdx.json",
              f"lets_agent-{version}-py3-none-any.whl",
              f"lets_agent-{version}.tar.gz",
              "production-profile-acceptance.json",
              "production-profile-soak.json",
              "sqlite-runtime-versions.txt",
              "trivy-amd64.txt",
              "trivy-arm64.txt",
          }
          directory = Path("release-assets")
          actual = {path.name for path in directory.iterdir() if path.is_file()}
          nested = {path.name for path in directory.iterdir() if not path.is_file()}
          if actual != expected or nested:
              raise SystemExit(
                  "final release asset allowlist mismatch: "
                  f"files={sorted(actual)!r}, entries={sorted(nested)!r}"
              )
          PY
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 17
          state_file="$(mktemp)"
          view_error="$(mktemp)"
          if ! gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,assets,body \
            >"$state_file" 2>"$view_error"; then
            if ! grep -Eiq 'release not found|HTTP 404|not found' "$view_error"; then
              cat "$view_error" >&2
              echo "could not prove that the GitHub release is absent" >&2
              exit 1
            fi
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName,name,isDraft,isPrerelease,assets,body \
              >"$state_file"
          fi

          release_mode="$(RELEASE_STATE="$state_file" python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path(os.environ["RELEASE_STATE"]).read_text(encoding="utf-8"))
          expected = {path.name for path in Path("release-assets").iterdir() if path.is_file()}
          assets = state.get("assets") or []
          names = [asset.get("name") for asset in assets]
          if state.get("tagName") != os.environ["GITHUB_REF_NAME"]:
              raise SystemExit("existing GitHub release names the wrong tag")
          if state.get("name") != os.environ["RELEASE_TITLE"]:
              raise SystemExit("existing GitHub release has the wrong title")
          if state.get("isPrerelease") is not False:
              raise SystemExit("existing GitHub release is unexpectedly a prerelease")
          expected_body = Path("release-notes.md").read_text(encoding="utf-8").rstrip("\n")
          if state.get("isDraft") is not True and state.get("body", "").rstrip("\n") != expected_body:
              raise SystemExit("published GitHub release has the wrong lifecycle notes")
          if any(not isinstance(name, str) for name in names) or len(names) != len(set(names)):
              raise SystemExit("existing GitHub release has invalid or duplicate assets")
          unexpected = set(names) - expected
          if unexpected:
              raise SystemExit(
                  f"existing GitHub release has unexpected assets: {sorted(unexpected)!r}"
              )
          print("draft" if state.get("isDraft") is True else "published")
          PY
          )"

          verify_remote_assets() {
            remote_dir="$(mktemp -d)"
            gh release download "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$remote_dir"
            LOCAL_ASSETS="release-assets" REMOTE_ASSETS="$remote_dir" python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          local = Path(os.environ["LOCAL_ASSETS"])
          remote = Path(os.environ["REMOTE_ASSETS"])
          local_files = {path.name: path for path in local.iterdir() if path.is_file()}
          remote_files = {path.name: path for path in remote.iterdir() if path.is_file()}
          if local_files.keys() != remote_files.keys():
              raise SystemExit(
                  "GitHub release asset set mismatch: "
                  f"local={sorted(local_files)!r}, remote={sorted(remote_files)!r}"
              )
          for name, local_path in local_files.items():
              local_digest = hashlib.sha256(local_path.read_bytes()).digest()
              remote_digest = hashlib.sha256(remote_files[name].read_bytes()).digest()
              if local_digest != remote_digest:
                  raise SystemExit(f"GitHub release asset digest mismatch: {name}")
          PY
          }

          verify_immutable_release() {
            local release_state
            release_state="$(mktemp)"
            for _ in $(seq 1 15); do
              gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
                > "$release_state"
              if RELEASE_STATE="$release_state" python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path(os.environ["RELEASE_STATE"]).read_text(encoding="utf-8"))
          if state.get("immutable") is not True:
              raise SystemExit(1)
          if state.get("draft") is not False or state.get("prerelease") is not False:
              raise SystemExit("immutable release has an invalid publication state")
          if len(state.get("assets") or []) != 17:
              raise SystemExit("immutable release has the wrong asset count")
          expected_body = Path("release-notes.md").read_text(encoding="utf-8").rstrip("\n")
          if state.get("body", "").rstrip("\n") != expected_body:
              raise SystemExit("immutable release has the wrong lifecycle notes")
          PY
              then
                gh release verify "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
                rm -f "$release_state"
                return 0
              fi
              sleep 1
            done
            cat "$release_state" >&2
            rm -f "$release_state"
            if gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=true; then
              echo "mutable release was returned to draft" >&2
            else
              echo "release could not be returned to draft; inspect immutable state" >&2
            fi
            echo "GitHub release did not become immutable within its deadline" >&2
            return 1
          }

          if [ "$release_mode" = "published" ]; then
            verify_remote_assets
            verify_immutable_release
            echo "published GitHub release already has the exact verified asset set"
            exit 0
          fi

          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file release-notes.md
          gh release upload "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          verify_remote_assets
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease \
            >"$state_file"
          RELEASE_STATE="$state_file" python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path(os.environ["RELEASE_STATE"]).read_text(encoding="utf-8"))
          if (
              state.get("tagName") != os.environ["GITHUB_REF_NAME"]
              or state.get("isDraft") is not False
              or state.get("isPrerelease") is not False
          ):
              raise SystemExit("GitHub release did not become the expected published release")
          PY
          verify_remote_assets
          verify_immutable_release
